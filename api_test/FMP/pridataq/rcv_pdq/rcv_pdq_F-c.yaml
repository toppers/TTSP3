version: "$Id: rcv_pdq_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_pridataq_rcv_pdq_F_c:
  note: 【NGKI1892】【NGKI1910】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do_0:
    id     : TASK1
    syscall: rcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      rtsklist:
        - TASK1:
            vardata: data
            varpri : datapri

  do_1:
    id     : TASK2
    syscall: TTSP_INI_PDQ(PDQ1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    PDQ1:
      rtsklist:
