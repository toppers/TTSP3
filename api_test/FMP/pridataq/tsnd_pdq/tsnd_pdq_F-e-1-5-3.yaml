version: "$Id: tsnd_pdq_F-e-1-5-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_pridataq_tsnd_pdq_F_e_1_5_3:
  note: 【NGKI1871】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI
      prcid  : PRC_OTHER

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

    PDQ1:
      rtsklist:
