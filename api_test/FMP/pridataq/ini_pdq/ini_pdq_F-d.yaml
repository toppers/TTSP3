version: "$Id: ini_pdq_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_pridataq_ini_pdq_F_d:
  note: 【NGKI1908】【NGKI1909】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_MID
        - TASK4:
            data   : DATA_B
            datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: ini_pdq(PDQ1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: running

    PDQ1:
      stsklist:
