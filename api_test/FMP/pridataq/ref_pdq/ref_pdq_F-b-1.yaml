version: "$Id: ref_pdq_F-b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_pridataq_ref_pdq_F_b_1:
  note: 【NGKI1918】【NGKI1919】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rpdq:
          type: T_RPDQ
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1, &rpdq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rpdq:
          stskid : TASK2
          rtskid : TSK_NONE
          spdqcnt: 0
