version: "$Id: ref_pdq_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_pridataq_ref_pdq_F_a:
  note: 【NGKI1913】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rpdq:
          type   : T_RPDQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          spdqcnt: ANY_DATA_CNT
      prcid  : PRC_SELF

    PDQ1:
      type: P_DATAQUEUE

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1, &rpdq)
    ercd   : E_CTX

  post_condition:
