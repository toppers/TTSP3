version: "$Id: loc_mtx_F-e-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_loc_mtx_F_e_2_1:
  note: 【NGKI2083】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      locmtx :
        - MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_TPRI
      htskid  : TASK4
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: loc_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    MTX1:
      wtsklist:
        - TASK1:
        - TASK2:
        - TASK3:
