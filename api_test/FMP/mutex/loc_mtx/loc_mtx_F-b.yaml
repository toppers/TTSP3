version: "$Id: loc_mtx_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_loc_mtx_F_b:
  note: 【NGKI2079】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2

  do_0:
    id     : TASK1
    syscall: loc_mtx(MTX1)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    MTX1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    MTX1:
      wtsklist:
