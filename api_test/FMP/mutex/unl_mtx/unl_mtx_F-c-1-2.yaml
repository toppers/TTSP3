version: "$Id: unl_mtx_F-c-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_unl_mtx_F_c_1_2:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_NULL
      htskid  : TASK1
      wtsklist:
        - TASK2:
        - TASK3:

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK3:
