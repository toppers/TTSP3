version: "$Id: unl_mtx_F-b-5-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_unl_mtx_F_b_5_2:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_NULL
      htskid  : TASK1
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
