version: "$Id: ref_mtx_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_ref_mtx_F_a:
  note: 【NGKI2110】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        rmtx:
          type  : T_RMTX
          htskid: ANY_OBJECT_ID
          wtskid: ANY_OBJECT_ID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_CTX

  post_condition:
