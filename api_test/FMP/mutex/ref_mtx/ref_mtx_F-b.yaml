version: "$Id: ref_mtx_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mutex_ref_mtx_F_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        rmtx:
          type: T_RMTX
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      htskid  : TASK1
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmtx:
          htskid: TASK1
          wtskid: TASK2
