version: "$Id: ena_int_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_ena_int_F_d:
  note: TESRY_006，【NGKI3099】
  variation:
    api_support_ena_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      prcid  : PRC_SELF
      intreq : false

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id  : TASK1
    code: ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_0:
    INH1:
      intreq: true

  do_1:
    id     : TASK1
    syscall: ena_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_1:
    INH1:
      intstat: TA_ENAINT

  do_2:
    id     : TASK1
    syscall: TTSP_UNL_SPN(SPN1)

  post_condition_2:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
      chg_ipm: INT_PRI_MID
