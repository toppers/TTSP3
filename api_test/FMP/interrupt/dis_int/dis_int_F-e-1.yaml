version: "dis_int_F-e-1.yaml : TTSP3 combination E_PAR PPI-wrong-PE (2026-06-10)"
FMP_interrupt_dis_int_F_e_1:
  note: 【NGKI3087】PPI範囲(MASK<32)・他PE宛 → VALID_INTNO_DISINT の PRCID==prcid 偽アーム到達。combination版。
  variation:
    irc_arch: combination
    api_support_dis_int: true
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      prcid  : PRC_SELF
  do:
    id     : TASK1
    syscall: dis_int(INTNO_OTHER_INH_A)
    ercd   : E_PAR
  post_condition:
