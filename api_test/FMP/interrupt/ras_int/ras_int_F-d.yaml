version: "$Id: ras_int_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_ras_int_F_d:
  note: TESRY_006，【NGKI3936】
  variation:
    api_support_ras_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      prcid  : PRC_SELF
      intreq : false

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK1
    syscall: ras_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intreq: true

  do_1:
    id     : TASK1
    syscall: TTSP_UNL_SPN(SPN1)
    ercd   : E_OK

  post_condition_1:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false

  do_2:
    id  : INH1
    code: return

  post_condition_2:
    INH1:
      hdlstat: STP

    TASK1:
      tskstat: running
