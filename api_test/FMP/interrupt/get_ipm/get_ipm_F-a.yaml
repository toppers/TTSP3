version: "$Id: get_ipm_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_get_ipm_F_a:
  note: 【NGKI3117】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        intpri:
          type : PRI
          value: ANY_IPM

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_ipm(&intpri)
    ercd   : E_CTX

  post_condition:
