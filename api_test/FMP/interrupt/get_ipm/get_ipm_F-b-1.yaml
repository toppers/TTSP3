version: "$Id: get_ipm_F-b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_get_ipm_F_b_1:
  note: 【NGKI3120】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        intpri:
          type: PRI

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_ipm(&intpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        intpri:
          value: TIPM_ENAALL
