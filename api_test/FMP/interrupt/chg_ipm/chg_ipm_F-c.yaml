version: "$Id: chg_ipm_F-c.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_interrupt_chg_ipm_F_c:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_ipm(TIPM_ENAALL)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    CPU_STATE1:
      chg_ipm: TIPM_ENAALL
