version: "$Id: chg_ipm_F-b-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_interrupt_chg_ipm_F_b_1:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_ipm(ANY_IPM)
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      chg_ipm: ANY_IPM
