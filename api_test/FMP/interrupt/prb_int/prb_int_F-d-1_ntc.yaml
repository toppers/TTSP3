      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : DUMMY_CYC

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id  : DUMMY_CYC
    code: ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_0:
    INH1:
      intreq: true

  do_1:
    id     : DUMMY_CYC
    syscall: prb_int(INTNO_SELF_INH_A)
    erbool : true

  post_condition_1:

  do_2:
    id     : DUMMY_CYC
    syscall: TTSP_UNL_SPN(SPN1)
    ercd   : E_OK

  post_condition_2:
    DUMMY_CYC:
      hdlstat: STP

    INH1:
      hdlstat: ACTIVATE
      intreq : false

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE:
      loc_cpu: false

  do_3:
    id  : INH1
    code: return

  post_condition_3:
    DUMMY_CYC:
      hdlstat: ACTIVATE

    INH1:
      hdlstat: STP

    TASK1:
      tskstat: running
