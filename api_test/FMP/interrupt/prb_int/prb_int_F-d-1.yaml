version: "$Id: prb_int_F-d-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_prb_int_F_d_1:
  note: 【NGKI3948】
  variation:
    api_support_prb_int: true

  pre_condition:
    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      intreq : false
      prcid  : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id  : TASK1
    code: ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_0:
    INH1:
      intreq: true

  do_1:
    id     : TASK1
    syscall: prb_int(INTNO_SELF_INH_A)
    erbool : true

  post_condition_1:

  do_2:
    id     : TASK1
    syscall: TTSP_UNL_SPN(SPN1)
    ercd   : E_OK

  post_condition_2:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE:
      loc_cpu: false

  do_3:
    id  : INH1
    code: return

  post_condition_3:
    INH1:
      hdlstat: STP

    TASK1:
      tskstat: running
