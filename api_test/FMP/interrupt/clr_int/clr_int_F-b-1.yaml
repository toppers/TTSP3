version: "$Id: clr_int_F-b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_interrupt_clr_int_F_b_1:
  note: 【NGKI3930】
  variation:
    irc_arch: local
    api_support_clr_int: true
    api_support_ena_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      prcid  : PRC_SELF
      intreq : true

  do_0:
    id     : TASK1
    syscall: clr_int(TTSP_GLOBAL_IRC_INTNO_A)
    ercd   : E_PAR

  post_condition_0:

  do_1:
    id  : TASK1
    code: clr_int(INTNO_SELF_INH_A)

  post_condition_1:
    INH1:
      intreq : false

  do_2:
    id  : TASK1
    code: ena_int(INTNO_SELF_INH_A)

  post_condition_2:
    INH1:
      intstat: TA_ENAINT
