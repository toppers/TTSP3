version: "$Id: ref_tsk_F-a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_refer_ref_tsk_F_a_1:
  note: 【NGKI1218】
  variation:
    profile: FMP

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      var      :
        rtsk:
          type   : T_RTSK
          tskstat: ANY_TASK_STAT
          tskpri : TSK_PRI_SUBPRI
          tskbpri: TSK_PRI_SUBPRI
          subpri : TSK_PRI_MID
          tskwait: ANY_TASK_WAIT
          wobjid : ANY_OBJECT_ID
          lefttmo: RELATIVE_TIME_A
          actcnt : ANY_QUEUING_CNT
          wupcnt : ANY_QUEUING_CNT
          prcid  : ANY_OBJECT_ID
          actprc : ANY_OBJECT_ID

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

  do:
    id     : ALM1
    syscall: ref_tsk(TASK1,&rtsk)
    ercd   : E_CTX

  post_condition:
