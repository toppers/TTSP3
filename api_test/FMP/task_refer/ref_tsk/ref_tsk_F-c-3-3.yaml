version: "$Id: ref_tsk_F-c-3-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_refer_ref_tsk_F_c_3_3:
  note: 【NGKI1224】【NGKI1225】【NGKI1227】【NGKI1229】【NGKI1234】【NGKI1231】【NGKI3662】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        rtsk:
          type: T_RTSK

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      tskpri : TSK_PRI_SUBPRI
      tskbpri: TSK_PRI_SUBPRI
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF
      var    :
        flgptn:
          type: FLGPTN

    FLG1:
      type    : EVENTFLAG
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A
            var   : flgptn

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_WAI
          tskwait: TTW_FLG
          wobjid : FLG1
          lefttmo: TMO_FEVR
          tskpri : TSK_PRI_SUBPRI
          tskbpri: TSK_PRI_SUBPRI
          subpri : TSK_PRI_MID
          actcnt : 0
          wupcnt : 0
          prcid  : PRC_SELF
          actprc : TPRC_NONE
