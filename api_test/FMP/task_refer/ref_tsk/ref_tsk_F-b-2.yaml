version: "$Id: ref_tsk_F-b-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_refer_ref_tsk_F_b_2:
  note: 【NGKI1220】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        rtsk:
          type   : T_RTSK
          tskstat: ANY_TASK_STAT
          tskpri : TSK_PRI_SUBPRI
          tskbpri: TSK_PRI_SUBPRI
          subpri : TSK_PRI_MID
          tskwait: ANY_TASK_WAIT
          wobjid : ANY_OBJECT_ID
          lefttmo: RELATIVE_TIME_A
          actcnt : ANY_QUEUING_CNT
          wupcnt : ANY_QUEUING_CNT
          prcid  : ANY_OBJECT_ID
          actprc : ANY_OBJECT_ID

  do:
    id     : TASK1
    syscall: ref_tsk(TNUM_TSKID+1,&rtsk)
    ercd   : E_ID

  post_condition:
