version: "$Id: mget_lod_F-b-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mget_lod_F_b_2:
  note: 【NGKI3635】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        p_load:
          type: uint_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_lod(TNUM_PRCID+1, TSK_PRI_MID, &p_load)
    ercd   : E_ID

  post_condition:
