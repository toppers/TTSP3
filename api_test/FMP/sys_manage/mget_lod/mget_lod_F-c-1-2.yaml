version: "$Id: mget_lod_F-c-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mget_lod_F_c_1_2:
  note: 【NGKI3636】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        p_load:
          type: uint_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_lod(PRC_SELF, TMAX_TPRI+1, &p_load)
    ercd   : E_PAR

  post_condition:
