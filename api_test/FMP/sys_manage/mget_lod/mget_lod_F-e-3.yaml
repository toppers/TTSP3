version: "$Id: mget_lod_F-e-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mget_lod_F_e_3:
  note: 【NGKI3639】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        p_load:
          type: uint_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_lod(PRC_SELF, TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 2
