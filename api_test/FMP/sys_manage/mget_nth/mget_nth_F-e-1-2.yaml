version: "$Id: mget_nth_F-e-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mget_nth_F_e_1_2:
  note: 【NGKI3658】【NGKI3659】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_nth(PRC_SELF, TSK_PRI_MID, 1, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TSK_NONE
