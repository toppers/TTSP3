FMP_sys_manage_mget_nth_F_a_1_1:
  note: 【NGKI3652】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_tskid:
          type: ID
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      prcid  : PRC_OTHER

  do:
    id     : ALM1
    syscall: mget_nth(PRC_SELF, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_CTX

  post_condition:
