FMP_sys_manage_mget_nth_F_a_1_3:
  note: 【NGKI3653】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_nth(PRC_SELF, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_CTX

  post_condition:
