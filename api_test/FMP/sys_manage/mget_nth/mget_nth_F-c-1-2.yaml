  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mget_nth(PRC_SELF, TMAX_TPRI+1, 0, &p_tskid)
    ercd   : E_PAR

  post_condition:
