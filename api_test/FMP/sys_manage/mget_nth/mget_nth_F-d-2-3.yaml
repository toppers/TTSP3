version: "$Id: mget_nth_F-d-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mget_nth_F_d_2_3:
  note: 【NGKI3658】【NGKI3659】【NGKI3660】

  pre_condition:
