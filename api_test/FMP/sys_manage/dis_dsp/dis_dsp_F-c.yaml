version: "$Id: dis_dsp_F-c.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_dis_dsp_F_c:
  note: 【NGKI2745】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      dis_dsp: false
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: dis_dsp()
    ercd   : E_OK

  post_condition:
