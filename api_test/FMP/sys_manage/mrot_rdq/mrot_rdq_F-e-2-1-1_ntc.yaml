version: "$Id: mrot_rdq_F-e-2-1-1_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_e_2_1_1_ai:
  note: 【NGKI2699】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3
      prcid  : PRC_SELF

  do_0:
    id     : DUMMY_ALM
    syscall: mrot_rdq(PRC_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running
      porder : 3

    TASK2:
      tskstat: ready
      porder : 1

    TASK3:
      porder: 2

  do_1:
    id  : DUMMY_ALM
    code: return

  post_condition_1:
    DUMMY_ALM:
      hdlstat: STP

    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

FMP_sys_manage_mrot_rdq_F_e_2_1_1_ci:
  note: 【NGKI2699】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3
      prcid  : PRC_SELF

  do_0:
    id     : DUMMY_CYC
    syscall: mrot_rdq(PRC_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running
      porder : 3

    TASK2:
      tskstat: ready
      porder : 1

    TASK3:
      porder: 2

  do_1:
