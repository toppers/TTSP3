version: "$Id: mrot_rdq_F-f-1-1-6.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_f_1_1_6:
  note: 【NGKI2699】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mrot_rdq(PRC_OTHER, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK2:
      porder: 2

    TASK3:
      porder: 1
