version: "$Id: mrot_rdq_F-e-1-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_e_1_1_2:
  note: 【NGKI2699】【NGKI2701】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: mrot_rdq(PRC_SELF, TPRI_SELF)
    ercd   : E_OK

  post_condition:
    TASK1:
      porder: 2

    TASK2:
      porder: 1
