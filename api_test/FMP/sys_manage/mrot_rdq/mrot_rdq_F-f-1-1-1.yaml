version: "$Id: mrot_rdq_F-f-1-1-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_f_1_1_1:
  note: 【NGKI2699】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mrot_rdq(PRC_OTHER, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: running
      porder : 1
