version: "$Id: mrot_rdq_F-e-1-1-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_e_1_1_1:
  note: 【NGKI2699】【NGKI2701】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: mrot_rdq(PRC_SELF, TPRI_SELF)

  post_condition:
    TASK1:
      tskstat: ready
      porder : 2

    TASK2:
      tskstat: running
      porder : 1
