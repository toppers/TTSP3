version: "$Id: mrot_rdq_F-e-2-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_mrot_rdq_F_e_2_1_1:
  note: 【NGKI2699】【NGKI2701】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: mrot_rdq(PRC_SELF, TPRI_SELF)

  post_condition:
    TASK1:
      tskstat: ready
      porder : 3

    TASK2:
      tskstat: running
      porder : 1

    TASK3:
      porder: 2
