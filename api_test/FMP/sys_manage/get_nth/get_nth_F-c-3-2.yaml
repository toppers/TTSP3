version: "$Id: get_nth_F-c-3-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_get_nth_F_c_3_2:
  note: 【NGKI3647】【NGKI5127】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      porder : 1
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      porder : 2
      prcid  : PRC_SELF

    TASK4:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_OTHER

    TASK5:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_nth(TSK_PRI_MID, 1, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK3
