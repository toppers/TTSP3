version: "$Id: get_lod_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_get_lod_F_b:
  note: 【NGKI3629】【NGKI3631】【NGKI5126】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        p_load:
          type: uint_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_lod(TPRI_SELF, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 2
