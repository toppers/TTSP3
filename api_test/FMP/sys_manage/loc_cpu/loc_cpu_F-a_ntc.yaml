version: "$Id: loc_cpu_F-a_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_loc_cpu_F_a_ai:
  note: 【NGKI2730】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_ALM
    syscall: loc_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      loc_cpu: true

FMP_sys_manage_loc_cpu_F_a_ci:
  note: 【NGKI2730】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_CYC
    syscall: loc_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      loc_cpu: true
