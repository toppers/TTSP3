version: "$Id: get_pid_F-b.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_get_pid_F_b:
  note: 【NGKI2724】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_prcid:
          type: ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_pid(&p_prcid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_prcid:
          value: PRC_SELF
