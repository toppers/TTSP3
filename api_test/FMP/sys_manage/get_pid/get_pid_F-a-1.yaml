version: "$Id: get_pid_F-a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_get_pid_F_a_1:
  note: 【NGKI2722】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_prcid:
          type : ID
          value: ANY_OBJECT_ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_pid(&p_prcid)
    ercd   : E_CTX

  post_condition:
