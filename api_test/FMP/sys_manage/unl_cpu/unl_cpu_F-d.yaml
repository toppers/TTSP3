version: "$Id: unl_cpu_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_unl_cpu_F_d:
  note: 【NGKI2737】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK3
    syscall: TTSP_MACT_TSK(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition_0:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

  do_1:
    id     : TASK1
    syscall: unl_cpu()

  post_condition_1:
    CPU_STATE1:
      loc_cpu: false

    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
