version: "$Id: unl_cpu_F-d_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_unl_cpu_F_d_ai:
  note: 【NGKI2737】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK3
    syscall: TTSP_MACT_TSK(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition_0:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

  do_1:
    id     : DUMMY_ALM
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition_1:
    CPU_STATE1:
      loc_cpu: false

  do_2:
    id  : DUMMY_ALM
    code: return

  post_condition_2:
    DUMMY_ALM:
      hdlstat: STP

    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

FMP_sys_manage_unl_cpu_F_d_ci:
  note: 【NGKI2737】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK3
    syscall: TTSP_MACT_TSK(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition_0:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

  do_1:
    id     : DUMMY_CYC
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition_1:
    CPU_STATE1:
      loc_cpu: false

  do_2:
    id  : DUMMY_CYC
    code: return

  post_condition_2:
    DUMMY_CYC:
      hdlstat: STP

    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
