version: "$Id: unl_cpu_F-c.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_unl_cpu_F_c:
  note: 【NGKI2739】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition:
