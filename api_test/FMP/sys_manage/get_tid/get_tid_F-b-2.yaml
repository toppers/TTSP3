version: "$Id: get_tid_F-b-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_b_2:
  note: TESRY_003，【NGKI2709】【NGKI2710】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      var      :
        p_tskid:
          type: ID
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK1
    syscall: dly_tsk(WAIT_ALARM_TIME)

  post_condition_1:
    TASK1:
      tskstat: waiting
      wobjid : DELAY

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

  do_2:
    id     : ALM1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition_2:
    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE
      var    :
        p_tskid:
          value: TSK_NONE
