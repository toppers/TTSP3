version: "$Id: get_tid_F-b-3-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_b_3_1:
  note: 【NGKI2709】【NGKI2711】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_tskid:
          type: ID
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : ALM1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    ALM1:
      var:
        p_tskid:
          value: TASK1
