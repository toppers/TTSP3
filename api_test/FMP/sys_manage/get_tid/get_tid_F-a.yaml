version: "$Id: get_tid_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_a:
  note: 【NGKI2707】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_tskid:
          type : ID
          value: ANY_OBJECT_ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_CTX

  post_condition:
