version: "$Id: get_tid_F-b-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_b_1:
  note: 【NGKI2709】【NGKI2711】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
