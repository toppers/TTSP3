version: "$Id: get_pri_F-c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_pri_F_c_2:
  note: 【NGKI1210】【NGKI1211】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      var    :
        tskpri:
          type: PRI

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_pri(TSK_SELF, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskpri:
          value: TSK_PRI_MID
