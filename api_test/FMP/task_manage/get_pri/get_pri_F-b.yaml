version: "$Id: get_pri_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_pri_F_b:
  note: 【NGKI1209】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskpri:
          type : PRI
          value: TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_pri(TASK2, &tskpri)
    ercd   : E_OBJ

  post_condition:
