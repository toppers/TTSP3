version: "$Id: get_pri_F-a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_pri_F_a_1:
  note: 【NGKI1203】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      var      :
        tskpri:
          type : PRI
          value: TSK_PRI_MID

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : ALM1
    syscall: get_pri(TASK1, &tskpri)
    ercd   : E_CTX

  post_condition:
