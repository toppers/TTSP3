version: "$Id: get_inf_F-b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_inf_F_b_1:
  note: 【NGKI1216】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      exinf  : EXINF_A
      prcid  : PRC_SELF
      var    :
        exinf:
          type: intptr_t

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        exinf:
          value: EXINF_A
