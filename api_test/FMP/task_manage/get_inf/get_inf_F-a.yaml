version: "$Id: get_inf_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_inf_F_a:
  note: 【NGKI1214】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        exinf:
          type : intptr_t
          value: EXINF_A

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_CTX

  post_condition:
