version: "$Id: chg_spr_F-c-2-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_spr_F_c_2_2:
  note: 【NGKI3672】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: waiting
      wobjid : DELAY
      subpri : TSK_PRI_MID
      lefttmo: RELATIVE_TIME_A
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: TSK_PRI_LOW
