version: "chg_spr_F-e-4.yaml : TTSP3 subprio boosted treated-as-0 (NGKI5219 / chg_spr !boosted guard) (2026-06-10)"
FMP_task_manage_chg_spr_F_e_4:
  note: 【NGKI5219】【NGKI3672】boosted中は subpri=0扱い・chg_spr の !boosted ガードで並び替わらない ＝ TTSP3拡張ケース(2026-06-10追加)。専用優先度 TSK_PRI_SUBPRI(13) に閉じる（共有優先度の ENA_SPR 汚染回避）

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskbpri: TSK_PRI_SUBPRI
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      prcid  : PRC_SELF
      locmtx :
        - MTX1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : 1
      prcid  : PRC_SELF

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      ceilpri: TSK_PRI_SUBPRI
      mtxatr : TA_CEILING
      htskid : TASK2

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, 5)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: 5
      porder: 1

    TASK3:
      porder: 2
