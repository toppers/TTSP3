FMP_task_manage_chg_spr_F_d_2_2:
  note: 【NGKI3672】【NGKI3674】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running-suspended
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_spr(TSK_SELF, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK1:
      subpri: TSK_PRI_LOW
