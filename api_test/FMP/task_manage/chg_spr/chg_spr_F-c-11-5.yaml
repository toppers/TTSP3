version: "$Id: chg_spr_F-c-11-5.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_spr_F_c_11_5:
  note: 【NGKI3672】
  variation:
    profile: FMP

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running-suspended
      subpri : TSK_PRI_MID
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: TSK_PRI_LOW
