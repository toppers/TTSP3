version: "$Id: chg_spr_F-c-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_chg_spr_F_c_2_3:
  note: 【NGKI3672】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: waiting
      wobjid : SEM1
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_NULL
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: TSK_PRI_LOW
