FMP_task_manage_chg_spr_F_c_1_2_1_3:
  note: 【NGKI3672】【NGKI3673】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : TSK_PRI_MID
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: TSK_PRI_LOW
