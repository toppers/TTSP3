version: "$Id: chg_spr_F-c-1-4-1-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_spr_F_c_1_4_1_2:
  note: 【NGKI3672】【NGKI3673】
  variation:
    profile: FMP

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : TSK_PRI_MID
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : TSK_PRI_MID
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_spr(TASK3, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK3:
      subpri: TSK_PRI_MID
