version: "chg_spr_F-e-3.yaml : TTSP3 subprio mid-insert (queue_insert_subprio_tail break) (2026-06-10)"
FMP_task_manage_chg_spr_F_e_3:
  note: 【NGKI3673】subprio mid-insert＝queue_insert_subprio_tail の break成立(task.c L215) ＝ TTSP3拡張ケース(2026-06-10追加)

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : 1
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : 5
      prcid  : PRC_SELF

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : 9
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_spr(TASK4, 3)
    ercd   : E_OK

  post_condition:
    TASK2:
      subpri: 1
      porder: 1

    TASK4:
      subpri: 3
      porder: 2

    TASK3:
      subpri: 5
      porder: 3
