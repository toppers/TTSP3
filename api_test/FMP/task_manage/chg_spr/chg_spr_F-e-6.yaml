version: "chg_spr_F-e-6.yaml : TTSP3 subprio cross-PE dispatch (change_subprio update_schedtsk_dsp IPI) (2026-06-10)"
FMP_task_manage_chg_spr_F_e_6:
  note: 【NGKI3673】subprio cross-PE reorder＝change_subprio の他PE update_schedtsk_dsp(IPI) 分岐 ＝ TTSP3拡張ケース(2026-06-10追加)

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: running
      subpri : 1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_SUBPRI
      tskstat: ready
      subpri : 2
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_spr(TASK2, 3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: running
      porder : 1

    TASK2:
      tskstat: ready
      subpri : 3
      porder : 2
