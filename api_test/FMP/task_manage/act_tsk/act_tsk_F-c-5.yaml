version: "$Id: act_tsk_F-c-5.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_c_5:
  note: 【NGKI1118】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_MID
