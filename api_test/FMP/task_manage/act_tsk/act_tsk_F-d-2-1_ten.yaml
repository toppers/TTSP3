version: "$Id: act_tsk_F-d-2-1_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_d_2_1_at:
  note: 【NGKI3527】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK2
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SLEEP
      actcnt : 0
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        actcnt: 1

