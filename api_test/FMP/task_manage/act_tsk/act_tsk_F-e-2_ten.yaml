version: "$Id: act_tsk_F-e-2_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_e_2_at:
  note: 【NGKI3527】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK1
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running-suspended
      actcnt : 0
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        actcnt: 1

