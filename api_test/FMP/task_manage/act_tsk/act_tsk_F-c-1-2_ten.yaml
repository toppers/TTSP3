version: "$Id: act_tsk_F-c-1-2_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_c_1_2_at:
  note: 【NGKI1118】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK3
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK3:
        tskstat: ready
        tskpri : TSK_PRI_HIGH

