version: "$Id: act_tsk_F-c-3_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_c_3_ai:
  note: 【NGKI1118】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_ALM
    syscall: act_tsk(TASK3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3

    TASK4:
      porder: 2

FMP_task_manage_act_tsk_F_c_3_ci:
  note: 【NGKI1118】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_CYC
    syscall: act_tsk(TASK3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3

    TASK4:
      porder: 2
