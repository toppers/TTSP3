version: "$Id: get_tst_F-a-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_a_4:
  note: 【NGKI3615】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type : STAT
          value: TTS_RUN

    TASK2:
      type   : TASK
      tskstat: ready
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_tst(TASK2, &tskstat)
    eruint : E_CTX

  post_condition:
