version: "$Id: get_tst_F-c-5-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_c_5_1:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SLEEP
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_tst(TASK3, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_WAS
