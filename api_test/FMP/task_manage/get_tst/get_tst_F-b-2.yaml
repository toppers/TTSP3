version: "$Id: get_tst_F-b-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_b_2:
  note: 【NGKI3620】【NGKI3621】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_tst(TSK_SELF, &tskstat)
    eruint : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_SUS
