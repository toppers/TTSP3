version: "$Id: get_tst_F-c-3-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_c_3_3:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK3:

  do:
    id     : TASK1
    syscall: get_tst(TASK3, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_WAI
