version: "$Id: get_tst_F-c-7-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_c_7_1:
  note: 【NGKI3620】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT

    TASK2:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: get_tst(TASK2, &tskstat)
    eruint : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_SUS
