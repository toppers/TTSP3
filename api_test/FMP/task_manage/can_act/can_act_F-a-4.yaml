version: "$Id: can_act_F-a-4.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_can_act_F_a_4:
  note: 【NGKI1140】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : E_CTX

  post_condition:
