version: "$Id: can_act_F-c-11-3-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_can_act_F_c_11_3_2:
  note: 【NGKI1144】【NGKI1145】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      actcnt : 1
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : 1

  post_condition:
    TASK2:
      actcnt: 0
