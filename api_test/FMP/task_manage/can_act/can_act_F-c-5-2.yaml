version: "$Id: can_act_F-c-5-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_can_act_F_c_5_2:
  note: 【NGKI1144】【NGKI1145】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      actcnt : 1
      lefttmo: ANY_ELAPSED_TIME
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : 1

  post_condition:
    TASK2:
      actcnt: 0
