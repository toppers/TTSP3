version: "$Id: mig_tsk_F-f-2-1-3-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mig_tsk_F_f_2_1_3_1:
  note: 【NGKI1155】【NGKI1158】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mig_tsk(TSK_SELF, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK1:
      prcid: PRC_OTHER

    TASK2:
      tskstat: ready
