version: "$Id: mig_tsk_F-g-2-2-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mig_tsk_F_g_2_2_2:
  note: 【NGKI1155】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

  do:
    id     : TASK1
    syscall: mig_tsk(TASK2, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      prcid  : PRC_OTHER
