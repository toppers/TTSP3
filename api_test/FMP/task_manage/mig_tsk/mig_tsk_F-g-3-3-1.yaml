FMP_task_manage_mig_tsk_F_g_3_3_1:
  note: 【NGKI1155】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      actcnt : 0
      prcid  : PRC_SELF

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: mig_tsk(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition:
