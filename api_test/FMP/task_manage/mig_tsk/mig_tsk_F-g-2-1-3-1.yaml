version: "$Id: mig_tsk_F-g-2-1-3-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mig_tsk_F_g_2_1_3_1:
  note: 【NGKI1155】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: mig_tsk(TASK3, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    TASK3:
      tskstat: running
      prcid  : PRC_OTHER
