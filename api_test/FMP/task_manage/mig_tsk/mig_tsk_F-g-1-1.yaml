version: "$Id: mig_tsk_F-g-1-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mig_tsk_F_g_1_1:
  note: 【NGKI1155】【NGKI1156】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_SELF
      porder : 2

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_SELF
      porder : 3

  do:
    id     : TASK1
    syscall: mig_tsk(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition:
    TASK2:
      porder: 3

    TASK3:
      porder: 2
