FMP_task_manage_mig_tsk_F_g_2_1_3_6:
  note: 【NGKI1155】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: mig_tsk(TASK3, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK3:
      prcid: PRC_OTHER
