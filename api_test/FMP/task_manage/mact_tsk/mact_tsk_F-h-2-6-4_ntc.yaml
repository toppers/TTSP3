version: "$Id: mact_tsk_F-h-2-6-4_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_mact_tsk_F_h_2_6_4_ai:
  note: 【NGKI3557】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      actcnt : 0
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      tskpri : TSK_PRI_MID
      actcnt : 0
      actprc : TPRC_NONE
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_ALM
    syscall: mact_tsk(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt: 1
      actprc: PRC_SELF

FMP_task_manage_mact_tsk_F_h_2_6_4_ci:
  note: 【NGKI3557】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      actcnt : 0
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      tskpri : TSK_PRI_MID
      actcnt : 0
      actprc : TPRC_NONE
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

  do:
    id     : DUMMY_CYC
    syscall: mact_tsk(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt: 1
      actprc: PRC_SELF
