version: "$Id: mact_tsk_F-d-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mact_tsk_F_d_1:
  note: TESRY_015，【NGKI1136】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      class  : CLS_SELF_ONLY_SELF
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mact_tsk(TASK2, PRC_OTHER)
    ercd   : E_PAR

  post_condition:
