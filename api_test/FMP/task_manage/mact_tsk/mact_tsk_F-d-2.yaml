FMP_task_manage_mact_tsk_F_d_2:
  note: 【NGKI1136】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      class  : CLS_OTHER_ONLY_OTHER
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mact_tsk(TASK2, PRC_SELF)
    ercd   : E_PAR

  post_condition:
