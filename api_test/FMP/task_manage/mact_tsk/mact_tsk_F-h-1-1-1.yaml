version: "$Id: mact_tsk_F-h-1-1-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mact_tsk_F_h_1_1_1:
  note: 【NGKI1132】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      actcnt : 0
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mact_tsk(TASK2, PRC_SELF)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF
