version: "$Id: mact_tsk_F-e-2-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_mact_tsk_F_e_2_2:
  note: TESRY_015，【NGKI3558】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      actcnt : 1
      actprc : PRC_OTHER
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mact_tsk(TASK2, PRC_OTHER)
    ercd   : E_QOVR

  post_condition:
