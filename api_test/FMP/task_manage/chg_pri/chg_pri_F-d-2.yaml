version: "$Id: chg_pri_F-d-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_d_2:
  note: 【NGKI1201】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      locmtx :
        - MTX1

    TASK3:
      type   : TASK
      tskstat: waiting
      tskbpri: TSK_PRI_MID
      tskpri : TSK_PRI_MID
      wobjid : MTX1
      prcid  : PRC_OTHER

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      ceilpri : TSK_PRI_MID
      mtxatr  : TA_CEILING
      htskid  : TASK2
      wtsklist:
        - TASK3:

  do:
    id     : TASK1
    syscall: chg_pri(TASK3, TSK_PRI_HIGH)
    ercd   : E_ILUSE

  post_condition:
