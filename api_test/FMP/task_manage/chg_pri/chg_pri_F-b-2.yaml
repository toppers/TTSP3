FMP_task_manage_chg_pri_F_b_2:
  note: 【NGKI1188】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TMAX_TPRI+1)
    ercd   : E_PAR

  post_condition:
