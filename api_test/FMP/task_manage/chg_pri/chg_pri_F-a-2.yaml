version: "$Id: chg_pri_F-a-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_a_2:
  note: 【NGKI1185】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_MID)
    ercd   : E_CTX

  post_condition:
