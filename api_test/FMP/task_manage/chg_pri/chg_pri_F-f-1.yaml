version: "$Id: chg_pri_F-f-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_f_1:
  note: 【NGKI1192】【NGKI1193】【NGKI1198】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running-suspended
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
