version: "$Id: chg_pri_F-e-2-3-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_e_2_3_1:
  note: 【NGKI1195】【NGKI1196】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_NULL
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK4:

  do:
    id     : TASK1
    syscall: chg_pri(TASK3, TSK_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskpri: TSK_PRI_HIGH
