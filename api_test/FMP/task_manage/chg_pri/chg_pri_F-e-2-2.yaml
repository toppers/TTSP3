version: "$Id: chg_pri_F-e-2-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_e_2_2:
  note: 【NGKI1195】【NGKI1196】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_LOW
