version: "$Id: chg_pri_F-e-1-2-1-3.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_e_1_2_1_3:
  note: 【NGKI1192】【NGKI1193】【NGKI1194】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: chg_pri(TASK3, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskpri: TSK_PRI_LOW
