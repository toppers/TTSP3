version: "$Id: ext_tsk_F-b-4.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_term_ext_tsk_F_b_4:
  note: 【NGKI3449】【NGKI1169】【NGKI1168】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskstat: dormant

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
