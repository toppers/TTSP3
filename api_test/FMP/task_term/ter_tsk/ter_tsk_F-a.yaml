version: "$Id: ter_tsk_F-a.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_term_ter_tsk_F_a:
  note: 【NGKI1172】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: ready
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_CTX

  post_condition:
