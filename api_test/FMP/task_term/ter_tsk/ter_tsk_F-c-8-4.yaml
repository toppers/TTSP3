version: "$Id: ter_tsk_F-c-8-4.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_term_ter_tsk_F_c_8_4:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
      tskstat: waiting-suspended
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      actcnt : 1
      actprc : PRC_OTHER
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      actcnt : 0
      bootcnt: 1
      actprc : TPRC_NONE
      prcid  : PRC_OTHER
