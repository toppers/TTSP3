version: "$Id: ras_ter_F-c-4-5.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_term_ras_ter_F_c_4_5:
  note: 【NGKI3477】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      actcnt : 1
      actprc : PRC_OTHER
      prcid  : PRC_SELF

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ras_ter(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      actcnt : 0
      bootcnt: 1
      actprc : TPRC_NONE
      prcid  : PRC_OTHER

    SEM1:
      wtsklist:
