  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
      tskstat: suspended
      actcnt : 1
      actprc : PRC_OTHER
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ras_ter(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      actcnt : 0
      bootcnt: 1
      actprc : TPRC_NONE
      prcid  : PRC_OTHER
