version: "$Id: psnd_dtq_F-b-2-4_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_psnd_dtq_F_b_2_4_at:
  note: 【NGKI1734】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SNDDTQ
      nfy_info1: DTQ1
      nfy_info2: DATA_A
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: ttg_data
        - TASK3:
      datalist:

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: suspended

      DTQ1:
        rtsklist:
          - TASK3:

