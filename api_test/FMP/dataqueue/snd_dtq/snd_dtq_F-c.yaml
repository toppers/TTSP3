version: "$Id: snd_dtq_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_snd_dtq_F_c:
  note: 【NGKI1733】【NGKI1780】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:

  do_0:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

  do_1:
    id     : TASK2
    syscall: TTSP_INI_DTQ(DTQ1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    DTQ1:
      stsklist:
