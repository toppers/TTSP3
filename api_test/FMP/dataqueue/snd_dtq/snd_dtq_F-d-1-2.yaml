version: "$Id: snd_dtq_F-d-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_snd_dtq_F_d_1_2:
  note: 【NGKI1768】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 1
      stsklist:
      datalist:
        - data: DATA_B

  do_0:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

  do_1:
    id     : TASK2
    syscall: TTSP_PRCV_DTQ(DTQ1, &data)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      var:
        data:
          value: DATA_B

    DTQ1:
      stsklist:
      datalist:
        - data: DATA_A
