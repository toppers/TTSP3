version: "$Id: trcv_dtq_F-e-1-1-5-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_trcv_dtq_F_e_1_1_5_3:
  note: 【NGKI3421】【NGKI1766】【NGKI1767】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_B

    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_A
