version: "$Id: trcv_dtq_F-e-2-1-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_trcv_dtq_F_e_2_1_1_2:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_A

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:
      datalist:
