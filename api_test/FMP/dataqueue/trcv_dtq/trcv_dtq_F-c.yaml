version: "$Id: trcv_dtq_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_trcv_dtq_F_c:
  note: 【NGKI1765】【NGKI1780】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : intptr_t
          value: DATA_A
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 0

  do_0:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_INI_DTQ(DTQ1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    DTQ1:
      rtsklist:
