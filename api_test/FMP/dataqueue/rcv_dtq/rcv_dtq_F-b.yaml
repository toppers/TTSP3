version: "$Id: rcv_dtq_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_rcv_dtq_F_b:
  note: 【NGKI1764】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : intptr_t
          value: DATA_A
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 0

  do_0:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    DTQ1:
      rtsklist:
