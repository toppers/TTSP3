version: "$Id: tsnd_dtq_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_tsnd_dtq_F_b:
  note: 【NGKI1732】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:

  do_0:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, ANY_ELAPSED_TIME)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    DTQ1:
      stsklist:
