version: "$Id: tsnd_dtq_F-e-2-5-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_tsnd_dtq_F_e_2_5_2:
  note: 【NGKI1734】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: ttg_data
        - TASK3:
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
        - TASK3:
