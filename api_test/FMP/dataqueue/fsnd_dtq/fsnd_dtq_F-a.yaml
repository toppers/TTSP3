FMP_dataqueue_fsnd_dtq_F_a:
  note: 【NGKI1742】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    DTQ1:
      type: DATAQUEUE

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: fsnd_dtq(DTQ1, DATA_A)
    ercd   : E_CTX

  post_condition:
