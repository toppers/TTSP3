version: "$Id: fsnd_dtq_F-b-1-5-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_fsnd_dtq_F_b_1_5_1:
  note: 【NGKI1747】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: ttg_data
      datalist:

  do:
    id     : TASK1
    syscall: fsnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      var    :
        ttg_data:
          value: DATA_A

    DTQ1:
      rtsklist:
