version: "$Id: prcv_dtq_F-c-2-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_prcv_dtq_F_c_2_4:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B

  do:
    id     : TASK1
    syscall: prcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_A

    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
        - TASK3:
            data: DATA_B
      datalist:
