version: "$Id: prcv_dtq_F-b-2-1-6.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_dataqueue_prcv_dtq_F_b_2_1_6:
  note: 【NGKI3421】【NGKI1766】【NGKI1767】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_E

  do:
    id     : TASK1
    syscall: prcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_C

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:
        - TASK3:
            data: DATA_B
      datalist:
        - data: DATA_D
        - data: DATA_E
        - data: DATA_A
