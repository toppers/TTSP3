version: "$Id: ref_sem_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_ref_sem_F_a:
  note: 【NGKI1537】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        rsem:
          type  : T_RSEM
          wtskid: ANY_OBJECT_ID
          semcnt: ANY_INI_SEMCNT

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, &rsem)
    ercd   : E_CTX

  post_condition:
