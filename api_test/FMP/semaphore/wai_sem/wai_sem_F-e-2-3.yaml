version: "$Id: wai_sem_F-e-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_wai_sem_F_e_2_3:
  note: 【NGKI1525】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_TPRI
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: wai_sem(SEM1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK1:
