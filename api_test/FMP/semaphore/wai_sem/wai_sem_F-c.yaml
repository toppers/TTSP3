version: "$Id: wai_sem_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_wai_sem_F_c:
  note: 【NGKI1523】【NGKI1534】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SEM1:
      type   : SEMAPHORE
      isemcnt: ANY_INI_SEMCNT
      semcnt : 0

  do_0:
    id     : TASK1
    syscall: wai_sem(SEM1)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_INI_SEM(SEM1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    SEM1:
      semcnt  : ANY_INI_SEMCNT
      wtsklist:
