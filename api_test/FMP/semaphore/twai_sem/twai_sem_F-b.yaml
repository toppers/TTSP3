version: "$Id: twai_sem_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_twai_sem_F_b:
  note: 【NGKI1522】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SEM1:
      type  : SEMAPHORE
      semcnt: 0

  do_0:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    SEM1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    SEM1:
      wtsklist:
