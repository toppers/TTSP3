      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : DUMMY_CYC
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
