version: "$Id: ini_sem_F-b-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_ini_sem_F_b_2_1:
  note: 【NGKI1532】【NGKI1533】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER

    TASK5:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      isemcnt : ANY_INI_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK4:

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 3

    TASK4:
      tskstat: ready
      porder : 4

    SEM1:
      semcnt  : ANY_INI_SEMCNT
      wtsklist:
