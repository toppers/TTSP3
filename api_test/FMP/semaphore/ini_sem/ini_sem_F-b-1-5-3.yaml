version: "$Id: ini_sem_F-b-1-5-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_semaphore_ini_sem_F_b_1_5_3:
  note: 【NGKI1532】【NGKI1533】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SEM1
      prcid  : PRC_OTHER

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      isemcnt : ANY_INI_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

    SEM1:
      semcnt  : ANY_INI_SEMCNT
      wtsklist:
