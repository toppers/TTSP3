version: "$Id: msta_cyc_F-f-1-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_cyclic_msta_cyc_F_f_1_1:
  note: 【NGKI2447】【NGKI2448】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      prcid    : PRC_OTHER

  do:
    0:
      id     : TASK1
      syscall: msta_cyc(CYC1, PRC_SELF)
      ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: STP
        prcid  : PRC_SELF

    RELATIVE_TIME_A+(RELATIVE_TIME_B*0)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        prcid  : PRC_SELF
        bootcnt: 0

    RELATIVE_TIME_A+(RELATIVE_TIME_B*1)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        prcid  : PRC_SELF
        bootcnt: 1

    RELATIVE_TIME_A+(RELATIVE_TIME_B*2)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        prcid  : PRC_SELF
        bootcnt: 2

    RELATIVE_TIME_A+(RELATIVE_TIME_B*3)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        prcid  : PRC_SELF
        bootcnt: 3

    RELATIVE_TIME_A+(RELATIVE_TIME_B*4)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        prcid  : PRC_SELF
        bootcnt: 4
