version: "$Id: msta_cyc_F-d-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_cyclic_msta_cyc_F_d_1:
  note: TESRY_015，【NGKI2452】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      class    : CLS_SELF_ONLY_SELF
      prcid    : PRC_SELF

  do:
    id     : TASK1
    syscall: msta_cyc(CYC1, PRC_OTHER)
    ercd   : E_PAR

  post_condition:
