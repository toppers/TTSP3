      type   : TASK
      tskstat: running
      var    :
        rcyc:
          type   : T_RCYC
          cycstat: ANY_CYCLIC_STAT
          lefttim: RELATIVE_TIME_A
          prcid  : ANY_OBJECT_ID
      prcid  : PRC_SELF

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_B
      cyctim   : RELATIVE_TIME_C
      prcid    : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_cyc(0, &rcyc)
    ercd   : E_ID

  post_condition:
