version: "$Id: ref_cyc_F-c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_cyclic_ref_cyc_F_c_1:
  note: 【NGKI2470】【NGKI2471】【NGKI2474】【NGKI2473】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rcyc:
          type: T_RCYC
      prcid  : PRC_SELF

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      prcid    : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rcyc:
          cycstat: TCYC_STP
          prcid  : PRC_SELF
