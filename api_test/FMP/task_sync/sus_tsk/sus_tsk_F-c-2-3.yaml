version: "$Id: sus_tsk_F-c-2-3.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_sync_sus_tsk_F_c_2_3:
  note: 【NGKI1306】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_QOVR

  post_condition:
