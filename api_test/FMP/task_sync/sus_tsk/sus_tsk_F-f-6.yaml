version: "$Id: sus_tsk_F-f-6.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_sync_sus_tsk_F_f_6:
  note: 【NGKI1307】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER
      chg_ipm: INT_PRI_TIMER

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running-suspended
