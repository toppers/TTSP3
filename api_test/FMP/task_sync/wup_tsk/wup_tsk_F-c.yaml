FMP_task_sync_wup_tsk_F_c:
  note: 【NGKI1274】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      wupcnt : 1
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_QOVR

  post_condition:
