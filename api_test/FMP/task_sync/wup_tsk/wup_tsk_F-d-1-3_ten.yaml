version: "$Id: wup_tsk_F-d-1-3_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_sync_wup_tsk_F_d_1_3_at:
  note: 【NGKI1271】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_WUPTSK
      nfy_info1: TASK2
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SLEEP
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: ready
        porder : 3

      TASK4:
        porder: 2

