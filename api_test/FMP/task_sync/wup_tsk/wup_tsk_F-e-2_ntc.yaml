version: "$Id: wup_tsk_F-e-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_sync_wup_tsk_F_e_2_ai:
  note: 【NGKI1273】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running-suspended
      wupcnt : 0
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : DUMMY_ALM
    syscall: wup_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      wupcnt: 1

FMP_task_sync_wup_tsk_F_e_2_ci:
  note: 【NGKI1273】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running-suspended
      wupcnt : 0
      prcid  : PRC_SELF

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

  do:
    id     : DUMMY_CYC
    syscall: wup_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      wupcnt: 1
