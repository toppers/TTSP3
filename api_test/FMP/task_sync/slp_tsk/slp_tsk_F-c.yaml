version: "$Id: slp_tsk_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_task_sync_slp_tsk_F_c:
  note: 【NGKI1272】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: slp_tsk()
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SLEEP

  do_1:
    id     : TASK2
    syscall: TTSP_WUP_TSK(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running
