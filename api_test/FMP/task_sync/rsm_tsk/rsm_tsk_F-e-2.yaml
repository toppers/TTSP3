version: "$Id: rsm_tsk_F-e-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_sync_rsm_tsk_F_e_2:
  note: 【NGKI1320】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: waiting
