version: "$Id: can_wup_F-d-10-1-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_task_sync_can_wup_F_d_10_1_2:
  note: 【NGKI1284】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      wupcnt : 1
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: can_wup(TASK2)
    eruint : 1

  post_condition:
    TASK2:
      wupcnt: 0
