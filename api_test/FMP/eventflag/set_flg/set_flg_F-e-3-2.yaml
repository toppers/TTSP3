version: "$Id: set_flg_F-e-3-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_eventflag_set_flg_F_e_3_2:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER

    TASK5:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    FLG1:
      type    : EVENTFLAG
      flgatr  : "(TA_WMUL|TA_CLR)"
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: TWF_ORW
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ORW

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A|BIT_PATTERN_B|BIT_PATTERN_C)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : 0
      wtsklist:
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ORW
