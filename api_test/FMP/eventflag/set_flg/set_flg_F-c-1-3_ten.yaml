version: "$Id: set_flg_F-c-1-3_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_eventflag_set_flg_F_c_1_3_at:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SETFLG
      nfy_info1: FLG1
      nfy_info2: BIT_PATTERN_A
      almstat  : TALM_STP
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: ready

      FLG1:
        flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
        wtsklist:

