version: "$Id: ini_flg_F-b-1-6.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_eventflag_ini_flg_F_b_1_6:
  note: 【NGKI1645】【NGKI1646】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER

    FLG1:
      type    : EVENTFLAG
      iflgptn : BIT_PATTERN_0A
      flgptn  : BIT_PATTERN_0B
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A

  do:
    id     : TASK1
    syscall: ini_flg(FLG1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:
