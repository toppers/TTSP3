version: "$Id: clr_flg_F-a.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_eventflag_clr_flg_F_a:
  note: 【NGKI1613】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: clr_flg(FLG1, BIT_PATTERN_0B)
    ercd   : E_CTX

  post_condition:
