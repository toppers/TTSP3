version: "$Id: rel_mpf_F-c-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mempfix_rel_mpf_F_c_4:
  note: TESRY_007，【NGKI2310】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_OTHER
      var    :
        blk:
          type: void*

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_OTHER
      var    :
        blk:
          type: void*

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

    MPF1:
      type   : MEMORYPOOL
      mpfatr : TA_NULL
      fblkcnt: 1

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_1:
    TASK2:
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:

  do_2:
    id     : TASK3
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_2:
    TASK3:
      tskstat: waiting
      wobjid : MPF1

    TASK4:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:

  do_3:
    id     : TASK4
    syscall: TTSP_CHG_PRI(TASK2, TSK_PRI_MID)
    ercd   : E_OK

  post_condition_3:
    TASK2:
      tskpri: TSK_PRI_MID

  do_4:
    id     : TASK4
    syscall: TTSP_CHG_PRI(TASK3, TSK_PRI_MID)
    ercd   : E_OK

  post_condition_4:
    TASK3:
      tskpri: TSK_PRI_MID

  do_5:
    id     : TASK4
    syscall: TTSP_SUS_TSK(TASK2)
    ercd   : E_OK

  post_condition_5:
    TASK2:
      tskstat: waiting-suspended

  do_6:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_6:
    TASK2:
      tskstat: suspended

    MPF1:
      wtsklist:
        - TASK3:
