version: "$Id: rel_mpf_F-c-5-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mempfix_rel_mpf_F_c_5_2:
  note: TESRY_007，【NGKI2310】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskstat: ready
      porder : 2
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    TASK3:
      type   : TASK
      tskstat: ready
      porder : 3
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    MPF1:
      type   : MEMORYPOOL
      fblkcnt: 1

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK1
    syscall: TTSP_ROT_RDQ(TSK_PRI_MID)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: ready
      porder : 3

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready
      porder : 2

  do_2:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_2:
    TASK1:
      porder: 2

    TASK2:
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:

  do_3:
    id     : TASK3
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_3:
    TASK1:
      tskstat: running

    TASK3:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:

  do_4:
    id     : TASK1
    syscall: TTSP_MIG_TSK(TASK2, PRC_OTHER)
    ercd   : E_OK

  post_condition_4:
    TASK2:
      prcid: PRC_OTHER

  do_5:
    id     : TASK1
    syscall: TTSP_MIG_TSK(TASK3, PRC_OTHER)
    ercd   : E_OK

  post_condition_5:
    TASK3:
      prcid: PRC_OTHER

  do_6:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_6:
    TASK2:
      tskstat: ready

    MPF1:
      wtsklist:
        - TASK3:
