version: "$Id: rel_mpf_F-c-1-5.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mempfix_rel_mpf_F_c_1_5:
  note: TESRY_007，【NGKI2310】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_OTHER
      var    :
        blk:
          type: void*

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      prcid  : PRC_OTHER
      var    :
        blk:
          type: void*

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER

    MPF1:
      type   : MEMORYPOOL
      fblkcnt: 1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_1:
    TASK2:
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:

  do_2:
    id     : TASK3
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_2:
    TASK3:
      tskstat: waiting
      wobjid : MPF1

    TASK4:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:

  do_3:
    id     : TASK4
    syscall: TTSP_LOC_SPN(SPN1)
    ercd   : E_OK

  post_condition_3:
    SPN1:
      spnstat: TSPN_LOC
      procid : TASK4

    CPU_STATE1:
      loc_cpu: true

  do_4:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_4:
    TASK2:
      tskstat: ready

    MPF1:
      wtsklist:
        - TASK3:
