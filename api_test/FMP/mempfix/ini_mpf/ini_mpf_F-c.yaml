version: "$Id: ini_mpf_F-c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mempfix_ini_mpf_F_c:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_SELF

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_OTHER

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK3:
        - TASK4:

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: ready

    TASK3:
      tskstat: running

    TASK4:
      tskstat: running

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:
