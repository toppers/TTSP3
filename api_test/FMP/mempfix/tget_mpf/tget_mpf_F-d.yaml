version: "$Id: tget_mpf_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_mempfix_tget_mpf_F_d:
  note: TESRY_007，【NGKI2311】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      var    :
        blk:
          type: void*

    MPF1:
      type   : MEMORYPOOL
      fblkcnt: 1

  do_0:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK1
    syscall: tget_mpf(MPF1, &blk, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: waiting
      wobjid : MPF1
      lefttmo: ANY_ELAPSED_TIME

    MPF1:
      wtsklist:
        - TASK1:

  do_2:
    id     : TASK2
    syscall: TTSP_REL_MPF(MPF1, blk)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: running

    MPF1:
      wtsklist:
