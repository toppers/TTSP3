version: "$Id: try_spn_F-d.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_spin_lock_try_spn_F_d:
  note: 【NGKI2192】【NGKI2193】【NGKI2194】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: try_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      loc_cpu: true
