version: "$Id: unl_spn_F-c-1.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_spin_lock_unl_spn_F_c_1:
  note: 【NGKI2203】【NGKI2204】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: unl_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
