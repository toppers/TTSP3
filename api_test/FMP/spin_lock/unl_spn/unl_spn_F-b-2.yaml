version: "$Id: unl_spn_F-b-2.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_spin_lock_unl_spn_F_b_2:
  note: 【NGKI2205】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: unl_spn(SPN1)
    ercd   : E_ILUSE

  post_condition:
