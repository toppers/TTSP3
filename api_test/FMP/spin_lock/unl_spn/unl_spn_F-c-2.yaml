version: "$Id: unl_spn_F-c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_unl_spn_F_c_2:
  note: 【NGKI2203】【NGKI2204】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      prcid  : PRC_SELF

    TASK3:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK3
    syscall: TTSP_ACT_TSK(TASK2)
    ercd   : E_OK

  post_condition_0:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_HIGH

  do_1:
    id     : TASK1
    syscall: unl_spn(SPN1)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
