version: "$Id: loc_spn_F-d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_d:
  note: 【NGKI2179】【NGKI2180】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running-waitspin
      spinid : SPN1

  do_1:
    id     : TASK2
    syscall: TTSP_UNL_SPN(SPN1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    SPN1:
      procid: TASK1

    CPU_STATE1:
      loc_cpu: true

    CPU_STATE2:
      loc_cpu: false
