version: "$Id: loc_spn_F-c_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_c_ai:
  note: 【NGKI2178】【NGKI2181】【NGKI2182】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do:
    id     : DUMMY_ALM
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC
      procid : DUMMY_ALM

    CPU_STATE1:
      loc_cpu: true

FMP_spin_lock_loc_spn_F_c_ci:
  note: 【NGKI2178】【NGKI2181】【NGKI2182】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do:
    id     : DUMMY_CYC
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC
      procid : DUMMY_CYC

    CPU_STATE1:
      loc_cpu: true
