version: "$Id: ref_spn_F-b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_ref_spn_F_b_1:
  note: 【NGKI2209】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rspn:
          type   : T_RSPN
          spnstat: ANY_SPINLOCK_STAT
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

  do:
    id     : TASK1
    syscall: ref_spn(0, &rspn)
    ercd   : E_ID

  post_condition:
