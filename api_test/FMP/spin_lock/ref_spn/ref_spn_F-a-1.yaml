version: "$Id: ref_spn_F-a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_ref_spn_F_a_1:
  note: 【NGKI2207】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rspn:
          type   : T_RSPN
          spnstat: ANY_SPINLOCK_STAT
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

  do:
    id     : ALM1
    syscall: ref_spn(SPN1, &rspn)
    ercd   : E_CTX

  post_condition:
