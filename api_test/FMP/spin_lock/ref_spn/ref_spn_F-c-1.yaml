version: "$Id: ref_spn_F-c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_spin_lock_ref_spn_F_c_1:
  note: 【NGKI2213】【NGKI2214】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rspn:
          type: T_RSPN
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

  do:
    id     : TASK1
    syscall: ref_spn(SPN1, &rspn)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rspn:
          spnstat: TSPN_UNL
