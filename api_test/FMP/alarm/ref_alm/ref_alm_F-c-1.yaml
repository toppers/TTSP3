version: "$Id: ref_alm_F-c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_ref_alm_F_c_1:
  note: 【NGKI2579】【NGKI2580】【NGKI2582】【NGKI2583】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        ralm:
          type: T_RALM
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      prcid    : PRC_SELF

  do:
    id     : TASK1
    syscall: ref_alm(ALM1, &ralm)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        ralm:
          almstat: TALM_STP
          prcid  : PRC_SELF
