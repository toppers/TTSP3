version: "$Id: msta_alm_F-i-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_msta_alm_F_i_2_ai:
  note: 【NGKI2554】【NGKI2555】【NGKI2560】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      class    : CLS_OTHER_ALL
      prcid    : PRC_OTHER

  do_0:
    id     : DUMMY_ALM
    syscall: msta_alm(ALM1, RELATIVE_TIME_A, TPRC_INI)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: RELATIVE_TIME_A
      prcid  : PRC_OTHER

  do_1:
    id  : DUMMY_ALM
    code: return

  post_condition_1:
    0:
      DUMMY_ALM:
        hdlstat: STP

      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A
        prcid  : PRC_OTHER

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE

FMP_alarm_msta_alm_F_i_2_ci:
  note: 【NGKI2554】【NGKI2555】【NGKI2560】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      class    : CLS_OTHER_ALL
      prcid    : PRC_OTHER

  do_0:
    id     : DUMMY_CYC
    syscall: msta_alm(ALM1, RELATIVE_TIME_A, TPRC_INI)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: RELATIVE_TIME_A
      prcid  : PRC_OTHER

  do_1:
    id  : DUMMY_CYC
    code: return

  post_condition_1:
    0:
      DUMMY_CYC:
        hdlstat: STP

      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A
        prcid  : PRC_OTHER

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
