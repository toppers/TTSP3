  do_0:
    id     : DUMMY_CYC
    syscall: msta_alm(ALM1, 0, PRC_SELF)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: 0

  do_1:
    id  : DUMMY_CYC
    code: return

  post_condition_1:
    0:
      DUMMY_CYC:
        hdlstat: STP

      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: 0

    1:
