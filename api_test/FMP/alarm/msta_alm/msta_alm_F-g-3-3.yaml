version: "$Id: msta_alm_F-g-3-3.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_alarm_msta_alm_F_g_3_3:
  note: 【NGKI2555】【NGKI2557】【NGKI2558】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER_1

  do:
    id     : TASK1
    syscall: msta_alm(ALM1, RELATIVE_TIME_A, PRC_OTHER_2)
    ercd   : E_OK

  post_condition:
    0:
      ALM1:
        almstat: TALM_STA
        hdlstat: STP
        lefttim: RELATIVE_TIME_A
        bootcnt: 1
        prcid  : PRC_OTHER_2

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
        bootcnt: 1
