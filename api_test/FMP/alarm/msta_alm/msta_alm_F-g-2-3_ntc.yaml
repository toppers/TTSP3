version: "$Id: msta_alm_F-g-2-3_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_msta_alm_F_g_2_3_ai:
  note: 【NGKI2555】【NGKI2557】【NGKI2558】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER

  do_0:
    id     : DUMMY_ALM
    syscall: msta_alm(ALM1, RELATIVE_TIME_A, PRC_OTHER)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      hdlstat: STP
      lefttim: RELATIVE_TIME_A
      bootcnt: 1
      prcid  : PRC_OTHER

  do_1:
    id  : DUMMY_ALM
    code: return

  post_condition_1:
    0:
      DUMMY_ALM:
        hdlstat: STP

      ALM1:
        almstat: TALM_STA
        hdlstat: STP
        lefttim: RELATIVE_TIME_A
        bootcnt: 1
        prcid  : PRC_OTHER

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
        bootcnt: 1

