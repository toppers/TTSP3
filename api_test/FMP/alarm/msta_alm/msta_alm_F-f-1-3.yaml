version: "$Id: msta_alm_F-f-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_msta_alm_F_f_1_3:
  note: 【NGKI2554】【NGKI2555】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      prcid    : PRC_SELF

  do:
    id     : TASK1
    syscall: msta_alm(ALM1, 0, PRC_SELF)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: 0

    1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
