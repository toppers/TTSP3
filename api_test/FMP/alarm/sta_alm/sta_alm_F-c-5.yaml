version: "$Id: sta_alm_F-c-5.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_c_5:
  note: 【NGKI2541】【NGKI2542】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      actcnt : 1
      prcid  : PRC_OTHER

    ALM1:
      type      : ALARM
      nfytype   : TNFY_ACTTSK
      nfy_info1 : TASK3
      enfytype  : TENFY_INCVAR
      enfy_info1: "&data"
      almstat   : TALM_STP
      prcid     : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition_0:
    0:
      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

  do_1:
    RELATIVE_TIME_A+1:
      id  : TASK1
      code: ttsp_value_sync("TASK1", "data", &data, ANY_VALUE+1)

  post_condition_1:
    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: ANY_VALUE+1

      ALM1:
        almstat: TALM_STP
