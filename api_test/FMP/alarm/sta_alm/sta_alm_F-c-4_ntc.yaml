version: "$Id: sta_alm_F-c-4_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_c_4_ai:
  note: 【NGKI2541】【NGKI2542】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE+1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      actcnt : 1
      prcid  : PRC_OTHER

    ALM1:
      type      : ALARM
      nfytype   : TNFY_ACTTSK
      nfy_info1 : TASK3
      enfytype  : TENFY_SETVAR
      enfy_info1: "&data"
      almstat   : TALM_STP
      prcid     : PRC_OTHER

  do_0:
    id     : DUMMY_ALM
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: RELATIVE_TIME_A

  do_1:
    id  : DUMMY_ALM
    code: return

  post_condition_1:
    0:
      DUMMY_ALM:
        hdlstat: STP

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

  do_2:
    RELATIVE_TIME_A+1:
      id  : TASK1
      code: ttsp_value_sync("TASK1", "data", &data, E_QOVR)

  post_condition_2:
    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: E_QOVR

      ALM1:
        almstat: TALM_STP

FMP_alarm_sta_alm_F_c_4_ci:
  note: 【NGKI2541】【NGKI2542】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE+1

    TASK2:
