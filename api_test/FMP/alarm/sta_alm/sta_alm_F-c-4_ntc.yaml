  do_0:
    id     : DUMMY_CYC
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: RELATIVE_TIME_A

  do_1:
    id  : DUMMY_CYC
    code: return

  post_condition_1:
    0:
      DUMMY_CYC:
        hdlstat: STP

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

  do_2:
    RELATIVE_TIME_A+1:
      id  : TASK1
      code: ttsp_value_sync("TASK1", "data", &data, E_QOVR)

  post_condition_2:
    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: E_QOVR

      ALM1:
        almstat: TALM_STP
