version: "$Id: sta_alm_F-c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_c_2:
  note: 【NGKI2541】【NGKI2542】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE+1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_SETVAR
      nfy_info1: "&data"
      nfy_info2: ANY_VALUE
      almstat  : TALM_STP
      prcid    : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition_0:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      TASK1:
        var:
          data:
            value: ANY_VALUE+1

      ALM1:
        lefttim: 0

  do_1:
    RELATIVE_TIME_A+1:
      id  : TASK1
      code: ttsp_value_sync("TASK1", "data", &data, ANY_VALUE)

  post_condition_1:
    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: ANY_VALUE

      ALM1:
        almstat: TALM_STP
