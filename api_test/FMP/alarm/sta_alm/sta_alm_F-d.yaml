version: "$Id: sta_alm_F-d.yaml 67 2020-02-04 09:15:32Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_d:
  note: TESRY_001，【NGKI2543】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STA
      hdlstat  : STP
      lefttim  : RELATIVE_TIME_A
      prcid    : PRC_OTHER

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_B)
    ercd   : E_OK

  post_condition:
    0:
      ALM1:
        lefttim: RELATIVE_TIME_B

    RELATIVE_TIME_B:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_B+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
