version: "$Id: stp_alm_F-b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_alarm_stp_alm_F_b:
  note: 【NGKI2570】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      prcid  : PRC_SELF

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A
      prcid    : PRC_OTHER

  do:
    id     : TASK1
    syscall: stp_alm(ALM1)
    ercd   : E_OK

  post_condition:
    ALM1:
      almstat: TALM_STP
