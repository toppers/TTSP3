version: "$Id: set_tim_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_time_manage_set_tim_F_a:
  note: 【NGKI3565】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      systim : ANY_SYSTEM_TIME
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: set_tim(ANY_SYSTEM_TIME*2)
    ercd   : E_CTX

  post_condition:
