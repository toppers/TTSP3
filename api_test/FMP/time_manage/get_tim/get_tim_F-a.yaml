version: "$Id: get_tim_F-a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
FMP_time_manage_get_tim_F_a:
  note: 【NGKI2351】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type : SYSTIM
          value: ANY_ELAPSED_TIME
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_tim(&systim)
    ercd   : E_CTX

  post_condition:
