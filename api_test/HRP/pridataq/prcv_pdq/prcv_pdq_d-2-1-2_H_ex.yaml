ASP_pridataq_prcv_pdq_d_2_1_2_H1:
  note: 【NGKI1894】【NGKI1893】【NGKI1895】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      datalist:
        - data   : DATA_B
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_B
        datapri:
          value: DATA_PRI_MID

    TASK2:
      tskstat: ready
      wobjid :
      porder : 2

    TASK3:
      tskstat: ready
      porder : 1

    PDQ1:
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW

