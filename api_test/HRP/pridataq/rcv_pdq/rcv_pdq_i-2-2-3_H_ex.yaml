version: "$Id: rcv_pdq_i-2-2-3_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_pridataq_rcv_pdq_i_2_2_3_H1:
  note: 【NGKI1894】【NGKI1897】【NGKI1899】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqatr  : TA_NULL
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_A
        datapri:
          value: DATA_PRI_HIGH

    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      stsklist:
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID

