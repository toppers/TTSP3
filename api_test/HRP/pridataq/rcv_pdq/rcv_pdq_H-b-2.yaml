version: "$Id: rcv_pdq_H-b-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_pridataq_rcv_pdq_H_b_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : intptr_t
          value: DATA_A
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rcv_pdq(PDQ1, &data, (PRI*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
