ASP_pridataq_snd_pdq_h_2_2_H1:
  note: 【NGKI1900】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      pdqcnt: 0
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK2
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do_1:
    id     : TASK1
    syscall: TTSP_PRCV_PDQ(PDQ1, &data, &datapri)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    PDQ1:
      stsklist:

