version: "$Id: ref_pdq_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_pridataq_ref_pdq_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rpdq:
          type   : T_RPDQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          spdqcnt: ANY_DATA_CNT
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      domain: DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1,&rpdq)
    ercd   : E_OACV

  post_condition:
