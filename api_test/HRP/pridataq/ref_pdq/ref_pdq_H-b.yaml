version: "$Id: ref_pdq_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_pridataq_ref_pdq_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1, (T_RPDQ*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
