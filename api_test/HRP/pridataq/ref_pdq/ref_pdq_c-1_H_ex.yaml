ASP_pridataq_ref_pdq_c_1_H1:
  note: 【NGKI1918】【NGKI1919】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rpdq:
          type: T_RPDQ
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1,&rpdq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rpdq:
          stskid : TASK2
          rtskid : TSK_NONE
          spdqcnt: 0

