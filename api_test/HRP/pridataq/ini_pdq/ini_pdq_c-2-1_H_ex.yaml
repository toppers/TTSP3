      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID
        - TASK4:
            data   : DATA_C
            datapri: DATA_PRI_LOW
      datalist:
        - data   : DATA_D
          datapri: DATA_PRI_MID
        - data   : DATA_E
          datapri: DATA_PRI_MID
        - data   : DATA_F
          datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_pdq(PDQ1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :
      porder : 2

    TASK3:
