ASP_pridataq_ini_pdq_c_1_1_2_H1:
  note: 【NGKI1908】【NGKI1909】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      domain  : DOM1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_pdq(PDQ1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      stsklist:

