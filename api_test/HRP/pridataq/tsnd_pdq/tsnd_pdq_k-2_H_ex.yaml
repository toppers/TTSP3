ASP_pridataq_tsnd_pdq_k_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : PDQ1

      PDQ1:
        stsklist:
          - TASK1:
              data   : DATA_A
              datapri: DATA_PRI_HIGH

    FOREVER_TIME:

