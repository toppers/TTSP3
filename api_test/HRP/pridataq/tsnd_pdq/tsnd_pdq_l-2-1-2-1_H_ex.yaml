version: "$Id: tsnd_pdq_l-2-1-2-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_pridataq_tsnd_pdq_l_2_1_2_1_H1:
  note: 【NGKI1874】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqatr  : TA_TPRI
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_B
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_D, DATA_PRI_HIGH, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      stsklist:
        - TASK1:
            data   : DATA_D
            datapri: DATA_PRI_HIGH

