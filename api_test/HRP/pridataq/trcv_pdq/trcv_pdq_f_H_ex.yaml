ASP_pridataq_trcv_pdq_f_H1:
  note: 【NGKI3462】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      pdqcnt: 0
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK2
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      rtsklist:
        - TASK2:
            vardata: data
            varpri : datapri

  do_1:
    id     : TASK1
    syscall: TTSP_RAS_TER(TASK2)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      raster : true

    PDQ1:
      rtsklist:

