version: "$Id: trcv_pdq_k-2-1-2-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_k_2_1_2_2_H1:
  note: 【NGKI1901】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqatr  : TA_TPRI
      pdqcnt  : 3
      rtsklist:
        - TASK2:
        - TASK3:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      rtsklist:
        - TASK2:
        - TASK3:
        - TASK1:

