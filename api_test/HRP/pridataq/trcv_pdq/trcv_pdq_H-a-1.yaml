version: "$Id: trcv_pdq_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_pridataq_trcv_pdq_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID
      domain : DOM1

    PDQ1:
      type  : P_DATAQUEUE
      domain: KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_OACV

  post_condition:
