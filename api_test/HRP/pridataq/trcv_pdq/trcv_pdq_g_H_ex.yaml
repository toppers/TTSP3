          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK2
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      rtsklist:
        - TASK2:
            vardata: data
            varpri : datapri

  do_1:
    id     : TASK1
    syscall: TTSP_INI_PDQ(PDQ1)

  post_condition_1:
