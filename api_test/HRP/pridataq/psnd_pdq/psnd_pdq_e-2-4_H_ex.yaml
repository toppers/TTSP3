ASP_pridataq_psnd_pdq_e_2_4_H1:
  note: 【NGKI1871】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting-suspended
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri
        - TASK3:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
      wobjid :

    PDQ1:
      rtsklist:
        - TASK3:

