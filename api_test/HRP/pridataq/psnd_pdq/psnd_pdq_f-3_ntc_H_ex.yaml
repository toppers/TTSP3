version: "$Id: psnd_pdq_f-3_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_f_3_ai_H2:
  note: 【NGKI1873】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      rtsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: psnd_pdq(PDQ1, DATA_C, DATA_PRI_MID)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

