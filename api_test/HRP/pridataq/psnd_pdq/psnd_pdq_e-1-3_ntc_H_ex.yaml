version: "$Id: psnd_pdq_e-1-3_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_e_1_3_ai_H2:
  note: 【NGKI1871】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI
      domain : KERNEL

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      rtsklist:

