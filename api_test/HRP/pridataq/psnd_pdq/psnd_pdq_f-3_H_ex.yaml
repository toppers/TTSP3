ASP_pridataq_psnd_pdq_f_3_H1:
  note: 【NGKI1873】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      rtsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: psnd_pdq(PDQ1, DATA_C, DATA_PRI_MID)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

