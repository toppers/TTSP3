version: "$Id: get_ipm_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_interrupt_get_ipm_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        intpri:
          type : PRI
          value: ANY_IPM
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_ipm(&intpri)
    ercd   : E_OACV

  post_condition:
