version: "$Id: chg_ipm_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_interrupt_chg_ipm_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_ipm(ANY_IPM)
    ercd   : E_OACV

  post_condition:
