version: "$Id: chg_ipm_c-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_interrupt_chg_ipm_c_1_H3:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP2

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_ipm(ANY_IPM)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      chg_ipm: ANY_IPM

ASP_interrupt_chg_ipm_c_1_H5:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_CHG_IPM(ANY_IPM)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      chg_ipm: ANY_IPM
