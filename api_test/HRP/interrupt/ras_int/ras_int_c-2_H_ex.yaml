      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP2

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      intreq : false

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      access1: TACP_KERNEL
