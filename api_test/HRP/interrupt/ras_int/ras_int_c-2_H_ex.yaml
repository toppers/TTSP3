      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: ras_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intreq: true

  do_1:
    id     : TASK1
    syscall: TTSP_UNL_CPU()
    ercd   : E_OK

  post_condition_1:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    CPU_STATE:
      loc_cpu: false

  do_2:
    id  : INH1
    code: return

  post_condition_2:
    INH1:
      hdlstat: STP

