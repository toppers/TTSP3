ASP_interrupt_dis_int_c_2_H3:
  note: TESRY_006，【NGKI3086】
  variation:
    api_support_dis_int: true
    api_support_ena_int: true

  pre_condition:
    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      intreq : false

    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP2

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: dis_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intstat: TA_DISINT

  do_1:
    id  : TASK1
    code: ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_1:
    INH1:
      intreq: true

  do_2:
    id     : TASK1
    syscall: TTSP_ENA_INT(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_2:
    INH1:
      intstat: TA_ENAINT

  do_3:
    id     : TASK1
    syscall: TTSP_UNL_CPU()

  post_condition_3:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    CPU_STATE:
      loc_cpu: false
      chg_ipm: INT_PRI_MID

