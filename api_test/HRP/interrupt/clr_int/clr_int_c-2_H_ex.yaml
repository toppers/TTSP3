ASP_interrupt_clr_int_c_2_H3:
  note: 【NGKI3924】
  variation:
    api_support_clr_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP2

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      intreq : true

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: clr_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition:
    INH1:
      intreq: false

