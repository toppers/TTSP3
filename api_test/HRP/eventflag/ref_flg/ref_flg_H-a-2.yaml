version: "$Id: ref_flg_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_eventflag_ref_flg_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rflg:
          type  : T_RFLG
          wtskid: ANY_OBJECT_ID
          flgptn: BIT_PATTERN_A
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      domain: DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_flg(FLG1, &rflg)
    ercd   : E_OACV

  post_condition:
