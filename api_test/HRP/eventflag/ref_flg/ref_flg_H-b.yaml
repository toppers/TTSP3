version: "$Id: ref_flg_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_eventflag_ref_flg_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_flg(FLG1, (T_RFLG*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
