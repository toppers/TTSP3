version: "$Id: pol_flg_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_eventflag_pol_flg_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A
      domain : DOM1

    FLG1:
      type   : EVENTFLAG
      iflgptn: BIT_PATTERN_0A
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: pol_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_OACV

  post_condition:
