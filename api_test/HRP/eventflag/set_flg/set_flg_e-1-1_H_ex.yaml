version: "$Id: set_flg_e-1-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_eventflag_set_flg_e_1_1_H1:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      var    :
        flgptn:
          type: FLGPTN
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
            var   : flgptn
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        flgptn:
          value: BIT_PATTERN_0A|BIT_PATTERN_A

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
      wtsklist:

