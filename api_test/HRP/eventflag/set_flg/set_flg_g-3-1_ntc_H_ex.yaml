version: "$Id: set_flg_g-3-1_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_eventflag_set_flg_g_3_1_ai_H2:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : KERNEL

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : KERNEL

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : KERNEL

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: TWF_ANDW
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ANDW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ANDW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: set_flg(FLG1, BIT_PATTERN_A|BIT_PATTERN_B|BIT_PATTERN_C)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 3

    TASK4:
      tskstat: ready
      porder : 4

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A|BIT_PATTERN_B|BIT_PATTERN_C
      wtsklist:

