version: "$Id: set_flg_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_eventflag_set_flg_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    FLG1:
      type   : EVENTFLAG
      iflgptn: BIT_PATTERN_0A
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_0B)
    ercd   : E_OACV

  post_condition:
