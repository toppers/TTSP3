ASP_eventflag_wai_flg_j_1_H1:
  note: 【NGKI1636】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type: FLGPTN
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      flgatr: TA_NULL
      flgptn: BIT_PATTERN_A|BIT_PATTERN_B
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_A, WAIT_FLG_MODE_B, &flgptn)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        flgptn:
          value: BIT_PATTERN_A|BIT_PATTERN_B

