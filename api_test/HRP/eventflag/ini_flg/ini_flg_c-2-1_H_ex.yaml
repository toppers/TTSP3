ASP_eventflag_ini_flg_c_2_1_H1:
  note: 【NGKI1645】【NGKI1646】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : DOM1

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      iflgptn : BIT_PATTERN_0A
      flgptn  : BIT_PATTERN_0B
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: WAIT_FLG_MODE_C
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_flg(FLG1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 3

    TASK4:
      tskstat: ready
      porder : 4

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:

