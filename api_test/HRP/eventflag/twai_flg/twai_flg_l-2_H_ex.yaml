ASP_eventflag_twai_flg_l_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : FLG1

      FLG1:
        wtsklist:
          - TASK1:
              waiptn: BIT_PATTERN_B
              wfmode: WAIT_FLG_MODE_A

    FOREVER_TIME:

