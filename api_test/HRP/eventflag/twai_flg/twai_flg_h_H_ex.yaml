version: "$Id: twai_flg_h_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_eventflag_twai_flg_h_H1:
  note: 【NGKI1635】【NGKI1647】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    FLG1:
      type   : EVENTFLAG
      iflgptn: BIT_PATTERN_0A
      flgptn : BIT_PATTERN_0B
      domain : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, ANY_ELAPSED_TIME)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : FLG1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A

  do_1:
    id     : TASK2
    syscall: TTSP_INI_FLG(FLG1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:

