version: "$Id: rel_wai_f-5_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_rel_wai_f_5_H2:
  note: TESRY_003，【NGKI1296】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK1
    syscall: TTSP_WAI_SEM(SEM1)
    ercd   : E_RLWAI

  post_condition_1:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

    SEM1:
      wtsklist:
        - TASK1:

  do_2:
    id     : ALM1
    syscall: rel_wai(TASK1)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: ready

    SEM1:
      wtsklist:

  do_3:
    id  : ALM1
    code: return

  post_condition_3:
    ALM1:
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      tskstat: running
