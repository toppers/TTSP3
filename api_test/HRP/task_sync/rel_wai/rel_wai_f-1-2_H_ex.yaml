ASP_task_sync_rel_wai_f_1_2_H1:
  note: 【NGKI1296】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rel_wai(TASK2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    SEM1:
      wtsklist:

