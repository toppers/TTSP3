ASP_task_sync_wup_tsk_f_4_H1:
  note: 【NGKI1273】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      wupcnt : 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      wupcnt: 1

