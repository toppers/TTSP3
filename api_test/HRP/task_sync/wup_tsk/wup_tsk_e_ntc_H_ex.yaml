version: "$Id: wup_tsk_e_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_wup_tsk_e_ai_H2:
  note: 【NGKI1273】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: wup_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      wupcnt: 1

ASP_task_sync_wup_tsk_e_ci_H2:
  note: 【NGKI1273】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_CYC
    syscall: wup_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      wupcnt: 1
