version: "$Id: tslp_tsk_k_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_tslp_tsk_k_H3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tslp_tsk(TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : SLEEP

      TASK2:
        tskstat: running

    FOREVER_TIME:
