version: "$Id: tslp_tsk_h_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_tslp_tsk_h_H3:
  note: 【NGKI3455】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: tslp_tsk(ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SLEEP
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready
