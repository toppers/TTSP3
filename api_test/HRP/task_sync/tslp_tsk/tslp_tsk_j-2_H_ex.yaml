version: "$Id: tslp_tsk_j-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_tslp_tsk_j_2_H3:
  note: 【NGKI1260】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      wupcnt : 0
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      wupcnt : 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tslp_tsk(ANY_ELAPSED_TIME)
    ercd   : E_TMOUT

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : SLEEP
        lefttmo: ANY_ELAPSED_TIME

      TASK2:
        tskstat: running

    ANY_ELAPSED_TIME:
      TASK1:
        lefttmo: 0

    ANY_ELAPSED_TIME+1:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
