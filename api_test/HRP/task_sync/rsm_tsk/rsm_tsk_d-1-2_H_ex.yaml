ASP_task_sync_rsm_tsk_d_1_2_H1:
  note: 【NGKI1320】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: suspended
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

