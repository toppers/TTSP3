ASP_task_sync_sus_tsk_h_2_H1:
  note: 【NGKI1307】【NGKI3604】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

