ASP_task_sync_sus_tsk_l_H1:
  note: 【NGKI1308】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: waiting-suspended

