version: "$Id: dly_tsk_g_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_g_H3:
  note: 【NGKI1353】【NGKI1354】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: dly_tsk(1)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: 1

      TASK2:
        tskstat: running

    1:
      TASK1:
        lefttmo: 0

    2:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
