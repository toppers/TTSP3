version: "$Id: dly_tsk_h-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_h_2_H3:
  note: 【NGKI1353】【NGKI1354】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: dly_tsk(RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: RELATIVE_TIME_A

      TASK2:
        tskstat: running

    RELATIVE_TIME_A:
      TASK1:
        lefttmo: 0

    RELATIVE_TIME_A+1:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
