version: "$Id: ref_alm_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_alarm_ref_alm_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        ralm:
          type   : T_RALM
          almstat: ANY_ALARM_STAT
          lefttim: RELATIVE_TIME_A
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_alm(ALM1, &ralm)
    ercd   : E_OACV

  post_condition:
