version: "$Id: ref_alm_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_alarm_ref_alm_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      access1  : TACP(DOM1)
      access2  : TACP(DOM1)
      access3  : TACP(DOM1)
      access4  : TACP(DOM1)

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_alm(ALM1, (T_RALM*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
