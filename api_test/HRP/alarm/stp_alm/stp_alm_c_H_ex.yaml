ASP_alarm_stp_alm_c_H1:
  note: 【NGKI2570】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: stp_alm(ALM1)
    ercd   : E_OK

  post_condition:
    ALM1:
      almstat: TALM_STP

