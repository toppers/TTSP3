version: "$Id: sta_alm_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_alarm_sta_alm_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OACV

  post_condition:
