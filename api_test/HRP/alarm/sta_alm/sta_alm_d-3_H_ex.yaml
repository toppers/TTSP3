ASP_alarm_sta_alm_d_3_H1:
  note: 【NGKI2541】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STP
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      TASK1:
        var:
          data:
            value: ANY_VALUE

      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: ANY_VALUE+1

      ALM1:
        almstat: TALM_STP

