ASP_task_term_ter_tsk_f_1_H1:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      itskpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      actcnt : 1
      wupcnt : 1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri : TSK_PRI_LOW
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

