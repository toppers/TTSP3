ASP_task_term_ter_tsk_f_3_3_H1:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      actcnt : 1
      wupcnt : 1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_MID
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

