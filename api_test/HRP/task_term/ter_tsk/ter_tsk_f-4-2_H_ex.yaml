ASP_task_manage_ter_tsk_f_4_2_H1:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      actcnt : 1
      wupcnt : 1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_LOW
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

    SEM1:
      wtsklist:

