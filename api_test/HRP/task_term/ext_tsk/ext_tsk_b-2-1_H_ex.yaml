ASP_task_term_ext_tsk_b_2_1_H3:
  note: 【NGKI3449】【NGKI1169】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      actcnt : 1
      wupcnt : 1
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_LOW
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
