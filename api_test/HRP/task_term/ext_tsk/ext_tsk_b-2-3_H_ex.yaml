version: "$Id: ext_tsk_b-2-3_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_term_ext_tsk_b_2_3_H3:
  note: 【NGKI3449】【NGKI1169】【NGKI1168】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      actcnt : 1
      wupcnt : 1
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_LOW
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskpri : TSK_PRI_HIGH
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

    CPU_STATE:
      chg_ipm: TIPM_ENAALL
