version: "$Id: adj_tim_e-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_time_manage_adj_tim_e_1_H3:
  note: 【NGKI3587】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM_SYS_ACP3

    ALM1:
      type     : ALARM
      almstat  : TALM_STA
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      lefttim  : RELATIVE_TIME_C
      hdlstat  : STP
      domain   : KERNEL

    CPU_STATE:
      type   : CPU_STATE
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP(DOM_SYS_ACP3)
      access4: TACP_KERNEL

    DOM_SYS_ACP3:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: adj_tim(ANY_ADJUST_PLUS_TIME)
    ercd   : E_OK

  post_condition_0:
    0:
      ALM1:
        lefttim: RELATIVE_TIME_C-ANY_ADJUST_PLUS_TIME

    RELATIVE_TIME_C-ANY_ADJUST_PLUS_TIME:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_C-ANY_ADJUST_PLUS_TIME+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE

  do_1:
    RELATIVE_TIME_C-ANY_ADJUST_PLUS_TIME+1:
      id  : ALM1
      code: return

  post_condition_1:
    RELATIVE_TIME_C-ANY_ADJUST_PLUS_TIME+1:
      ALM1:
        hdlstat: STP

