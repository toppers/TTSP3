version: "$Id: set_tim_b_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_time_manage_set_tim_b_H3:
  note: 【NGKI3567】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP3

    CPU_STATE:
      type   : CPU_STATE
      systim : ANY_SYSTEM_TIME
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP(DOM_SYS_ACP3)
      access4: TACP_KERNEL

    DOM_SYS_ACP3:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: set_tim(ANY_SYSTEM_TIME*2)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      systim: ANY_SYSTEM_TIME*2

ASP_time_manage_set_tim_b_H5:
  note: 【NGKI3567】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CPU_STATE:
      type  : CPU_STATE
      systim: ANY_SYSTEM_TIME

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_SET_TIM(ANY_SYSTEM_TIME*2)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      systim: ANY_SYSTEM_TIME*2
