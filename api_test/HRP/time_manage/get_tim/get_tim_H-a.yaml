version: "$Id: get_tim_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_time_manage_get_tim_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type: SYSTIM
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tim(&systim)
    ercd   : E_OACV

  post_condition:
