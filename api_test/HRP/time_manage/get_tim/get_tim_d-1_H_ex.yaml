version: "$Id: get_tim_d-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_time_manage_get_tim_d_1_H3:
  note: 【NGKI3592】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim1:
          type: SYSTIM
        systim2:
          type: SYSTIM
      domain : DOM_SYS_ACP4

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      domain : DOM_SYS_ACP4

    ALM1:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK2
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A
      domain   : DOM_SYS_ACP4

    CPU_STATE:
      type   : CPU_STATE
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP(DOM_SYS_ACP4)

    DOM_SYS_ACP4:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: get_tim(&systim1)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: TTSP_ADJ_TIM(ANY_ADJUST_MINUS_TIME)
    ercd   : E_OK

  post_condition_1:
    ALM1:
      lefttim: ANY_ADJUST_PLUS_TIME+RELATIVE_TIME_A

  do_2:
    id     : TASK1
    syscall: get_tim(&systim2)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      var:
        systim2:
          value: systim1

  do_3:
    id     : TASK1
    syscall: TTSP_SET_TIM(systim1+ANY_ADJUST_MINUS_TIME-1)
    ercd   : E_OK

  post_condition_3:

  do_4:
    id     : TASK1
    syscall: get_tim(&systim2)
    ercd   : E_OK

  post_condition_4:
    ALM1:
      lefttim: ANY_ADJUST_PLUS_TIME+RELATIVE_TIME_A

    TASK1:
      var:
        systim2:
          value: systim1+ANY_ADJUST_MINUS_TIME-1

