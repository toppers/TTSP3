version: "$Id: get_tim_c_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_time_manage_get_tim_c_H3:
  note: 【NGKI3591】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type: SYSTIM
      domain : DOM_SYS_ACP4

    CPU_STATE:
      type   : CPU_STATE
      systim : ANY_SYSTEM_TIME
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP(DOM_SYS_ACP4)

    DOM_SYS_ACP4:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: TTSP_ADJ_TIM(ANY_ADJUST_MINUS_TIME)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: get_tim(&systim)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      var:
        systim:
          value: ANY_SYSTEM_TIME

ASP_time_manage_get_tim_c_H5:
  note: 【NGKI3591】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type: SYSTIM
      domain : DOM1

    CPU_STATE:
      type  : CPU_STATE
      systim: ANY_SYSTEM_TIME

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: TTSP_ADJ_TIM(ANY_ADJUST_MINUS_TIME)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: TTSP_GET_TIM(&systim)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      var:
        systim:
          value: ANY_SYSTEM_TIME
