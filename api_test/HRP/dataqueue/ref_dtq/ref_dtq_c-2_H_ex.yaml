ASP_dataqueue_ref_dtq_c_2_H1:
  note: 【NGKI1788】【NGKI1790】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rdtq:
          type: T_RDTQ
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rdtq:
          stskid : TSK_NONE
          rtskid : TASK2
          sdtqcnt: 0

