ASP_dataqueue_ref_dtq_c_1_H1:
  note: 【NGKI1788】【NGKI1789】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rdtq:
          type: T_RDTQ
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rdtq:
          stskid : TASK2
          rtskid : TSK_NONE
          sdtqcnt: 0

