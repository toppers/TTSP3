version: "$Id: ref_dtq_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_dataqueue_ref_dtq_H_a_1:
  pre_condition:
    DTQ1:
      type  : DATAQUEUE
      domain: KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rdtq:
          type   : T_RDTQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          sdtqcnt: ANY_DATA_CNT
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_OACV

  post_condition:
