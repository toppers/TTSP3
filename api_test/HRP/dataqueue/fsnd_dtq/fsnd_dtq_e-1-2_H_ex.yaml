ASP_dataqueue_fsnd_dtq_e_1_2_H1:
  note: 【NGKI1750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: fsnd_dtq(DTQ1, DATA_D)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D

