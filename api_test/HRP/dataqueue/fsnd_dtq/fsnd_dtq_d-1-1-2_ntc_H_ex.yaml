version: "$Id: fsnd_dtq_d-1-1-2_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_dataqueue_fsnd_dtq_d_1_1_2_ai_H2:
  note: 【NGKI1747】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : KERNEL

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t
      domain : KERNEL

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: data
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: fsnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:

