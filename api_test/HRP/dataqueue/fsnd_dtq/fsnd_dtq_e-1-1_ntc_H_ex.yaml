version: "$Id: fsnd_dtq_e-1-1_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_dataqueue_fsnd_dtq_e_1_1_ai_H2:
  note: 【NGKI1750】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 1
      rtsklist:
      datalist:
        - data: DATA_A
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: fsnd_dtq(DTQ1, DATA_B)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_B

