ASP_dataqueue_rcv_dtq_h_2_1_3_H1:
  note: 【NGKI3421】【NGKI1766】【NGKI1767】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_B

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_A

