version: "$Id: prcv_dtq_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_dataqueue_prcv_dtq_H_b:
  pre_condition:
    DTQ1:
      type  : DATAQUEUE
      domain: DOM1

    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prcv_dtq(DTQ1, (intptr_t*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
