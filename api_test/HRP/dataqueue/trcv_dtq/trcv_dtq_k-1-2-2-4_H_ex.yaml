ASP_dataqueue_trcv_dtq_k_1_2_2_4_H1:
  note: 【NGKI3421】【NGKI1766】【NGKI1767】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_E
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_C

    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
        - TASK3:
            data: DATA_B
      datalist:
        - data: DATA_D
        - data: DATA_E
        - data: DATA_A

