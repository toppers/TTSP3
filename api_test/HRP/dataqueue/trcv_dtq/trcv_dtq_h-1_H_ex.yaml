ASP_dataqueue_trcv_dtq_h_1_H1:
  note: 【NGKI1735】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data:
          type: intptr_t
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 1
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_SND_DTQ(DTQ1, DATA_A)

  post_condition_1:
    TASK1:
      tskstat: running
      var    :
        data:
          value: DATA_A

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:

