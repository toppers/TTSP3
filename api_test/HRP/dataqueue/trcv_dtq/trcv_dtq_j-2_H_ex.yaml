ASP_dataqueue_trcv_dtq_j_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type: intptr_t
      domain : DOM1

    DTQ1:
      type  : DATAQUEUE
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DTQ1

      DTQ1:
        rtsklist:
          - TASK1:

    FOREVER_TIME:

