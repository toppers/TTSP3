version: "$Id: trcv_dtq_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_dataqueue_trcv_dtq_H_a_1:
  pre_condition:
    DTQ1:
      type  : DATAQUEUE
      domain: KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : intptr_t
          value: DATA_A
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OACV

  post_condition:
