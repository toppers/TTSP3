ASP_dataqueue_snd_dtq_i_1_1_1_H1:
  note: 【NGKI1737】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_NULL
      dtqcnt  : 0
      stsklist:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

