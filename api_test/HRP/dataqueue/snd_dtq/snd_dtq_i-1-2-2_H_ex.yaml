version: "$Id: snd_dtq_i-1-2-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_i_1_2_2_H1:
  note: 【NGKI1737】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_TPRI
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_E
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_F)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_F
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B

