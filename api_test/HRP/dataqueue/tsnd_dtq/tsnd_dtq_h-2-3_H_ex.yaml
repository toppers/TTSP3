ASP_dataqueue_tsnd_dtq_h_2_3_H1:
  note: 【NGKI1770】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      var    :
        data:
          type: intptr_t
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
      rtsklist:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

  do_1:
    id     : TASK2
    syscall: TTSP_TRCV_DTQ(DTQ1, &data, ANY_ELAPSED_TIME)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:

