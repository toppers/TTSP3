ASP_dataqueue_tsnd_dtq_j_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
      rtsklist:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DTQ1

      DTQ1:
        stsklist:
          - TASK1:
              data: DATA_A

    FOREVER_TIME:

