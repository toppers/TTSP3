ASP_dataqueue_tsnd_dtq_f_H1:
  note: 【NGKI3459】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 2
      datalist:
        - data: DATA_A
        - data: DATA_B
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_C, ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_C

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:

