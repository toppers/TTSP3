ASP_dataqueue_tsnd_dtq_k_2_2_2_H1:
  note: 【NGKI1736】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_C, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C

