version: "$Id: psnd_dtq_d-2-1-1_ten_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_d_2_1_1_at_H1:
  note: 【NGKI1734】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SNDDTQ
      nfy_info1: DTQ1
      nfy_info2: DATA_A
      almstat  : TALM_STP
      domain   : DOM1

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: data
        - TASK3:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        tskstat: ready

      TASK2:
        tskstat: running
        var    :
          data:
            value: DATA_A

      DTQ1:
        rtsklist:
          - TASK3:

