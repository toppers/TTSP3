version: "$Id: psnd_dtq_d-1-5_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_d_1_5_H2:
  note: TESRY_003，【NGKI1734】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: running
      domain : KERNEL

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK1:
            var: data
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK2
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK2
    syscall: slp_tsk()

  post_condition_1:
    TASK2:
      tskstat: waiting
      wobjid : SLEEP

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

  do_2:
    id     : ALM1
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: ready

    DTQ1:
      rtsklist:

  do_3:
    id  : ALM1
    code: return

  post_condition_3:
    ALM1:
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      tskstat: running
      var    :
        data:
          value: DATA_A

