version: "$Id: ref_mbf_H-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_ref_mbf_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        pk_rmbf:
          type: T_RMBF

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: ref_mbf(MBF1, &pk_rmbf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        pk_rmbf:
          stskid : TSK_NONE
          rtskid : TSK_NONE
          smbfcnt: 0
          fmbfsz : ANY_MBF_SIZE
