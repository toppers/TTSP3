version: "ref_mbf_H-b-1: mbfid below minimum -> E_ID"
HRP_ref_mbf_H_b_1:
  note: mbfidが許容される最小値-1(=0)の時にE_IDが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        pk_rmbf:
          type: T_RMBF

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: ref_mbf(0, &pk_rmbf)
    ercd   : E_ID

  post_condition:
