version: "$Id: ref_mbf_H-3.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_ref_mbf_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        pk_rmbf:
          type: T_RMBF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : 0
      stsklist:
        - TASK2:
            msg  : MBF_MSG_A
            msgsz: MBF_MSGSZ_A
        - TASK3:
            msg  : MBF_MSG_B
            msgsz: MBF_MSGSZ_B

  do:
    id     : TASK1
    syscall: ref_mbf(MBF1, &pk_rmbf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        pk_rmbf:
          stskid : TASK2
          rtskid : TSK_NONE
          smbfcnt: 0
          fmbfsz : 0
