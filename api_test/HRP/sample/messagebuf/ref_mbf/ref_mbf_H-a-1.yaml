version: "ref_mbf_H-a-1: non-task context -> E_CTX"
HRP_ref_mbf_H_a_1:
  note: 非タスクコンテキストからの呼出しでE_CTXが返ること．

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        pk_rmbf:
          type: T_RMBF

    TASK1:
      type   : TASK
      tskstat: running

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : ALM1
    syscall: ref_mbf(MBF1, &pk_rmbf)
    ercd   : E_CTX

  post_condition:
