version: "$Id: ref_mbf_H-5.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_ref_mbf_5:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        pk_rmbf:
          type: T_RMBF

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      var    :
        msg1  :
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
        msgsz1:
          type: uint_t

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      var    :
        msg2  :
          type   : uint8_t
          arraysz: MBF_MSGSZ_B
        msgsz2:
          type: uint_t

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : ANY_MBF_SIZE
      rtsklist:
        - TASK2:
            v_msg  : msg1
            v_msgsz: msgsz1
        - TASK3:
            v_msg  : msg2
            v_msgsz: msgsz2

  do:
    id     : TASK1
    syscall: ref_mbf(MBF1, &pk_rmbf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        pk_rmbf:
          stskid : TSK_NONE
          rtskid : TASK2
          smbfcnt: 0
          fmbfsz : ANY_MBF_SIZE
