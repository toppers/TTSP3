version: "psnd_mbf_H-a-2: CPU locked -> E_CTX"
HRP_psnd_mbf_H_a_2:
  note: CPUロック状態からの呼出しでE_CTXが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: psnd_mbf(MBF1, (void*)&message1, MBF_MSGSZ_A)
    ercd   : E_CTX

  post_condition:
