version: "$Id: psnd_mbf_H-3.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_psnd_mbf_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : 0

  do:
    id     : TASK1
    syscall: psnd_mbf(MBF1, (void*)&message1, MBF_MSGSZ_A)
    ercd   : E_TMOUT

  post_condition:
