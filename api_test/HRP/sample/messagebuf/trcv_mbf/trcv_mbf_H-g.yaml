version: "trcv_mbf_H-g: polling fails on empty buffer (TMO_POL) -> E_TMOUT"
HRP_trcv_mbf_H_g:
  note: tmoutがTMO_POLで，メッセージバッファ管理領域にメッセージがなく送信待ちタスクもいない場合，E_TMOUTが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: trcv_mbf(MBF1, (void*)&message1, TMO_POL)
    eruint : E_TMOUT

  post_condition:
