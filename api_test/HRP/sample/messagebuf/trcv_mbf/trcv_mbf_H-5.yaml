version: "$Id: trcv_mbf_H-5.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_trcv_mbf_5:
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: trcv_mbf(MBF1, (void*)&message1, ANY_ELAPSED_TIME)
    eruint : E_TMOUT

  post_condition:
