version: "$Id: rcv_mbf_H-4.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_rcv_mbf_4:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: rcv_mbf(MBF1, (void*)&message1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MBF1

    MBF1:
      rtsklist:
        - TASK1:
            v_msg: message1
