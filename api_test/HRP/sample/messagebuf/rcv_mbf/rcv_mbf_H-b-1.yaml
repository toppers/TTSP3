version: "rcv_mbf_H-b-1: mbfid below minimum -> E_ID"
HRP_rcv_mbf_H_b_1:
  note: mbfidが許容される最小値-1(=0)の時にE_IDが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: rcv_mbf(0, (void*)&message1)
    ercd   : E_ID

  post_condition:
