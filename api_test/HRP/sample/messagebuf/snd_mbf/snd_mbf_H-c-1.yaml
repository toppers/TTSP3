version: "snd_mbf_H-c-1: msgsz == 0 -> E_PAR"
HRP_snd_mbf_H_c_1:
  note: msgszが0の時にE_PARが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: snd_mbf(MBF1, (void*)&message1, 0)
    ercd   : E_PAR

  post_condition:
