version: "snd_mbf_H-c-2: msgsz > maxmsz -> E_PAR"
HRP_snd_mbf_H_c_2:
  note: msgszがmaxmszより大きい(ANY_MAX_MSIZE+1)の時にE_PARが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: ANY_MBF_SIZE

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: snd_mbf(MBF1, (void*)&message1, (ANY_MAX_MSIZE + 1))
    ercd   : E_PAR

  post_condition:
