version: "snd_mbf_H-f: msg buffer not readable -> E_MACV"
HRP_snd_mbf_H_f:
  note: msgが指すメモリ領域への読出しアクセスが許可されていない場合，E_MACVが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: snd_mbf(MBF1, (void*)TTSP_MACV_ADDRESS, MBF_MSGSZ_A)
    ercd   : E_MACV

  post_condition:
