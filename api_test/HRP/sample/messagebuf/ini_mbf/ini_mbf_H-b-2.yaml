version: "ini_mbf_H-b-2: mbfid above maximum -> E_ID"
HRP_ini_mbf_H_b_2:
  note: mbfidが許容される最大値+1(TNUM_MBFID+1)の時にE_IDが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: ini_mbf(TNUM_MBFID+1)
    ercd   : E_ID

  post_condition:
