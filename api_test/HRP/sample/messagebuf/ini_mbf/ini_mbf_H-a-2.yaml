version: "ini_mbf_H-a-2: CPU locked -> E_CTX"
HRP_ini_mbf_H_a_2:
  note: CPUロック状態からの呼出しでE_CTXが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ini_mbf(MBF1)
    ercd   : E_CTX

  post_condition:
