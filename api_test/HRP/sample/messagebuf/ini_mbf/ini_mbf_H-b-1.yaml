version: "ini_mbf_H-b-1: mbfid below minimum -> E_ID"
HRP_ini_mbf_H_b_1:
  note: mbfidが許容される最小値-1(=0)の時にE_IDが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: ini_mbf(0)
    ercd   : E_ID

  post_condition:
