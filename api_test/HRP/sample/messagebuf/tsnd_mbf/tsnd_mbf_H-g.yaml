version: "tsnd_mbf_H-g: task termination requested -> E_RASTER"
HRP_tsnd_mbf_H_g:
  note: 自タスクのタスク終了要求フラグがセットされている時にE_RASTERが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: tsnd_mbf(MBF1, (void*)&message1, MBF_MSGSZ_A, ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition:
