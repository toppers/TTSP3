version: "tsnd_mbf_H-b-2: mbfid above maximum -> E_ID"
HRP_tsnd_mbf_H_b_2:
  note: mbfidが許容される最大値+1(TNUM_MBFID+1)の時にE_IDが返ること．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : ANY_MBF_SIZE
      fmbfsz: ANY_MBF_SIZE

  do:
    id     : TASK1
    syscall: tsnd_mbf(TNUM_MBFID+1, (void*)&message1, MBF_MSGSZ_A, ANY_ELAPSED_TIME)
    ercd   : E_ID

  post_condition:
