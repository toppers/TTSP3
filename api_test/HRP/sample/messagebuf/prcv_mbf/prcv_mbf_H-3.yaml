version: "$Id: prcv_mbf_H-3.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_prcv_mbf_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1

    TASK2:
      type   : TASK
      tskstat: running
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : 0
      stsklist:
        - TASK1:
            msg  : MBF_MSG_A
            msgsz: MBF_MSGSZ_A

  do:
    id     : TASK2
    syscall: prcv_mbf(MBF1, (void*)&message1)
    eruint : MBF_MSGSZ_A

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        message1:
          value: MBF_MSG_A

    MBF1:
      stsklist:
