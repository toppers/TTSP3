version: "$Id: ref_sem_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_semaphore_ref_sem_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, (T_RSEM*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
