version: "$Id: ref_sem_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_semaphore_ref_sem_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rsem:
          type  : T_RSEM
          wtskid: ANY_OBJECT_ID
          semcnt: ANY_INI_SEMCNT
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      domain: DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_sem(SEM1,&rsem)
    ercd   : E_OACV

  post_condition:
