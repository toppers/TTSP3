ASP_semaphore_twai_sem_h_H1:
  note: 【NGKI1507】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      semcnt: 0
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    SEM1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_SIG_SEM(SEM1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    SEM1:
      wtsklist:

