ASP_semaphore_twai_sem_k_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      semcnt: 0
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : SEM1

      SEM1:
        wtsklist:
          - TASK1:

    FOREVER_TIME:

