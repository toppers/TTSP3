version: "$Id: twai_sem_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_semaphore_twai_sem_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      domain: KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)
    ercd   : E_OACV

  post_condition:
