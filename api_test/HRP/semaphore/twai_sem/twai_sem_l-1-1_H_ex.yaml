ASP_semaphore_twai_sem_l_1_1_H1:
  note: 【NGKI1525】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      sematr: TA_NULL
      semcnt: 0
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    SEM1:
      wtsklist:
        - TASK1:

