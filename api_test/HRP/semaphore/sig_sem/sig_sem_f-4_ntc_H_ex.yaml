version: "$Id: sig_sem_f-4_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_semaphore_sig_sem_f_4_ai_H2:
  note: 【NGKI1505】【NGKI1506】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SEM1
      domain : KERNEL

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      domain : KERNEL

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

    SEM1:
      wtsklist:
        - TASK3:

