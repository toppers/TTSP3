version: "$Id: sig_sem_d_ntc_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_semaphore_sig_sem_d_ai_H2:
  note: 【NGKI1508】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL

    SEM1:
      type  : SEMAPHORE
      maxsem: ANY_MAX_SEMCNT
      semcnt: ANY_NOW_SEMCNT
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT+1

