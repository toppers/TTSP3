ASP_semaphore_sig_sem_f_1_1_at_H1:
  note: 【NGKI1505】【NGKI1506】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SIGSEM
      nfy_info1: SEM1
      almstat  : TALM_STP
      domain   : DOM1

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        tskstat: ready

      TASK2:
        tskstat: running

      SEM1:
        wtsklist:
          - TASK3:

