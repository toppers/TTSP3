version: "$Id: sig_sem_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_semaphore_sig_sem_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      domain: DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sig_sem(SEM1)
    ercd   : E_OACV

  post_condition:
