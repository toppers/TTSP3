version: "$Id: sig_sem_d_ten_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_semaphore_sig_sem_d_at_H1:
  note: 【NGKI1508】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SIGSEM
      nfy_info1: SEM1
      almstat  : TALM_STP
      domain   : DOM1

    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    SEM1:
      type  : SEMAPHORE
      maxsem: ANY_MAX_SEMCNT
      semcnt: ANY_NOW_SEMCNT
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      SEM1:
        semcnt: ANY_NOW_SEMCNT+1

