ASP_semaphore_sig_sem_f_1_2_H1:
  note: 【NGKI1505】【NGKI1506】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    SEM1:
      wtsklist:
        - TASK3:

