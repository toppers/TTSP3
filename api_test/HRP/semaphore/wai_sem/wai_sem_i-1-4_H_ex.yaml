ASP_semaphore_wai_sem_i_1_4_H1:
  note: 【NGKI1525】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_NULL
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: wai_sem(SEM1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK1:

