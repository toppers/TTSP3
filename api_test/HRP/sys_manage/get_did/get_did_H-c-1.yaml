version: "$Id: get_did_H-c-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_sys_manage_get_did_H_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : KERNEL
      var    :
        domid:
          type: ID

  do:
    id     : TASK1
    syscall: get_did(&domid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        domid:
          value: TDOM_KERNEL
