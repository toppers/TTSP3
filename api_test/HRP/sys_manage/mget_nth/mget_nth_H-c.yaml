version: "TTSP3 HRP mget_nth H-c (added 2026-06)"
#
#  (H-c) tskpri=TPRI_SELF を指定する経路．【NGKI3660】
#        tskpri==TPRI_SELF 真分岐（pri = p_runtsk->bpriority）．
#        自タスクのベース優先度(TSK_PRI_MID)の ready タスク先頭IDを返す．
#
HRP_sys_manage_mget_nth_H_c:
  note: 【NGKI3660】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TPRI_SELF, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
