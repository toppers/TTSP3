version: "TTSP3 HRP mget_nth H-a-2 (added 2026-06)"
#
#  (H-a-2) schedno=TDOM_SELF，対象優先度に ready タスク2個，nth=1 で
#          2番目のタスクIDが返ること．nth デクリメントの周回を通る．
#          【NGKI3659】
#
HRP_sys_manage_mget_nth_H_a_2:
  note: 【NGKI3659】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM_ACP4

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TSK_PRI_MID, 1, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK3
