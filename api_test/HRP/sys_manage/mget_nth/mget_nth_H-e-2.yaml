version: "TTSP3 HRP mget_nth H-e-2 (added 2026-06)"
#
#  (H-e-2) tskpri=最大値+1 (TMAX_TPRI+1) のとき，E_PARエラーが返ること．
#          【NGKI3655】 CHECK_PAR(VALID_TPRI(tskpri)) 偽分岐（上側）．
#
HRP_sys_manage_mget_nth_H_e_2:
  note: 【NGKI3655】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TMAX_TPRI+1, 0, &p_tskid)
    ercd   : E_PAR

  post_condition:
