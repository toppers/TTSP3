version: "TTSP3 HRP mget_nth H-macv (added 2026-06)"
#
#  (H-macv) p_tskid に書込み不可な番地を指定すると E_MACV．【NGKI3656】
#  CHECK_MACV_WRITE(p_tskid) の VIOLATE_MACV 真分岐．
#
HRP_sys_manage_mget_nth_H_macv:
  note: 【NGKI3656】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TSK_PRI_MID, 0, (ID*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
    TASK1:
      tskstat: running
