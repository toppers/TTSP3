version: "TTSP3 HRP mget_nth H-a-3 (added 2026-06)"
#
#  (H-a-3) schedno=TDOM_SELF，対象優先度の ready タスク数より大きい nth を
#          指定すると，TSK_NONE が返ること．【NGKI3659】
#          ループ走査後に tskid==TSK_NONE のまま抜ける分岐．
#
HRP_sys_manage_mget_nth_H_a_3:
  note: 【NGKI3659】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TSK_PRI_MID, 2, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TSK_NONE
