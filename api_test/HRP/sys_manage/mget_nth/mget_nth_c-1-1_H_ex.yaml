version: "$Id: mget_nth_c-1-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_sys_manage_mget_nth_c_1_1_H3:
  note: 【NGKI3647】【NGKI3650】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1

ASP_sys_manage_mget_nth_c_1_1_H5:
  note: 【NGKI3647】【NGKI3650】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_GET_NTH(TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
