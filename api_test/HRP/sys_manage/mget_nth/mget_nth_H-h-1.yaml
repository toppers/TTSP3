version: "TTSP3 HRP mget_nth H-h-1 (added 2026-06)"
#
#  (H-h-1) 非タスクコンテキストから呼び出して，E_CTXエラーが返ること．
#          【NGKI3652】 CHECK_TSKCTX_UNL() の sense_context() 真分岐．
#
HRP_sys_manage_mget_nth_H_h_1:
  note: 【NGKI3652】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_tskid:
          type: ID

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : KERNEL

  do:
    id     : ALM1
    syscall: mget_nth(TDOM_KERNEL, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_CTX

  post_condition:
