version: "TTSP3 HRP mget_nth H-a-1 (added 2026-06)"
#
#  mget_nth（対象指定での指定した優先順位のタスクIDの参照）HRP用テスト
#  HRPでは schedno は保護ドメインID（DOMID）．
#
#  (H-a-1) schedno=TDOM_SELF，対象優先度に ready タスクが1個，nth=0 で
#          その先頭タスクIDが返ること．【NGKI3659】 nth==0 命中分岐．
#
HRP_sys_manage_mget_nth_H_a_1:
  note: 【NGKI3659】【NGKI3884】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK2
