version: "TTSP3 HRP mget_nth H-e-1 (added 2026-06)"
#
#  (H-e) tskpri が有効範囲外の場合，E_PARエラーが返ること．【NGKI3655】
#        CHECK_PAR(VALID_TPRI(tskpri)) 偽分岐．
#        (H-e-1) tskpri=最小値-1 (=-1)．
#
HRP_sys_manage_mget_nth_H_e_1:
  note: 【NGKI3655】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_SELF, -1, 0, &p_tskid)
    ercd   : E_PAR

  post_condition:
