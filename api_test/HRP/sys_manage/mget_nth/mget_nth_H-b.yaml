version: "TTSP3 HRP mget_nth H-b (added 2026-06)"
#
#  (H-b) schedno=TDOM_KERNEL（カーネルドメイン）を指定する経路．
#        【NGKI3659】 schedno==TDOM_KERNEL 分岐（p_dominib=&dominib_kernel）．
#        カーネルドメインの ready タスク1個，nth=0 でそのIDが返ること．
#
HRP_sys_manage_mget_nth_H_b:
  note: 【NGKI3659】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : KERNEL

  do:
    id     : TASK1
    syscall: mget_nth(TDOM_KERNEL, TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK2
