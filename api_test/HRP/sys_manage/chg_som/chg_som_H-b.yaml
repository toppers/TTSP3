version: "PoC段階④(a): chg_som E_ID（無効 somid）"
HRP_sys_manage_chg_som_H_b:
  note: "【NGKI5033】DEF_SCY/CRE_SOM(1個=SOM1)を定義した状態で，有効範囲外の somid(=2, tmax_somid=1 超過)を指定して chg_som を呼ぶ＝CHECK_ID(VALID_SOMID) 不成立で E_ID．呼出しタスクはカーネルドメイン．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 20 * 50000U

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_NULL

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 5 * 50000U

  do:
    id     : TASK1
    syscall: chg_som(2)
    ercd   : E_ID

  post_condition:
    TASK1:
      tskstat: running
