version: "PoC段階④(a): chg_som E_CTX（非タスクコンテキスト）"
HRP_sys_manage_chg_som_H_e:
  note: "【NGKI5031】【NGKI5032】アラーム通知ハンドラ（非タスクコンテキスト）から chg_som を呼ぶ＝CHECK_TSKCTX_UNL 不成立で E_CTX．E_CTX は最初のチェックのため DEF_SCY 不要．"

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

  do:
    id     : ALM1
    syscall: chg_som(TSOM_STP)
    ercd   : E_CTX

  post_condition:
