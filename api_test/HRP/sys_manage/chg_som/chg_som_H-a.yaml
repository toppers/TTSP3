version: "PoC: SOM/時間区画スケジューリングのテスト生成(HRP3 3.4 chg_som)"
HRP_sys_manage_chg_som_H_a:
  note: "【NGKI5030】【NGKI5035】【NGKI5037】DEF_SCY/CRE_SOM/ATT_TWD を静的に定義し，システム周期停止モード→SOM1→停止モードへ変更する(E_OK)．状態を停止モードへ戻すため同一プログラム内の他テストへ影響しない．呼出しタスクはカーネルドメインで実行し sysstat1 の既定値で許可される．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      # domain 省略 = カーネルドメイン(DOM_TASK=KERNEL)．sysstat1 既定で chg_som を許可

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 20 * 50000U

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_NULL

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 5 * 50000U

  # 停止モード→SOM1（NGKI5037 の周期開始経路）
  do_0:
    id     : TASK1
    syscall: chg_som(SOM1)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

  # SOM1→停止モード（状態を初期へ戻す）
  do_1:
    id     : TASK1
    syscall: chg_som(TSOM_STP)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running
