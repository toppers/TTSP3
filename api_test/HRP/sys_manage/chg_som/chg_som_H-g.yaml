version: "PoC段階④(a): chg_som ディスパッチ禁止中の周期開始（dspflg=false 経路）"
HRP_sys_manage_chg_som_H_g:
  note: "【NGKI5037】ディスパッチ禁止状態(dis_dsp)で停止モードから chg_som(SOM1) を呼ぶ＝周期開始ブロックの dspflg 偽側(scyc_start を即時実行せず pending_scycswitch=true)に到達(E_OK)．ena_dsp で保留中の切替が起こる．呼出しはカーネルドメイン．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 20 * 50000U

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_NULL

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 5 * 50000U

  # ディスパッチ禁止
  do_0:
    id     : TASK1
    syscall: dis_dsp()
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

  # 禁止中に周期開始（dspflg 偽側＝pending_scycswitch）
  do_1:
    id     : TASK1
    syscall: chg_som(SOM1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

  # 許可（保留中の周期切替が起こる）
  do_2:
    id     : TASK1
    syscall: ena_dsp()
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: running

  # 停止モードへ戻す
  do_3:
    id     : TASK1
    syscall: chg_som(TSOM_STP)
    ercd   : E_OK

  post_condition_3:
    TASK1:
      tskstat: running
