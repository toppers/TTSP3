version: "PoC段階④(a): chg_som 停止モードで TSOM_STP 指定（p_cursom==NULL かつ p_sominib==NULL）"
HRP_sys_manage_chg_som_H_c:
  note: "【NGKI5038】システム周期停止モードで起動した状態(p_cursom==NULL)で chg_som(TSOM_STP) を呼ぶ＝p_sominib も NULL のため周期開始ブロックに入らず(条件 p_cursom==NULL && p_sominib!=NULL の第2項が偽) E_OK．H-a が網羅しない短絡分岐を埋める．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 20 * 50000U

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_NULL

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 5 * 50000U

  do:
    id     : TASK1
    syscall: chg_som(TSOM_STP)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running
