version: "$Id: loc_cpu_a_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_sys_manage_loc_cpu_a_H3:
  note: 【NGKI2730】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM_SYS_ACP2

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: loc_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      loc_cpu: true

ASP_sys_manage_loc_cpu_a_H5:
  note: 【NGKI2730】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_LOC_CPU()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      loc_cpu: true
