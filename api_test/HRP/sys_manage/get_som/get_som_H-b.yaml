version: "PoC段階④(a): get_som 稼働中（p_cursom!=NULL）"
HRP_sys_manage_get_som_H_b:
  note: "【NGKI5066】chg_som(SOM1) でシステム周期を開始(p_cursom=SOM1)した直後に get_som を呼ぶ＝(p_cursom==NULL)? TSOM_STP : SOMID(p_cursom) の SOMID 側で SOM1 を返す(E_OK)．H-a が網羅しない稼働中分岐を埋める．呼出しタスクはカーネルドメイン．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        p_somid:
          type: ID

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 20 * 50000U

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_NULL

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 5 * 50000U

  # 停止モード→SOM1（周期開始）
  do_0:
    id     : TASK1
    syscall: chg_som(SOM1)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

  # 稼働中に get_som → SOM1
  do_1:
    id     : TASK1
    syscall: get_som(&p_somid)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running
      var:
        p_somid:
          value: SOM1
