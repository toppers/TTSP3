version: "$Id: ena_dsp_b-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_sys_manage_ena_dsp_b_1_H3:
  note: 【NGKI2750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM_SYS_ACP1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM_SYS_ACP1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true
      access1: TACP(DOM_SYS_ACP1)
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ena_dsp()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      dis_dsp: false

ASP_sys_manage_ena_dsp_b_1_H5:
  note: 【NGKI2750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_ENA_DSP()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      dis_dsp: false
