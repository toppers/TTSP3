version: "PoC段階④(b): simt で周期/ウィンドウ切替（twd_switch/scyc_switch）"
HRP_sys_manage_twd_som_W_a:
  note: "【NGKI5037】TA_INISOM で SOM1 を起動時から周期稼働させ，ttsp_simt_advance でシミュレーション時刻を窓長(500)・周期(1000)を跨ぐ量だけ進める＝_kernel_twd_switch / _kernel_scyc_switch / _kernel_twd_start が発火．simt ターゲット専用（ttsp_simt_advance が必要）．呼出しタスクはカーネルドメイン．"

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        p_somid:
          type: ID
      # domain 省略 = カーネルドメイン（全ウィンドウで実行可）

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

    SCY1:
      type  : SYSTEM_CYCLE
      scytim: 1000

    SOM1:
      type  : SYSTEM_OPERATION_MODE
      somatr: TA_INISOM

    TWD1:
      type  : TIME_WINDOW
      domid : DOM1
      somid : SOM1
      twdord: 1
      twdlen: 500

  # 窓長(500)の直前まで進める（DOM1窓内）
  do_0:
    id     : TASK1
    syscall: ttsp_simt_advance(499)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

  # 窓境界(500)を跨ぐ＝twd_switch（DOM1窓→アイドル窓）
  do_1:
    id     : TASK1
    syscall: ttsp_simt_advance(2)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

  # 周期境界(1000)を跨ぐ＝scyc_switch（周期再開）
  do_2:
    id     : TASK1
    syscall: ttsp_simt_advance(500)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: running

  # 稼働継続を確認
  do_3:
    id     : TASK1
    syscall: get_som(&p_somid)
    ercd   : E_OK

  post_condition_3:
    TASK1:
      tskstat: running
      var:
        p_somid:
          value: SOM1
