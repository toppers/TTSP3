version: "TTSP3 HRP mrot_rdq H-c-1 (added 2026-06)"
#
#  (H-c) tskpriが不正（有効範囲外）の場合，E_PARエラーが返ること．
#        【NGKI2697】 CHECK_PAR(VALID_TPRI(tskpri)) 偽分岐．
#        (H-c-1) tskpri が最小値-1 (=-1) のとき．
#
HRP_sys_manage_mrot_rdq_H_c_1:
  note: 【NGKI2697】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, -1)
    ercd   : E_PAR

  post_condition:
