version: "TTSP3 HRP mrot_rdq H-d-2 (added 2026-06)"
#
#  (H-d-2) schedno=TDOM_KERNEL（カーネルドメイン）を指定する経路．
#          【NGKI2699】 mrot_rdq の schedno==TDOM_KERNEL 分岐
#          （p_dominib = &dominib_kernel）を通る．
#          カーネルドメイン所属の同一優先度 ready タスク2個を回転する．
#
HRP_sys_manage_mrot_rdq_H_d_2:
  note: 【NGKI2699】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : KERNEL

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      domain : KERNEL

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_KERNEL, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 1
