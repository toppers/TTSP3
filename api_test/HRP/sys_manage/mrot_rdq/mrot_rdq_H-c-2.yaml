version: "TTSP3 HRP mrot_rdq H-c-2 (added 2026-06)"
#
#  (H-c-2) tskpri が最大値+1 (TMAX_TPRI+1) のとき，E_PARエラーが返る．
#          【NGKI2697】 CHECK_PAR(VALID_TPRI(tskpri)) 偽分岐（上側）．
#
HRP_sys_manage_mrot_rdq_H_c_2:
  note: 【NGKI2697】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TMAX_TPRI+1)
    ercd   : E_PAR

  post_condition:
