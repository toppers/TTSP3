version: "TTSP3 HRP mrot_rdq H-d-1 (added 2026-06)"
#
#  (H-d) 正常系：schednoで指定したドメインの対象優先度の実行できる状態の
#        タスクのうち優先順位が最も高いものを最も低くする．【NGKI2699】
#
#        (H-d-1) schedno=TDOM_SELF（自ドメイン）．同一優先度 TSK_PRI_MID の
#                ready タスクが2個ある状態で回転し，porder が入れ替わること．
#                CHECK_ACPTN(acptn2) 真分岐（許可）を含む正常経路．
#
HRP_sys_manage_mrot_rdq_H_d_1:
  note: 【NGKI2699】【NGKI3778】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      domain : DOM_ACP2

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM_ACP2

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      domain : DOM_ACP2

    DOM_ACP2:
      type   : DOMAIN
      access1: TACP(DOM_ACP2)
      access2: TACP(DOM_ACP2)
      access3: TACP(DOM_ACP2)
      access4: TACP(DOM_ACP2)

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 1
