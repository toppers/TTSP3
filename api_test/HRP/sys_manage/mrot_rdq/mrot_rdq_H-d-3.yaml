version: "TTSP3 HRP mrot_rdq H-d-3 (added 2026-06)"
#
#  (H-d-3) タスクコンテキストから tskpri=TPRI_SELF を指定する経路．
#          【NGKI2701】 mrot_rdq の (tskpri==TPRI_SELF && !sense_context())
#          真分岐（pri = p_runtsk->bpriority）を通る．
#          自タスクのベース優先度(TSK_PRI_MID)の ready キューを回転する．
#
HRP_sys_manage_mrot_rdq_H_d_3:
  note: 【NGKI2701】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      domain : DOM_ACP2

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2
      domain : DOM_ACP2

    DOM_ACP2:
      type   : DOMAIN
      access1: TACP(DOM_ACP2)
      access2: TACP(DOM_ACP2)
      access3: TACP(DOM_ACP2)
      access4: TACP(DOM_ACP2)

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TPRI_SELF)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: ready
      porder : 2

    TASK2:
      tskstat: running
      porder : 1
