version: "$Id: mrot_rdq_H-a.yaml 59 2019-12-05 03:44:37Z fujisft-shigihara $"
HRP_sys_manage_mrot_rdq_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      access1: TACP(DOM_KERNEL)
      access2: TACP(DOM_KERNEL)
      access3: TACP(DOM_KERNEL)
      access4: TACP(DOM_KERNEL)
      domain : DOM_KERNEL

    DOM_KERNEL:
      type   : DOMAIN
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TSK_PRI_MID)
    ercd   : E_OACV

  post_condition:
    TASK1:
      tskstat: running
