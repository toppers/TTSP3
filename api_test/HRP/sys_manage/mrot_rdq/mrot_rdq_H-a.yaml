version: "TTSP3 HRP mrot_rdq H-a (added 2026-06)"
#
#  mrot_rdq（対象指定でのタスクの優先順位の回転）HRP用テスト
#
#  HRPでは第1引数 schedno は保護ドメインID（DOMID）として解釈される
#  （カーネル sys_manage.c mrot_rdq: TDOM_KERNEL/TDOM_SELF/VALID_DOMID）．
#
#  (H-a) schednoで指定した保護ドメインに対する通常操作2が許可されて
#        いない場合，E_OACVエラーが返ること．【NGKI3778】
#        CHECK_ACPTN(p_dominib->acvct.acptn2) の VIOLATE_ACPTN 真分岐．
#
HRP_sys_manage_mrot_rdq_H_a:
  note: 【NGKI3778】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      access1: TACP(DOM_KERNEL)
      access2: TACP(DOM_KERNEL)
      access3: TACP(DOM_KERNEL)
      access4: TACP(DOM_KERNEL)
      domain : DOM_KERNEL

    DOM_KERNEL:
      type   : DOMAIN
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TSK_PRI_MID)
    ercd   : E_OACV

  post_condition:
