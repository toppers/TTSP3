version: "TTSP3 HRP mrot_rdq H-par-2 (added 2026-06)"
#
#  (H-par-2) tskpri が範囲外（TMAX_TPRI+1）なら E_PAR．【NGKI2697】
#  CHECK_PAR(VALID_TPRI) の偽分岐．CHECK_ACPTN(acptn2) の前に発火．
#
HRP_sys_manage_mrot_rdq_H_par_2:
  note: 【NGKI2697】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : KERNEL

  do:
    id     : TASK1
    syscall: mrot_rdq(TDOM_SELF, TMAX_TPRI+1)
    ercd   : E_PAR

  post_condition:
    TASK1:
      tskstat: running
