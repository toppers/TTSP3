version: "TTSP3 HRP get_lod H-a (added 2026-06)"
#
#  (H-a) p_load が指すメモリ領域への書込みアクセスが許可されていない場合，
#        E_MACVエラーが返ること．【NGKI3627】
#        CHECK_MACV_WRITE(p_load, uint_t) 偽分岐（ユーザドメインから整合
#        アドレスを渡し probe_mem_write 偽の経路を通る）．
#
HRP_sys_manage_get_lod_H_a:
  note: 【NGKI3627】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_lod(TSK_PRI_MID, (uint_t*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
