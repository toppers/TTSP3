version: "$Id: get_lod_d-3_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_sys_manage_get_lod_d_3_H3:
  note: 【NGKI3629】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM_ACP4

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: get_lod(TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 2

ASP_sys_manage_get_lod_d_3_H5:
  note: 【NGKI3629】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_GET_LOD(TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 2
