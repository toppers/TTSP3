version: "TTSP3 HRP get_tid H-b (added 2026-06)"
#
#  (H-b) p_tskid が型のアライメント境界に整合しない場合，E_MACVが返ること．
#        【NGKI2708】 CHECK_MACV_WRITE→KERNEL_PROBE_MEM_WRITE の
#        ALIGN_TYPE(p_var, type) 偽分岐．
#        ユーザドメイン（DOM1）から非整合アドレス TTSP_MACV_ADDRESS+1 を渡す．
#
HRP_sys_manage_get_tid_H_b:
  note: 【NGKI2708】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tid((ID*)(TTSP_MACV_ADDRESS+1))
    ercd   : E_MACV

  post_condition:
