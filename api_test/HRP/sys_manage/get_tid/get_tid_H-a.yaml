version: "$Id: get_tid_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_sys_manage_get_tid_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tid((ID*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
