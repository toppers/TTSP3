version: "TTSP3 HRP mget_lod H-h-1 (added 2026-06)"
#
#  (H-h-1) 非タスクコンテキストから呼び出して，E_CTXエラーが返ること．
#          【NGKI3633】 CHECK_TSKCTX_UNL() の sense_context() 真分岐．
#          カーネルドメインのアラームハンドラ（TNFY_HANDLER）から呼ぶ．
#
HRP_sys_manage_mget_lod_H_h_1:
  note: 【NGKI3633】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_load:
          type: uint_t

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : KERNEL

  do:
    id     : ALM1
    syscall: mget_lod(TDOM_KERNEL, TSK_PRI_MID, &p_load)
    ercd   : E_CTX

  post_condition:
