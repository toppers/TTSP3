version: "TTSP3 HRP mget_lod H-b (added 2026-06)"
#
#  (H-b) schedno=TDOM_KERNEL（カーネルドメイン）を指定する経路．
#        【NGKI3639】 mget_lod の schedno==TDOM_KERNEL 分岐
#        （p_dominib = &dominib_kernel）を通る．
#        カーネルドメインの ready タスク1個＝load=1．
#
HRP_sys_manage_mget_lod_H_b:
  note: 【NGKI3639】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : KERNEL

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_KERNEL, TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 1
