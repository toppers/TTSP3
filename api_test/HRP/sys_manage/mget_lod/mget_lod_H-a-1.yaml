version: "TTSP3 HRP mget_lod H-a-1 (added 2026-06)"
#
#  mget_lod（対象指定での実行できるタスクの数の参照）HRP用テスト
#  HRPでは schedno は保護ドメインID（DOMID）．
#
#  (H-a) 正常系：schedno=TDOM_SELF，tskpri 指定で実行できるタスク数を返す．
#        【NGKI3639】 ready タスク0個＝load=0．
#
HRP_sys_manage_mget_lod_H_a_1:
  note: 【NGKI3639】【NGKI3881】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_SELF, TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 0
