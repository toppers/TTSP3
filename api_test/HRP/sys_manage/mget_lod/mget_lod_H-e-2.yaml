version: "TTSP3 HRP mget_lod H-e-2 (added 2026-06)"
#
#  (H-e-2) tskpri=最大値+1 (TMAX_TPRI+1) のとき，E_PARエラーが返ること．
#          【NGKI3636】 CHECK_PAR(VALID_TPRI(tskpri)) 偽分岐（上側）．
#
HRP_sys_manage_mget_lod_H_e_2:
  note: 【NGKI3636】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        p_load:
          type: uint_t
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_SELF, TMAX_TPRI+1, &p_load)
    ercd   : E_PAR

  post_condition:
