version: "TTSP3 HRP mget_lod H-a-2 (added 2026-06)"
#
#  (H-a-2) schedno=TDOM_SELF，対象優先度に ready タスクが2個ある場合，
#          load=2 が返ること．load カウントループの複数周回を通る．
#          【NGKI3639】
#
HRP_sys_manage_mget_lod_H_a_2:
  note: 【NGKI3639】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM_ACP4

    TASK3:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_SELF, TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 2
