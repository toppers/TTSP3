version: "TTSP3 HRP mget_lod H-g (added 2026-06)"
#
#  (H-g) schednoで指定した保護ドメインに対する参照操作（通常操作4）が
#        許可されていない場合，E_OACVエラーが返ること．【NGKI3881】
#        CHECK_ACPTN(p_dominib->acvct.acptn4) の VIOLATE_ACPTN 真分岐．
#        schedno=TDOM_SELF（自ドメイン）だが，その acptn4 が自ドメインを
#        含まない（TACP(DOM_KERNEL)）ため違反となる．
#        ※ rot_rdq_H-a と同型の acvct 構成．
#
HRP_sys_manage_mget_lod_H_g:
  note: 【NGKI3881】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      access1: TACP(DOM_KERNEL)
      access2: TACP(DOM_KERNEL)
      access3: TACP(DOM_KERNEL)
      access4: TACP(DOM_KERNEL)
      var    :
        p_load:
          type: uint_t
      domain : DOM_KERNEL

    DOM_KERNEL:
      type   : DOMAIN
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_SELF, TSK_PRI_MID, &p_load)
    ercd   : E_OACV

  post_condition:
