version: "TTSP3 HRP mget_lod H-f (added 2026-06)"
#
#  (H-f) p_load が指すメモリ領域への書込みアクセスが許可されていない場合，
#        E_MACVエラーが返ること．【NGKI3637】
#        CHECK_MACV_WRITE(p_load, uint_t) 偽分岐．
#
HRP_sys_manage_mget_lod_H_f:
  note: 【NGKI3637】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mget_lod(TDOM_SELF, TSK_PRI_MID, (uint_t*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
