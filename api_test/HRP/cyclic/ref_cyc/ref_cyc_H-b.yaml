version: "$Id: ref_cyc_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_cyclic_ref_cyc_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_B
      cyctim   : RELATIVE_TIME_C
      access1  : TACP(DOM1)
      access2  : TACP(DOM1)
      access3  : TACP(DOM1)
      access4  : TACP(DOM1)

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, (T_RCYC*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
