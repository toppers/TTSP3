version: "$Id: ref_cyc_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_cyclic_ref_cyc_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rcyc:
          type   : T_RCYC
          cycstat: ANY_CYCLIC_STAT
          lefttim: RELATIVE_TIME_A
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_B
      cyctim   : RELATIVE_TIME_C

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_OACV

  post_condition:
