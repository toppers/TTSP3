version: "$Id: ref_cyc_c-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_c_1_H3:
  note: 【NGKI2470】【NGKI2471】【NGKI2473】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rcyc:
          type: T_RCYC
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      domain   : KERNEL
      access1  : TACP_KERNEL
      access2  : TACP_KERNEL
      access3  : TACP_KERNEL
      access4  : TACP(DOM1)

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rcyc:
          cycstat: TCYC_STP

