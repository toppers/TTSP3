ASP_cyclic_stp_cyc_d_H1:
  note: 【NGKI2461】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      cycatr   : TA_NULL
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: stp_cyc(CYC1)
    ercd   : E_OK

  post_condition:
    CYC1:
      cycstat: TCYC_STP

