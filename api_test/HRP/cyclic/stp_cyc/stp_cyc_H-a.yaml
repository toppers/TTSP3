version: "$Id: stp_cyc_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_cyclic_stp_cyc_H_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STA
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: stp_cyc(CYC1)
    ercd   : E_OACV

  post_condition:
