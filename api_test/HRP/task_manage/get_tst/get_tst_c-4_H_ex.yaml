version: "$Id: get_tst_c-4_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_manage_get_tst_c_4_H1:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskstat:
          type: STAT
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: suspended
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tst(TASK2, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_SUS

