version: "$Id: can_act_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_task_manage_can_act_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : E_OACV

  post_condition:
