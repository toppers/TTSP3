version: "$Id: can_act_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_task_manage_can_act_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : E_OACV

  post_condition:
