version: "$Id: get_inf_b_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_manage_get_inf_b_H3:
  note: 【NGKI1216】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      exinf  : EXINF_A
      var    :
        exinf:
          type: intptr_t
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        exinf:
          value: EXINF_A
