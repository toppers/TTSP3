ASP_task_manage_act_tsk_d_2_H1:
  note: 【NGKI1118】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2

    TASK3:
      porder: 1

