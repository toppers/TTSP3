ASP_task_manage_act_tsk_d_1_1_H1:
  note: 【NGKI1118】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH

