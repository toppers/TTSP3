ASP_task_manage_act_tsk_d_1_3_at_H1:
  note: 【NGKI1118】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK2
      almstat  : TALM_STP
      domain   : DOM1

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      domain : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: ready
        tskpri : TSK_PRI_HIGH

