  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    DOM1:
