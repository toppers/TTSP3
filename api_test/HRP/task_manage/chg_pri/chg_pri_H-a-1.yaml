version: "$Id: chg_pri_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_task_manage_chg_pri_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_MID)
    ercd   : E_OACV

  post_condition:
