version: "$Id: chg_pri_h-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_manage_chg_pri_h_2_H1:
  note: 【NGKI1192】【NGKI1193】【NGKI1198】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
