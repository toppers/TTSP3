version: "$Id: chg_pri_i-1-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_manage_chg_pri_i_1_2_H1:
  note: 【NGKI1197】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_MID
      tskpri : TSK_PRI_HIGH
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      ceilpri: TSK_PRI_HIGH
      mtxatr : TA_CEILING
      htskid : TASK1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
