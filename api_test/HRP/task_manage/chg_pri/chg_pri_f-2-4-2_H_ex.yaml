ASP_task_manage_chg_pri_f_2_4_2_H1:
  note: 【NGKI1195】【NGKI1196】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_TPRI
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK4:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_MID

    SEM1:
      wtsklist:
        - TASK3:
        - TASK2:
        - TASK4:

