ASP_task_manage_chg_pri_g_H1:
  note: 【NGKI1199】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      itskpri: TSK_PRI_MID
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TPRI_INI)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_MID

