version: "$Id: get_pri_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_task_manage_get_pri_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskpri:
          type : PRI
          value: TSK_PRI_MID
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: dormant
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_pri(TASK2, &tskpri)
    ercd   : E_OACV

  post_condition:
