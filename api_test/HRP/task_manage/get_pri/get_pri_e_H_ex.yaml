version: "$Id: get_pri_e_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_task_manage_get_pri_e_H1:
  note: 【NGKI1211】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        tskpri:
          type: PRI
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_pri(TSK_SELF, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskpri:
          value: TSK_PRI_MID
