version: "$Id: pget_mpf_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mempfix_pget_mpf_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT
      domain: DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: pget_mpf(MPF1, (void**)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
