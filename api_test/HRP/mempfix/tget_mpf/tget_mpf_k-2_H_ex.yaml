ASP_mempfix_tget_mpf_k_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*
      domain : DOM1

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : MPF1

      MPF1:
        wtsklist:
          - TASK1:

    FOREVER_TIME:

