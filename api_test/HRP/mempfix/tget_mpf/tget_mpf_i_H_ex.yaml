ASP_mempfix_tget_mpf_i_H1:
  note: 【NGKI2302】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*
      domain : DOM1

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : ANY_NOW_BLKCNT
      wtsklist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt : ANY_NOW_BLKCNT-1
      wtsklist:

