ASP_mempfix_tget_mpf_m_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk1:
          type: void*
        blk2:
          type: void*
      domain : DOM1

    MPF1:
      type   : MEMORYPOOL
      blkcnt : 2
      fblkcnt: 2
      blksz  : ANY_BLKSZ
      domain : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: TTSP_TGET_MPF(MPF1,&blk1,ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 1
      kermpf : blk1

  do_1:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk2,ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      var:
        blk2:
          value: blk1+ANY_BLKSZ

    MPF1:
      fblkcnt: 0

