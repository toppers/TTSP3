version: "$Id: tget_mpf_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mempfix_tget_mpf_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"
      domain : DOM1

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT
      domain: KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,ANY_ELAPSED_TIME)
    ercd   : E_OACV

  post_condition:
