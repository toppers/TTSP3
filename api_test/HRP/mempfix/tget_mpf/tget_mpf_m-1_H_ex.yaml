ASP_mempfix_tget_mpf_m_1_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk1:
          type: void*
      domain : DOM1

    MPF1:
      type   : MEMORYPOOL
      blkcnt : 2
      fblkcnt: 2
      blksz  : ANY_BLKSZ
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk1,ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt: 1
      kermpf : blk1

