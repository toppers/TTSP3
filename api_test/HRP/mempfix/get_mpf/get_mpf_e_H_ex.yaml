      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      domain : DOM1

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: 0
      domain : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    TASK2:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready

    MPF1:
      wtsklist:

