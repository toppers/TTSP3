version: "$Id: ini_mpf_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mempfix_ini_mpf_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT
      domain: DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
