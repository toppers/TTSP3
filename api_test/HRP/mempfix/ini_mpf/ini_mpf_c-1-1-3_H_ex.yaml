ASP_mempfix_ini_mpf_c_1_1_3_H1:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      domain : DOM1

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:

