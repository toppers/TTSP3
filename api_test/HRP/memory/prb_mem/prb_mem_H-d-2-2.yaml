version: "$Id: prb_mem_H-d-2-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_memory_prb_mem_H_d_2_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: dormant
      access1: TACP(DOM2)
      access2: TACP(DOM2)
      access3: TACP(DOM2)
      access4: TACP(DOM2)
      domain : DOM2

    MEMORY_MODULE1:
      type   : MEMORY_MODULE
      file   : ttsp_mem_obj_user2.o
      access1: TACP_SHARED
      access2: TACP_SHARED
      access3: TACP_SHARED
      access4: TACP_SHARED
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prb_mem((const void *)&ttsp_mem_obj_user2, 8, TASK2, TPM_WRITE)
    ercd   : E_OACV

  post_condition:
