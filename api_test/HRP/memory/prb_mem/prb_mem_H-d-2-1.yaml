version: "$Id: prb_mem_H-d-2-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_memory_prb_mem_H_d_2_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: dormant
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL
      domain : KERNEL

    MEMORY_MODULE1:
      type   : MEMORY_MODULE
      file   : ttsp_mem_obj_kernel2.o
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_SHARED
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prb_mem((const void *)&ttsp_mem_obj_kernel2, 8, TASK2, TPM_WRITE)
    ercd   : E_OACV

  post_condition:
