version: "$Id: prb_mem_H-a.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_memory_prb_mem_H_a:
  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        dummy:
          type: uint8_t

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ALM1
    syscall: prb_mem((const void *)&dummy, 8, TASK1, TPM_WRITE)
    ercd   : E_CTX

  post_condition:
