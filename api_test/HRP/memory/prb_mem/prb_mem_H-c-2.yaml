version: "$Id: prb_mem_H-c-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_memory_prb_mem_H_c_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1
      var    :
        dummy:
          type: uint8_t

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prb_mem((const void *)&dummy, 8, TASK1, ~(TPM_WRITE|TPM_READ|TPM_EXEC))
    ercd   : E_PAR

  post_condition:
