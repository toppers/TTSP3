ASP_task_refer_ref_tsk_c_4_4_H1:
  note: 【NGKI1224】【NGKI1225】【NGKI1229】【NGKI1235】【NGKI1227】【NGKI1233】【NGKI1231】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rtsk:
          type: T_RTSK
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      lefttmo: ANY_ELAPSED_TIME
      var    :
        flgptn:
          type: FLGPTN
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A
            var   : flgptn
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_WAI
          tskwait: TTW_FLG
          wobjid : FLG1
          lefttmo: ANY_ELAPSED_TIME
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 0
          wupcnt : 0

