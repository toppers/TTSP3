version: "$Id: ini_mtx_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mutex_ini_mtx_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      domain : KERNEL
      access1: TACP_SHARED
      access2: TACP_SHARED
      access3: TACP_SHARED
      access4: TACP_SHARED
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK2
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OACV

  post_condition:
