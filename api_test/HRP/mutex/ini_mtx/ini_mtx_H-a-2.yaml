version: "$Id: ini_mtx_H-a-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mutex_ini_mtx_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      domain : DOM2
      access1: TACP_SHARED
      access2: TACP_SHARED
      access3: TACP_SHARED
      access4: TACP_SHARED
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK2
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OACV

  post_condition:
