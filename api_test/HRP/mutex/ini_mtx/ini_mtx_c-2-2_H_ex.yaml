version: "$Id: ini_mtx_c-2-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_mutex_ini_mtx_c_2_2_H1:
  note: 【NGKI2104】【NGKI2105】【NGKI2106】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK4:
        - TASK3:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: ready
      porder : 1
      locmtx :

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: ready
      porder : 2

    MTX1:
      mtxstat : TMTX_UNL
      wtsklist:

