HRP_mutex_ploc_mtx_H_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ploc_mtx(MTX1)
    ercd   : E_OACV

  post_condition:
