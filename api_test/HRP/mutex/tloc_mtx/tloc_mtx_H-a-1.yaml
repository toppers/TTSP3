version: "$Id: tloc_mtx_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mutex_tloc_mtx_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, ANY_ELAPSED_TIME)
    ercd   : E_OACV

  post_condition:
