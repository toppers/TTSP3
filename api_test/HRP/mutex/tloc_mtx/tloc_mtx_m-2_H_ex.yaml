version: "$Id: tloc_mtx_m-2_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_m_2_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : MTX1

      TASK2:
        tskstat: running
        locmtx :
          - MTX1

      MTX1:
        htskid  : TASK2
        wtsklist:
          - TASK1:

    FOREVER_TIME:

