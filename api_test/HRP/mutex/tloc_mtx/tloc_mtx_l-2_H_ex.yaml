ASP_mutex_tloc_mtx_l_2_H1:
  note: 【NGKI2078】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, TMO_POL)
    ercd   : E_TMOUT

  post_condition:

