ASP_mutex_tloc_mtx_l_1_H1:
  note: 【NGKI2081】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, TMO_POL)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1

