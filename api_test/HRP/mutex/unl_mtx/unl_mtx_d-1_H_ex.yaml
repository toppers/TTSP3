ASP_mutex_unl_mtx_d_1_H1:
  note: 【NGKI2096】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_MID
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH
      htskid : TASK1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
      locmtx:

    MTX1:
      mtxstat: TMTX_UNL

