ASP_mutex_unl_mtx_f_1_3_H1:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK3:

