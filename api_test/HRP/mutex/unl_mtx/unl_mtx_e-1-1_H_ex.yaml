version: "$Id: unl_mtx_e-1-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_mutex_unl_mtx_e_1_1_H1:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: ready
      locmtx :

    TASK2:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:

