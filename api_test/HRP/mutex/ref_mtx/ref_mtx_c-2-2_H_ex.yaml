ASP_mutex_ref_mtx_c_2_2_H1:
  note: 【NGKI2116】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type: T_RMTX
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK1
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmtx:
          htskid: TASK1
          wtskid: TSK_NONE

