version: "$Id: ref_mtx_H-a-1.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mutex_ref_mtx_H_a_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1
      var    :
        rmtx:
          type  : T_RMTX
          htskid: ANY_OBJECT_ID
          wtskid: ANY_OBJECT_ID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      domain : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OACV

  post_condition:
