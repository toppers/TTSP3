version: "$Id: ref_mtx_H-b.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRP_mutex_ref_mtx_H_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, (T_RMTX*)TTSP_MACV_ADDRESS)
    ercd   : E_MACV

  post_condition:
