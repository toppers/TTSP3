version: "$Id: ref_mtx_c-2-1_H_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
ASP_mutex_ref_mtx_c_2_1_H1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type: T_RMTX
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      htskid  : TASK1
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmtx:
          htskid: TASK1
          wtskid: TASK2

