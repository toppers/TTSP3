ASP_mutex_loc_mtx_k_1_1_H1:
  note: 【NGKI2083】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_NULL
      htskid : TASK2
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: loc_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    TASK2:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK1:

