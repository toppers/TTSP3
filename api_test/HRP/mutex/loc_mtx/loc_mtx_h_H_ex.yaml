ASP_mutex_loc_mtx_h_H1:
  note: 【NGKI2080】【NGKI2107】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2
      domain : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: loc_mtx(MTX1)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    TASK2:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_INI_MTX(MTX1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready
      locmtx :

    MTX1:
      mtxstat : TMTX_UNL
      wtsklist:

