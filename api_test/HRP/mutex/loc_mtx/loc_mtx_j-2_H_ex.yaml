ASP_mutex_loc_mtx_j_2_H1:
  note: 【NGKI2081】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: loc_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1

