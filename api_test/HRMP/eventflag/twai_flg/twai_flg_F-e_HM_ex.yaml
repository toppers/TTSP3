FMP_eventflag_twai_flg_F_e_HM1:
  note: 【NGKI1610】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      flgatr: TA_NULL
      flgptn: BIT_PATTERN_0A
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      lefttmo: ANY_ELAPSED_TIME
      wobjid : FLG1

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A

  do_1:
    id     : TASK2
    syscall: TTSP_SET_FLG(FLG1, BIT_PATTERN_B)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running
      var    :
        flgptn:
          value: BIT_PATTERN_0A|BIT_PATTERN_B

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_B
      wtsklist:

