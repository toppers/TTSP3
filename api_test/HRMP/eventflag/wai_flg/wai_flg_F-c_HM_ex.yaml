FMP_eventflag_wai_flg_F_c_HM1:
  note: 【NGKI1634】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A
      domain: DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    FLG1:
      wtsklist:

