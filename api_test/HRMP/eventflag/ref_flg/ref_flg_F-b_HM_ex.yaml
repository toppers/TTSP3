version: "$Id: ref_flg_F-b_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_eventflag_ref_flg_F_b_HM1:
  note: 【NGKI1655】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rflg:
          type: T_RFLG
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_flg(FLG1, &rflg)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rflg:
          wtskid: TASK2
          flgptn: BIT_PATTERN_0A

