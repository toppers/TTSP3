FMP_eventflag_ini_flg_F_c_HM1:
  note: 【NGKI1645】【NGKI1646】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_SELF
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      iflgptn : BIT_PATTERN_0A
      flgptn  : BIT_PATTERN_0B
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - TASK4:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_flg(FLG1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: running

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:

