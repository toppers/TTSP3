version: "$Id: set_flg_F-c-4_ten_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_eventflag_set_flg_F_c_4_at_HM1:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SETFLG
      nfy_info1: FLG1
      nfy_info2: BIT_PATTERN_A
      almstat  : TALM_STP
      prcid    : PRC_SELF
      domain   : DOM1

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: suspended

      FLG1:
        flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
        wtsklist:

