FMP_eventflag_set_flg_F_e_3_2_HM1:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK5:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : "(TA_WMUL|TA_CLR)"
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: TWF_ORW
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ORW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A|BIT_PATTERN_B|BIT_PATTERN_C)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : 0
      wtsklist:
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ORW

