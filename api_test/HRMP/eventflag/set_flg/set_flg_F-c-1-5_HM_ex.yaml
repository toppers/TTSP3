version: "$Id: set_flg_F-c-1-5_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_eventflag_set_flg_F_c_1_5_HM1:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
      domain  : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK3
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
      wtsklist:

