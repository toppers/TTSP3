FMP_task_term_ras_ter_F_c_5_1_5_HM1:
  note: 【NGKI3477】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME
      actcnt : 1
      actprc : PRC_OTHER
      prcid  : PRC_SELF
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK3
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ras_ter(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      actcnt : 0
      bootcnt: 1
      actprc : TPRC_NONE
      prcid  : PRC_OTHER

    SEM1:
      wtsklist:

