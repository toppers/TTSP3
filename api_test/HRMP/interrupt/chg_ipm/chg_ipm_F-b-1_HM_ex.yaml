FMP_interrupt_chg_ipm_F_b_1_HM3:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP2

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP2

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_OTHER
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_ipm(ANY_IPM)
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      chg_ipm: ANY_IPM

