version: "$Id: get_ipm_F-b-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_interrupt_get_ipm_F_b_1_HM3:
  note: 【NGKI3120】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        intpri:
          type: PRI
      domain : DOM_SYS_ACP4

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP4

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_OTHER
      access1: TACP_KERNEL
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP(DOM_SYS_ACP4)

    DOM_SYS_ACP4:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_ipm(&intpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        intpri:
          value: TIPM_ENAALL

FMP_interrupt_get_ipm_F_b_1_HM5:
  note: 【NGKI3120】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        intpri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_GET_IPM(&intpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        intpri:
          value: TIPM_ENAALL
