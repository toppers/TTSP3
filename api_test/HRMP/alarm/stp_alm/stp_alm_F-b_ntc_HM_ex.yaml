version: "$Id: stp_alm_F-b_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_alarm_stp_alm_F_b_ai_HM2:
  note: 【NGKI2570】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      var      :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A
      prcid    : PRC_OTHER
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: stp_alm(ALM1)
    ercd   : E_OK

  post_condition:
    ALM1:
      almstat: TALM_STP

FMP_alarm_stp_alm_F_b_ci_HM2:
