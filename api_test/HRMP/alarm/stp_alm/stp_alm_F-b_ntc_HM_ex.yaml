      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      var      :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A
      prcid    : PRC_OTHER
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_CYC
    syscall: stp_alm(ALM1)
    ercd   : E_OK

  post_condition:
    ALM1:
