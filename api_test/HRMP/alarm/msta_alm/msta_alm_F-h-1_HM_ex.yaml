version: "$Id: msta_alm_F-h-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_alarm_msta_alm_F_h_1_HM3:
  note: 【NGKI2554】【NGKI2555】【NGKI2560】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP
      class    : CLS_SELF_ALL
      prcid    : PRC_SELF
      domain   : KERNEL
      access1  : TACP(DOM1)
      access2  : TACP_KERNEL
      access3  : TACP_KERNEL
      access4  : TACP_KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: msta_alm(ALM1, RELATIVE_TIME_A, TPRC_INI)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A
        prcid  : PRC_SELF

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE

