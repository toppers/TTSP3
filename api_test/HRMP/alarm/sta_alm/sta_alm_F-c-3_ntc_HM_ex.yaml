version: "$Id: sta_alm_F-c-3_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_c_3_ai_HM2:
  note: 【NGKI2541】【NGKI2542】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      almstat  : TALM_STP
      prcid    : PRC_OTHER
      domain   : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : DUMMY_ALM
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      lefttim: RELATIVE_TIME_A

  do_1:
    id  : DUMMY_ALM
    code: return

  post_condition_1:
    0:
      DUMMY_ALM:
        hdlstat: STP

      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      TASK1:
        var:
          data:
            value: ANY_VALUE

      ALM1:
        lefttim: 0

  do_2:
    RELATIVE_TIME_A+1:
      id  : TASK1
      code: ttsp_value_sync("TASK1", "data", &data, ANY_VALUE+1)

  post_condition_2:
    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: ANY_VALUE+1

      ALM1:
        almstat: TALM_STP

