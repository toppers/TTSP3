version: "$Id: sta_alm_F-d_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_d_HM3:
  note: TESRY_001，【NGKI2543】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STA
      hdlstat  : STP
      lefttim  : RELATIVE_TIME_A
      prcid    : PRC_OTHER
      domain   : KERNEL
      access1  : TACP(DOM1)
      access2  : TACP_KERNEL
      access3  : TACP_KERNEL
      access4  : TACP_KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_B)
    ercd   : E_OK

  post_condition:
    0:
      ALM1:
        lefttim: RELATIVE_TIME_B

    RELATIVE_TIME_B:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_B+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE

