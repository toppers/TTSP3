version: "$Id: wup_tsk_F-d-1-5_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_sync_wup_tsk_F_d_1_5_HM1:
  note: 【NGKI1271】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SLEEP
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

