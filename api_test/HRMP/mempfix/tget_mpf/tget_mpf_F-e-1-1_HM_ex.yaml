FMP_mempfix_tget_mpf_F_e_1_1_HM1:
  note: 【NGKI2303】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF
      var    :
        blk:
          type: void*
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_OTHER
      domain : DOM1

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_NULL
      fblkcnt : 0
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1, &blk, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1
      lefttmo: ANY_ELAPSED_TIME

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK1:
            var: blk

