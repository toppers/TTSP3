FMP_mempfix_ini_mpf_F_c_HM1:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_SELF
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_OTHER
      domain : DOM1

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK3:
        - TASK4:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: ready

    TASK3:
      tskstat: running

    TASK4:
      tskstat: running

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:

