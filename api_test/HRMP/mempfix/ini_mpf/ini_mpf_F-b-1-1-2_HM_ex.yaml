FMP_mempfix_ini_mpf_F_b_1_1_2_HM1:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:

