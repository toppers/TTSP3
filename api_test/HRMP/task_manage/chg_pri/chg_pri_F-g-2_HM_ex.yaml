FMP_task_manage_chg_pri_F_g_2_HM1:
  note: 【NGKI1197】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: ready
      tskbpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      locmtx :
        - MTX1
      domain : DOM1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      ceilpri: TSK_PRI_MID
      mtxatr : TA_CEILING
      htskid : TASK3
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TASK3, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:

