version: "$Id: chg_pri_F-f-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_chg_pri_F_f_1_HM1:
  note: 【NGKI1192】【NGKI1193】【NGKI1198】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running-suspended
      prcid  : PRC_SELF
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
