FMP_task_manage_mig_tsk_F_g_2_2_2_HM1:
  note: 【NGKI1155】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      prcid  : PRC_SELF
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mig_tsk(TASK2, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      prcid  : PRC_OTHER

