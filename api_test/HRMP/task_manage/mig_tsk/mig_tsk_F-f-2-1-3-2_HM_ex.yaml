FMP_task_manage_mig_tsk_F_f_2_1_3_2_HM1:
  note: 【NGKI1155】【NGKI1158】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mig_tsk(TSK_SELF, PRC_OTHER)

  post_condition:
    TASK1:
      tskstat: ready
      prcid  : PRC_OTHER
