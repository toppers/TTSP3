FMP_task_manage_mig_tsk_F_f_2_2_2_HM1:
  note: 【NGKI1155】【NGKI1158】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER
      domain : DOM1

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mig_tsk(TSK_SELF, PRC_OTHER)

  post_condition:
    TASK1:
      tskstat: ready
      prcid  : PRC_OTHER
