FMP_task_manage_mig_tsk_F_h_2_2_HM1:
  note: 【NGKI1161】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: ready
      class  : CLS_OTHER_ALL
      prcid  : PRC_SELF
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mig_tsk(TASK2, TPRC_INI)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      prcid  : PRC_OTHER

