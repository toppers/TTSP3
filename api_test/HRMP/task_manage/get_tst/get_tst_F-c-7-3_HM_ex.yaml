FMP_task_manage_get_tst_F_c_7_3_HM1:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_OTHER
      domain : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tst(TASK2, &tskstat)
    eruint : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_SUS

