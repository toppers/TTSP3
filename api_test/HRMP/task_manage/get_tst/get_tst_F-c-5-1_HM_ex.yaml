FMP_task_manage_get_tst_F_c_5_1_HM1:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SLEEP
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tst(TASK3, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_WAS

