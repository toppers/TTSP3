version: "$Id: get_tst_F-b-2_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_get_tst_F_b_2_HM1:
  note: 【NGKI3620】【NGKI3621】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF
      var    :
        tskstat:
          type: STAT
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tst(TSK_SELF, &tskstat)
    eruint : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_SUS
