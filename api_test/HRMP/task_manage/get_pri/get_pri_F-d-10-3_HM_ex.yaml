version: "$Id: get_pri_F-d-10-3_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_get_pri_F_d_10_3_HM1:
  note: 【NGKI1210】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        tskpri:
          type: PRI
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running-suspended
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      domain : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_pri(TASK2, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskpri:
          value: TSK_PRI_MID

