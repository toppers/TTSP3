version: "$Id: get_pri_F-c-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_get_pri_F_c_1_HM1:
  note: 【NGKI1210】【NGKI1211】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      var    :
        tskpri:
          type: PRI
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_pri(TSK_SELF, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskpri:
          value: TSK_PRI_MID
