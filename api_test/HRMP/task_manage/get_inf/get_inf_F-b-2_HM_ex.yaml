version: "$Id: get_inf_F-b-2_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_get_inf_F_b_2_HM3:
  note: 【NGKI1216】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      exinf  : EXINF_A
      prcid  : PRC_SELF
      var    :
        exinf:
          type: intptr_t
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        exinf:
          value: EXINF_A
