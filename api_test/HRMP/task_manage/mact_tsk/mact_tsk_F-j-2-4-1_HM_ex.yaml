FMP_task_manage_mact_tsk_F_j_2_4_1_HM1:
  note: 【NGKI3557】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SLEEP
      tskpri : TSK_PRI_MID
      actcnt : 0
      prcid  : PRC_OTHER_1
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER_2
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: mact_tsk(TASK2, PRC_OTHER_2)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt: 1
      actprc: PRC_OTHER_2

