FMP_task_manage_mact_tsk_F_k_2_2_ai_HM2:
  note: 【NGKI1137】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_MID
      actcnt : 0
      class  : CLS_OTHER_ALL
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: mact_tsk(TASK2, TPRC_INI)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      tskpri : TSK_PRI_MID
      actcnt : 1
      actprc : PRC_OTHER

