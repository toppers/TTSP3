FMP_task_manage_mact_tsk_F_f_2_2_1_ai_HM2:
  note: 【NGKI3557】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      actcnt : 0
      prcid  : PRC_SELF
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: mact_tsk(TASK1, PRC_SELF)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1
      actprc: PRC_SELF

