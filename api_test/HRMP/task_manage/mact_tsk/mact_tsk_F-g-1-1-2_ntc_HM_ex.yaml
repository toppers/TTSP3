version: "$Id: mact_tsk_F-g-1-1-2_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_mact_tsk_F_g_1_1_2_ai_HM2:
  note: 【NGKI1132】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_LOW
      actcnt : 0
      prcid  : PRC_SELF
      domain : DOM1

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      actcnt : 0
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_LOW
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: mact_tsk(TASK2, PRC_OTHER)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_LOW
      prcid  : PRC_OTHER
      porder : 2

    TASK4:
      porder: 1

