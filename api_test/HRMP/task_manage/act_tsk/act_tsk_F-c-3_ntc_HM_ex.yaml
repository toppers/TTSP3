version: "$Id: act_tsk_F-c-3_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_c_3_ai_HM2:
  note: 【NGKI1118】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: act_tsk(TASK3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3

    TASK4:
      porder: 2

