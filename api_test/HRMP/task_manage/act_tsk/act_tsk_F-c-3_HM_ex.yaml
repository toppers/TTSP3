  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_MID
      tskstat: dormant
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: act_tsk(TASK3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 3

    TASK4:
      porder: 2

