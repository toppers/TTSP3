  note: 【NGKI3527】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK1
      almstat  : TALM_STP
      prcid    : PRC_SELF
      domain   : DOM1

    TASK1:
      type   : TASK
      tskstat: running-suspended
      actcnt : 0
      prcid  : PRC_SELF
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        actcnt: 1

