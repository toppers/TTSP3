FMP_task_manage_act_tsk_F_e_2_ai_HM2:
  note: 【NGKI3527】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running-suspended
      actcnt : 0
      prcid  : PRC_SELF
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      chg_ipm: ANY_IPM
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: act_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1

