version: "$Id: get_tid_F-b-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_b_1_HM3:
  note: 【NGKI2709】【NGKI2711】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
