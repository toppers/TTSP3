FMP_sys_manage_unl_cpu_F_d_HM3:
  note: 【NGKI2737】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP2

    TASK2:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP2

    TASK3:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do_0:
    id     : TASK3
    syscall: TTSP_MACT_TSK(TASK2, PRC_SELF)
    ercd   : E_OK

  post_condition_0:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

  do_1:
    id     : TASK1
    syscall: unl_cpu()

  post_condition_1:
    CPU_STATE1:
      loc_cpu: false

    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

