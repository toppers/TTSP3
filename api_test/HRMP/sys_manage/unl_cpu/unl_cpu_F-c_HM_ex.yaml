FMP_sys_manage_unl_cpu_F_c_HM3:
  note: 【NGKI2739】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP2

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP2

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1
      domain : DOM_SYS_ACP2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER
      access1: TACP_KERNEL
      access2: TACP(DOM_SYS_ACP2)
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition:

