FMP_sys_manage_ena_dsp_F_b_1_HM3:
  note: 【NGKI2750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP1

    TASK3:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      chg_ipm: TIPM_ENAALL
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER
      access1: TACP(DOM_SYS_ACP1)
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ena_dsp()
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      dis_dsp: false

