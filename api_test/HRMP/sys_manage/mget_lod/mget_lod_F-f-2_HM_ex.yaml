version: "$Id: mget_lod_F-f-2_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_sys_manage_mget_lod_F_f_2_HM3:
  note: 【NGKI3639】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      var    :
        p_load:
          type: uint_t
      prcid  : PRC_SELF
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: mget_lod(PRC_OTHER, TSK_PRI_MID, &p_load)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_load:
          value: 1

FMP_sys_manage_mget_lod_F_f_2_HM5:
  note: 【NGKI3639】

  pre_condition:
    TASK1:
