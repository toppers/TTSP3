FMP_sys_manage_get_nth_F_b_1_1_HM3:
  note: 【NGKI3647】【NGKI3650】【NGKI5127】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF
      domain : DOM_ACP4

    TASK2:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      prcid  : PRC_OTHER
      domain : DOM_ACP4

    DOM_ACP4:
      type   : DOMAIN
      access1: TACP(DOM_ACP4)
      access2: TACP_KERNEL
      access3: TACP(DOM_ACP4)
      access4: TACP(DOM_ACP4)

  do:
    id     : TASK1
    syscall: get_nth(TPRI_SELF, 0, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1

