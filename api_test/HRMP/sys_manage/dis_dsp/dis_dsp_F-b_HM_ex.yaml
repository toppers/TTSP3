FMP_sys_manage_dis_dsp_F_b_HM3:
  note: 【NGKI2744】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM_SYS_ACP1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM_SYS_ACP1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER
      access1: TACP(DOM_SYS_ACP1)
      access2: TACP_KERNEL
      access3: TACP_KERNEL
      access4: TACP_KERNEL

    DOM_SYS_ACP1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: dis_dsp()
    ercd   : E_OK

  post_condition:
    CPU_STATE1:
      dis_dsp: true

