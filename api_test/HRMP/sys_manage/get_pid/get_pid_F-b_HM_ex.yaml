version: "$Id: get_pid_F-b_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_sys_manage_get_pid_F_b_HM3:
  note: 【NGKI2724】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_prcid:
          type: ID
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: get_pid(&p_prcid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_prcid:
          value: PRC_SELF
