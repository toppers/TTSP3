FMP_mutex_unl_mtx_F_c_1_5_HM1:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_NULL
      htskid  : TASK1
      wtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK4
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK3:

