FMP_mutex_ini_mtx_F_b_1_5_2_HM1:
  note: 【NGKI2104】【NGKI2105】【NGKI2106】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      locmtx :
        - MTX1
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1
      prcid  : PRC_OTHER
      domain : DOM1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_NULL
      htskid  : TASK1
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready

    MTX1:
      mtxstat : TMTX_UNL
      wtsklist:

