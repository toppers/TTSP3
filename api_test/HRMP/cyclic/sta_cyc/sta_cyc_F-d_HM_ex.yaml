FMP_cyclic_sta_cyc_F_d_HM3:
  note: TESRY_002，【NGKI2439】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STA
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B
      prcid    : PRC_OTHER
      domain   : KERNEL
      access1  : TACP(DOM1)
      access2  : TACP_KERNEL
      access3  : TACP_KERNEL
      access4  : TACP_KERNEL

    DOM1:
      type: DOMAIN

  do:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: STP

    RELATIVE_TIME_A+(RELATIVE_TIME_B*0)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 0

    RELATIVE_TIME_A+(RELATIVE_TIME_B*1)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 1

    RELATIVE_TIME_A+(RELATIVE_TIME_B*2)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 2

    RELATIVE_TIME_A+(RELATIVE_TIME_B*3)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 3

    RELATIVE_TIME_A+(RELATIVE_TIME_B*4)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 4

