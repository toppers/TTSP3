FMP_dataqueue_trcv_dtq_F_f_2_2_HM1:
  note: 【NGKI1771】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_TPRI
      dtqcnt  : 3
      rtsklist:
        - TASK2:
        - TASK3:
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    DTQ1:
      rtsklist:
        - TASK2:
        - TASK3:
        - TASK1:

