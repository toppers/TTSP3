FMP_dataqueue_trcv_dtq_F_e_2_1_2_HM1:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      prcid  : PRC_OTHER
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_A

    TASK2:
      tskstat: ready
      porder : 2

    TASK4:
      porder: 1

    DTQ1:
      stsklist:
      datalist:

