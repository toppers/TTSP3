FMP_dataqueue_snd_dtq_F_e_2_1_2_HM1:
  note: 【NGKI1734】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: ttg_data
        - TASK3:
      datalist:
      domain  : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
        - TASK3:

