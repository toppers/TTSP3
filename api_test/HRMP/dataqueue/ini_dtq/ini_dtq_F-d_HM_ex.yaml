FMP_dataqueue_ini_dtq_F_d_HM1:
  note: 【NGKI1778】【NGKI1779】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_SELF
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      prcid  : PRC_OTHER
      domain : DOM1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK4:
            data: DATA_B
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_dtq(DTQ1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: running

    DTQ1:
      stsklist:

