version: "$Id: loc_spn_F-d_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_d_ai_HM2:
  note: 【NGKI2179】【NGKI2180】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      domain : KERNEL

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do_0:
    id     : DUMMY_ALM
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition_0:
    DUMMY_ALM:
      hdlstat: ACTIVATE-waitspin
      spinid : SPN1

  do_1:
    id     : TASK2
    syscall: TTSP_UNL_SPN(SPN1)
    ercd   : E_OK

  post_condition_1:
    DUMMY_ALM:
      hdlstat: ACTIVATE

    SPN1:
      procid: DUMMY_ALM

    CPU_STATE1:
      loc_cpu: true

    CPU_STATE2:
      loc_cpu: false

