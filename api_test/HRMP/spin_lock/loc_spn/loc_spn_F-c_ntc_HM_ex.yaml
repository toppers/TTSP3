version: "$Id: loc_spn_F-c_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_c_ai_HM2:
  note: 【NGKI2178】【NGKI2181】【NGKI2182】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : KERNEL

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC
      procid : DUMMY_ALM

    CPU_STATE1:
      loc_cpu: true

