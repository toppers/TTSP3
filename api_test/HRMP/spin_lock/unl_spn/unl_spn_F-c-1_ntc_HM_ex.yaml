version: "$Id: unl_spn_F-c-1_ntc_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_spin_lock_unl_spn_F_c_1_ai_HM2:
  note: 【NGKI2203】【NGKI2204】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_SELF
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF
      domain : KERNEL

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      prcid  : PRC_SELF
      domain : KERNEL

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : DUMMY_ALM
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

    DOM1:
      type: DOMAIN

  do:
    id     : DUMMY_ALM
    syscall: unl_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false

