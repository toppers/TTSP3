version: "$Id: rcv_pdq_F-e-2-1-5_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_pridataq_rcv_pdq_F_e_2_1_5_HM1:
  note: 【NGKI1894】【NGKI1893】【NGKI1895】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID
      datalist:
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_MID
        - data   : DATA_E
          datapri: DATA_PRI_LOW
      domain  : DOM1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK4
      domain : DOM1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: rcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_C
        datapri:
          value: DATA_PRI_MID

    TASK2:
      tskstat: ready

    PDQ1:
      stsklist:
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_D
          datapri: DATA_PRI_MID
        - data   : DATA_E
          datapri: DATA_PRI_LOW

