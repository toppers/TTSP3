FMP_pridataq_trcv_pdq_F_f_1_3_HM1:
  note: 【NGKI1901】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:
        - TASK2:
        - TASK3:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      rtsklist:
        - TASK2:
        - TASK3:
        - TASK1:

