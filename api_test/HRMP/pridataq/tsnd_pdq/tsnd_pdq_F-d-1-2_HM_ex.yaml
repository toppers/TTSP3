FMP_pridataq_tsnd_pdq_F_d_1_2_HM1:
  note: 【NGKI1896】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 1
      stsklist:
      datalist:
        - data   : DATA_B
          datapri: DATA_PRI_MID
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do_0:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      stsklist:
        - TASK1:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do_1:
    id     : TASK2
    syscall: TTSP_PRCV_PDQ(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      var:
        data   :
          value: DATA_B
        datapri:
          value: DATA_PRI_MID

    PDQ1:
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH

