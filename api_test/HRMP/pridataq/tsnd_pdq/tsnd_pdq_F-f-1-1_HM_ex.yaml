version: "$Id: tsnd_pdq_F-f-1-1_HM_ex.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
FMP_pridataq_tsnd_pdq_F_f_1_1_HM1:
  note: 【NGKI1874】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqatr  : TA_NULL
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_MID
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_C, DATA_PRI_HIGH, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_MID
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_LOW
        - TASK1:
            data   : DATA_C
            datapri: DATA_PRI_HIGH

