FMP_pridataq_prcv_pdq_F_c_1_1_6_HM1:
  note: 【NGKI1894】【NGKI1897】【NGKI1899】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_A
        datapri:
          value: DATA_PRI_HIGH

    TASK2:
      tskstat: ready

    PDQ1:
      stsklist:

