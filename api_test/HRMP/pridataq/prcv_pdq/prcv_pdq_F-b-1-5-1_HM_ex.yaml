  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : PDQ1
      prcid  : PRC_OTHER
      domain : DOM1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      datalist:
        - data   : DATA_B
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: prcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_B
        datapri:
          value: DATA_PRI_MID

    TASK2:
      tskstat: running

    PDQ1:
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW

