version: "$Id: task_class_domain.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
task_class_domain:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      class  : CLS_SELF_ALL
      domain : KERNEL

    TASK2:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_MID
      prcid  : PRC_OTHER
      class  : CLS_OTHER_ALL
      domain : KERNEL

    TASK3:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_MID
      prcid  : PRC_OTHER
      class  : CLS_OTHER_ALL
      domain : KERNEL

    TASK4:
      type   : TASK
      tskstat: dormant
      itskpri: TSK_PRI_HIGH
      prcid  : PRC_OTHER
      class  : CLS_OTHER_ALL
      domain : KERNEL

    TASK5:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_SELF
      class  : CLS_SELF_ALL
      domain : DOM1

    TASK6:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_SELF
      class  : CLS_SELF_ALL
      domain : DOM1

    TASK7:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER
      class  : CLS_OTHER_ALL
      domain : DOM2

    TASK8:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_SELF
      class  : CLS_SELF_ALL
      domain : DOM2

    DOM1:
      type: DOMAIN

    DOM2:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: act_tsk(TASK4)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    TASK4:
      tskstat: running
      tskpri : TSK_PRI_HIGH
