version: "$Id: trcv_mbf_R-3.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_trcv_mbf_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      prcid  : PRC_OTHER

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : 0
      class   : CLS_OTHER_ALL
      stsklist:
        - TASK1:
            msg  : MBF_MSG_A
            msgsz: MBF_MSGSZ_A

  do:
    id     : TASK2
    syscall: trcv_mbf(MBF1, (void*)&message1, ANY_ELAPSED_TIME)
    eruint : MBF_MSGSZ_A

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        message1:
          value: MBF_MSG_A

    MBF1:
      stsklist:
