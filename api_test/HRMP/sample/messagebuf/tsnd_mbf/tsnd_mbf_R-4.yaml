version: "$Id: tsnd_mbf_R-4.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_tsnd_mbf_4:
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
          value  : MBF_MSG_A

    MBF1:
      type  : MESSAGEBUF
      maxmsz: ANY_MAX_MSIZE
      mbfsz : 0
      class : CLS_OTHER_ALL

  do:
    id     : TASK1
    syscall: tsnd_mbf(MBF1, (void*)&message1, MBF_MSGSZ_A, ANY_ELAPSED_TIME)
    ercd   : E_TMOUT

  post_condition:
