version: "$Id: ini_mbf_R-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_ini_mbf_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    MBF1:
      type   : MESSAGEBUF
      maxmsz : ANY_MAX_MSIZE
      mbfsz  : ANY_MBF_SIZE
      fmbfsz : "(ANY_MBF_SIZE - TSZ_MBFMB(1, MBF_MSGSZ_A) - TSZ_MBFMB(1, MBF_MSGSZ_B) - TSZ_MBFMB(1, MBF_MSGSZ_C))"
      class  : CLS_OTHER_ALL
      msglist:
        - msg  : MBF_MSG_A
          msgsz: MBF_MSGSZ_A
        - msg  : MBF_MSG_B
          msgsz: MBF_MSGSZ_B
        - msg  : MBF_MSG_C
          msgsz: MBF_MSGSZ_C

  do:
    id     : TASK1
    syscall: ini_mbf(MBF1)
    ercd   : E_OK

  post_condition:
    MBF1:
      fmbfsz : ANY_MBF_SIZE
      msglist:
