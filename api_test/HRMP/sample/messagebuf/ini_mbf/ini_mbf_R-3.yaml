version: "$Id: ini_mbf_R-3.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_ini_mbf_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      prcid  : PRC_OTHER

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : 0
      class   : CLS_OTHER_ALL
      stsklist:
        - TASK2:
            msg  : MBF_MSG_A
            msgsz: MBF_MSGSZ_A
        - TASK3:
            msg  : MBF_MSG_B
            msgsz: MBF_MSGSZ_B

  do:
    id     : TASK1
    syscall: ini_mbf(MBF1)
    ercd   : E_OK

  post_condition:
    MBF1:
      stsklist:

    TASK2:
      tskstat: ready

    TASK3:
      tskstat: ready
