version: "$Id: ini_mbf_R-5.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_ini_mbf_5:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      prcid  : PRC_OTHER
      var    :
        msg1  :
          type   : uint8_t
          arraysz: MBF_MSGSZ_A
        msgsz1:
          type: uint_t

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MBF1
      prcid  : PRC_OTHER
      var    :
        msg2  :
          type   : uint8_t
          arraysz: MBF_MSGSZ_B
        msgsz2:
          type: uint_t

    MBF1:
      type    : MESSAGEBUF
      maxmsz  : ANY_MAX_MSIZE
      mbfsz   : ANY_MBF_SIZE
      class   : CLS_OTHER_ALL
      rtsklist:
        - TASK2:
            v_msg  : msg1
            v_msgsz: msgsz1
        - TASK3:
            v_msg  : msg2
            v_msgsz: msgsz2

  do:
    id     : TASK1
    syscall: ini_mbf(MBF1)
    ercd   : E_OK

  post_condition:
    MBF1:
      rtsklist:

    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    TASK3:
      tskstat: ready
