version: "$Id: ref_mbf_R-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_ref_mbf_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER
      var    :
        pk_rmbf:
          type: T_RMBF

    MBF1:
      type   : MESSAGEBUF
      maxmsz : ANY_MAX_MSIZE
      mbfsz  : ANY_MBF_SIZE
      fmbfsz : "(ANY_MBF_SIZE - TSZ_MBFMB(1, MBF_MSGSZ_A) - TSZ_MBFMB(1, MBF_MSGSZ_B) - TSZ_MBFMB(1, MBF_MSGSZ_C))"
      class  : CLS_OTHER_ALL
      msglist:
        - msg  : MBF_MSG_A
          msgsz: MBF_MSGSZ_A
        - msg  : MBF_MSG_B
          msgsz: MBF_MSGSZ_B
        - msg  : MBF_MSG_C
          msgsz: MBF_MSGSZ_C

  do:
    id     : TASK1
    syscall: ref_mbf(MBF1, &pk_rmbf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        pk_rmbf:
          stskid : TSK_NONE
          rtskid : TSK_NONE
          smbfcnt: 3
          fmbfsz : "(ANY_MBF_SIZE - TSZ_MBFMB(1, MBF_MSGSZ_A) - TSZ_MBFMB(1, MBF_MSGSZ_B) - TSZ_MBFMB(1, MBF_MSGSZ_C))"
