version: "$Id: snd_mbf_R-2.yaml 75 2020-03-19 08:28:47Z fujisft-shigihara $"
HRMP_snd_mbf_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      prcid  : PRC_OTHER
      var    :
        message1:
          type   : uint8_t
          arraysz: MBF_MSGSZ_C
          value  : MBF_MSG_C

    MBF1:
      type   : MESSAGEBUF
      maxmsz : ANY_MAX_MSIZE
      mbfsz  : ANY_MBF_SIZE
      fmbfsz : "(ANY_MBF_SIZE - TSZ_MBFMB(1, MBF_MSGSZ_A) - TSZ_MBFMB(1, MBF_MSGSZ_B))"
      class  : CLS_OTHER_ALL
      msglist:
        - msg  : MBF_MSG_A
          msgsz: MBF_MSGSZ_A
        - msg  : MBF_MSG_B
          msgsz: MBF_MSGSZ_B

  do:
    id     : TASK1
    syscall: snd_mbf(MBF1, (void*)&message1, MBF_MSGSZ_C)
    ercd   : E_OK

  post_condition:
    MBF1:
      fmbfsz : "(ANY_MBF_SIZE - TSZ_MBFMB(1, MBF_MSGSZ_A) - TSZ_MBFMB(1, MBF_MSGSZ_B) - TSZ_MBFMB(1, MBF_MSGSZ_C))"
      msglist:
        - msg  : MBF_MSG_A
          msgsz: MBF_MSGSZ_A
        - msg  : MBF_MSG_B
          msgsz: MBF_MSGSZ_B
        - msg  : MBF_MSG_C
          msgsz: MBF_MSGSZ_C
