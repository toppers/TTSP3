FMP_semaphore_ini_sem_F_b_1_5_2_HM1:
  note: 【NGKI1532】【NGKI1533】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      prcid    : PRC_OTHER
      domain   : KERNEL

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      prcid  : PRC_OTHER
      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      isemcnt : ANY_INI_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    SEM1:
      semcnt  : ANY_INI_SEMCNT
      wtsklist:

