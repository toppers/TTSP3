  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      var    :
        pk_rsem:
          type: T_RSEM
      domain : DOM1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
