      domain : DOM1

    SEM1:
      type    : SEMAPHORE
      isemcnt : ANY_INI_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:
      domain  : DOM1

    DOM1:
      type: DOMAIN

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, &pk_rsem)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        pk_rsem:
          wtskid: TASK2
          semcnt: 0

