version: "$Id: wai_sem_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_wai_sem_d:
  note: 【NGKI1522】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    SEM1:
      type  : SEMAPHORE
      semcnt: 0

  do_0:
    id     : TASK1
    syscall: wai_sem(SEM1)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    TASK2:
      tskstat: running

    SEM1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    SEM1:
      wtsklist:
