version: "$Id: wai_sem_i-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_wai_sem_i_2_2:
  note: 【NGKI1525】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SEM1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      type    : SEMAPHORE
      sematr  : TA_TPRI
      semcnt  : 0
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: wai_sem(SEM1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      wtsklist:
        - TASK1:
        - TASK2:
        - TASK3:
