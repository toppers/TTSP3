version: "$Id: wai_sem_h.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_semaphore_wai_sem_h:
  note: 【NGKI1524】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : TASK1
    syscall: wai_sem(SEM1)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT-1
