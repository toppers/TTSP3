version: "$Id: twai_sem_l-2-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_semaphore_twai_sem_l_2_1:
  note: 【NGKI1525】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      sematr: TA_TPRI
      semcnt: 0

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    SEM1:
      wtsklist:
        - TASK1:
