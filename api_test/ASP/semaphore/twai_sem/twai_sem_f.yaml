version: "$Id: twai_sem_f.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_twai_sem_f:
  note: 【NGKI3457】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    SEM1:
      type  : SEMAPHORE
      semcnt: 0

  do_0:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    SEM1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready

    SEM1:
      wtsklist:
