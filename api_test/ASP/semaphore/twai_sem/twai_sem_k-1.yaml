version: "$Id: twai_sem_k-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_twai_sem_k_1:
  note: 【NGKI1524】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, TMO_FEVR)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT-1
