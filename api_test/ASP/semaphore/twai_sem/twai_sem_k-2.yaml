version: "$Id: twai_sem_k-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_twai_sem_k_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      semcnt: 0

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : SEM1

      SEM1:
        wtsklist:
          - TASK1:

    FOREVER_TIME:
