version: "$Id: ref_sem_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_ref_sem_a_2:
  note: 【NGKI1537】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rsem:
          type  : T_RSEM
          wtskid: ANY_OBJECT_ID
          semcnt: ANY_INI_SEMCNT

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_sem(SEM1,&rsem)
    ercd   : E_CTX

  post_condition:
