version: "$Id: ref_sem_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_ref_sem_c_1:
  note: 【NGKI1542】【NGKI1543】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rsem:
          type: T_RSEM

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, &rsem)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rsem:
          wtskid: TSK_NONE
          semcnt: ANY_NOW_SEMCNT
