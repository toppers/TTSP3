version: "$Id: ref_sem_b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_ref_sem_b_1:
  note: 【NGKI1538】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rsem:
          type  : T_RSEM
          wtskid: ANY_OBJECT_ID
          semcnt: ANY_INI_SEMCNT

    SEM1:
      type  : SEMAPHORE
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : TASK1
    syscall: ref_sem(0,&rsem)
    ercd   : E_ID

  post_condition:
