version: "$Id: ref_sem_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_ref_sem_c_2:
  note: 【NGKI1542】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rsem:
          type: T_RSEM

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, &rsem)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rsem:
          wtskid: TASK2
          semcnt: 0
