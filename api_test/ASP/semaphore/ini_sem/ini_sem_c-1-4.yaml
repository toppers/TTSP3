version: "$Id: ini_sem_c-1-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_ini_sem_c_1_4:
  note: 【NGKI1532】【NGKI1533】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SEM1

    SEM1:
      type    : SEMAPHORE
      maxsem  : ANY_MAX_SEMCNT
      isemcnt : ANY_INI_SEMCNT
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

    SEM1:
      semcnt  : ANY_INI_SEMCNT
      wtsklist:
