version: "$Id: ini_sem_d-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_semaphore_ini_sem_d_1:
  note: 【NGKI1532】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type   : SEMAPHORE
      maxsem : ANY_MAX_SEMCNT
      isemcnt: ANY_INI_SEMCNT
      semcnt : ANY_INI_SEMCNT

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
