version: "$Id: sig_sem_d_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_semaphore_sig_sem_d_ai:
  note: 【NGKI1508】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      maxsem: ANY_MAX_SEMCNT
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : DUMMY_ALM
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT+1

ASP_semaphore_sig_sem_d_ci:
  note: 【NGKI1508】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      maxsem: ANY_MAX_SEMCNT
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : DUMMY_CYC
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT+1
