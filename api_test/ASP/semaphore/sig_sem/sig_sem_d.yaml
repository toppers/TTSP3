version: "$Id: sig_sem_d.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_semaphore_sig_sem_d:
  note: 【NGKI1508】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type  : SEMAPHORE
      maxsem: ANY_MAX_SEMCNT
      semcnt: ANY_NOW_SEMCNT

  do:
    id     : TASK1
    syscall: sig_sem(SEM1)
    ercd   : E_OK

  post_condition:
    SEM1:
      semcnt: ANY_NOW_SEMCNT+1
