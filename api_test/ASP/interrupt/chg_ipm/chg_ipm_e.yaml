version: "bb-2026-06-09"
ASP_interrupt_chg_ipm_e:
  note: 【NGKI3111】ディスパッチ禁止状態（dis_dsp呼出し後，enadsp=false）でchg_ipm(TIPM_ENAALL)を呼び出した場合，ディスパッチが発生せず呼出しタスクが実行状態のまま継続すること

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : TASK1
    syscall: chg_ipm(TIPM_ENAALL)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    CPU_STATE:
      dis_dsp: true
      chg_ipm: TIPM_ENAALL
