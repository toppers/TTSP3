version: "$Id: chg_ipm_c-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_interrupt_chg_ipm_c_2:
  note: 【NGKI3111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: chg_ipm(TIPM_ENAALL)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      chg_ipm: TIPM_ENAALL
