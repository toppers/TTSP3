ASP_interrupt_get_ipm_a_2:
  note: 【NGKI3117】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        intpri:
          type : PRI
          value: ANY_IPM

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_ipm(&intpri)
    ercd   : E_CTX

  post_condition:
