version: "$Id: get_ipm_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_interrupt_get_ipm_a_1:
  note: 【NGKI3116】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        intpri:
          type : PRI
          value: ANY_IPM

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ALM1
    syscall: get_ipm(&intpri)
    ercd   : E_CTX

  post_condition:
