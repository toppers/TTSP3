version: "$Id: clr_int_c-1_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_interrupt_clr_int_c_1_ai:
  note: 【NGKI3924】
  variation:
    api_support_clr_int: true

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      intreq : true

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do:
    id     : DUMMY_ALM
    syscall: clr_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition:
    INH1:
      intreq: false

ASP_interrupt_clr_int_c_1_ci:
  note: 【NGKI3924】
  variation:
    api_support_clr_int: true

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      intreq : true

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do:
    id     : DUMMY_CYC
    syscall: clr_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition:
    INH1:
      intreq: false
