version: "$Id: ena_int_c-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_interrupt_ena_int_c_2_ai:
  note: TESRY_006，【NGKI3099】
  variation:
    api_support_ena_int: true

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      intreq : true

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do_0:
    id     : DUMMY_ALM
    syscall: ena_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intstat: TA_ENAINT

  do_1:
    id     : DUMMY_ALM
    syscall: TTSP_UNL_CPU()

  post_condition_1:
    DUMMY_ALM:
      hdlstat: STP

    INH1:
      hdlstat: ACTIVATE
      intreq : false

    CPU_STATE:
      loc_cpu: false

ASP_interrupt_ena_int_c_2_ci:
  note: TESRY_006，【NGKI3099】
  variation:
    api_support_ena_int: true

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      intreq : true

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do_0:
    id     : DUMMY_CYC
    syscall: ena_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intstat: TA_ENAINT

  do_1:
    id     : DUMMY_CYC
    syscall: TTSP_UNL_CPU()

  post_condition_1:
    DUMMY_CYC:
      hdlstat: STP

    INH1:
      hdlstat: ACTIVATE
      intreq : false

    CPU_STATE:
      loc_cpu: false
