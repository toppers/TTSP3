version: "$Id: dis_int_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_interrupt_dis_int_c_2:
  note: TESRY_006，【NGKI3086】
  variation:
    api_support_dis_int: true
    api_support_ena_int: true

  pre_condition:
    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP
      intreq : false

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do_0:
    id     : TASK1
    syscall: dis_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intstat: TA_DISINT

  do_1:
    id  : TASK1
    code: ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_1:
    INH1:
      intreq: true

  do_2:
    id     : TASK1
    syscall: TTSP_ENA_INT(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_2:
    INH1:
      intstat: TA_ENAINT

  do_3:
    id     : TASK1
    syscall: TTSP_UNL_CPU()

  post_condition_3:
    INH1:
      hdlstat: ACTIVATE
      intreq : false

    CPU_STATE:
      loc_cpu: false
      chg_ipm: INT_PRI_MID
