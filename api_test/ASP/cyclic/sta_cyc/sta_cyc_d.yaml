version: "$Id: sta_cyc_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_cyclic_sta_cyc_d:
  note: TESRY_002，【NGKI2438】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B

  do:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: STP

    RELATIVE_TIME_A+(RELATIVE_TIME_B*0)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 0

    RELATIVE_TIME_A+(RELATIVE_TIME_B*1)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 1

    RELATIVE_TIME_A+(RELATIVE_TIME_B*2)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 2

    RELATIVE_TIME_A+(RELATIVE_TIME_B*3)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 3

    RELATIVE_TIME_A+(RELATIVE_TIME_B*4)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 4
