version: "$Id: stp_cyc_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_cyclic_stp_cyc_c:
  note: 【NGKI2462】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_INCVAR
      nfy_info1: "&data"
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B

  do:
    id     : TASK1
    syscall: stp_cyc(CYC1)
    ercd   : E_OK

  post_condition:
