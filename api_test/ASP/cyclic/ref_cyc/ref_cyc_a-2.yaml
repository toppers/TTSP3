version: "$Id: ref_cyc_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_a_2:
  note: 【NGKI2465】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rcyc:
          type   : T_RCYC
          cycstat: ANY_CYCLIC_STAT
          lefttim: RELATIVE_TIME_A

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_B
      cyctim   : RELATIVE_TIME_C

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_CTX

  post_condition:
