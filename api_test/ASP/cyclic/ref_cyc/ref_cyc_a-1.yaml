version: "$Id: ref_cyc_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_a_1:
  note: 【NGKI2464】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rcyc:
          type   : T_RCYC
          cycstat: ANY_CYCLIC_STAT
          lefttim: RELATIVE_TIME_A

    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycatr   : TA_NULL
      cycstat  : TCYC_STP
      hdlstat  : STP
      cycphs   : RELATIVE_TIME_B
      cyctim   : RELATIVE_TIME_C

  do:
    id     : ALM1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_CTX

  post_condition:
