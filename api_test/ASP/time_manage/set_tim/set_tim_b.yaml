version: "$Id: set_tim_b.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_time_manage_set_tim_b:
  note: 【NGKI3567】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type  : CPU_STATE
      systim: ANY_SYSTEM_TIME

  do:
    id     : TASK1
    syscall: set_tim(ANY_SYSTEM_TIME*2)
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      systim: ANY_SYSTEM_TIME*2
