version: "$Id: set_tim_a-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_time_manage_set_tim_a_1:
  note: 【NGKI3564】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type  : CPU_STATE
      systim: ANY_SYSTEM_TIME

  do:
    id     : ALM1
    syscall: set_tim(ANY_SYSTEM_TIME*2)
    ercd   : E_CTX

  post_condition:
