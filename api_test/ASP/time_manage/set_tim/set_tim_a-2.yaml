version: "$Id: set_tim_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_set_tim_a_2:
  note: 【NGKI3565】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      systim : ANY_SYSTEM_TIME

  do:
    id     : TASK1
    syscall: set_tim(ANY_SYSTEM_TIME*2)
    ercd   : E_CTX

  post_condition:
