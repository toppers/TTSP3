version: "$Id: adj_tim_d-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_adj_tim_d_1:
  note: 【NGKI3586】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim1:
          type: SYSTIM
        systim2:
          type: SYSTIM

  do_0:
    id     : TASK1
    syscall: TTSP_GET_TIM(&systim1)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: adj_tim(ANY_ADJUST_PLUS_TIME)
    ercd   : E_OK

  post_condition_1:

  do_2:
    id     : TASK1
    syscall: TTSP_GET_TIM(&systim2)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      var:
        systim2:
          value: systim1+ANY_ADJUST_PLUS_TIME
