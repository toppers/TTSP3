version: "wb-2026-06-09"
ASP_time_manage_adj_tim_W_a:
  note: 【NGKI3586】check_adjtim(0) の else-fall-through パス（time_event.c L533 br[1]）
  # adjtim==0 のとき check_adjtim は adjtim>0 / adjtim<0 の両分岐をスキップして false を返す．
  # adj_tim(0) は E_OK となり，システム時刻は変化しない．

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : TASK1
    syscall: adj_tim(0)
    ercd   : E_OK

  post_condition:
