version: "$Id: get_tim_d-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_get_tim_d_2:
  note: 【NGKI3592】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim1:
          type: SYSTIM
        systim2:
          type: SYSTIM

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant

    ALM1:
      type     : ALARM
      nfytype  : TNFY_ACTTSK
      nfy_info1: TASK2
      almstat  : TALM_STA
      lefttim  : RELATIVE_TIME_A

  do_0:
    id     : TASK1
    syscall: get_tim(&systim1)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: TTSP_ADJ_TIM(ANY_ADJUST_MINUS_TIME)
    ercd   : E_OK

  post_condition_1:
    ALM1:
      lefttim: ANY_ADJUST_PLUS_TIME+RELATIVE_TIME_A

  do_2:
    id     : TASK1
    syscall: get_tim(&systim2)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      var:
        systim2:
          value: systim1

  do_3:
    id     : TASK1
    syscall: TTSP_SET_TIM(systim1-1)
    ercd   : E_OK

  post_condition_3:

  do_4:
    id     : TASK1
    syscall: get_tim(&systim2)
    ercd   : E_OK

  post_condition_4:
    ALM1:
      lefttim: ANY_ADJUST_PLUS_TIME+RELATIVE_TIME_A

    TASK1:
      var:
        systim2:
          value: systim1-1
