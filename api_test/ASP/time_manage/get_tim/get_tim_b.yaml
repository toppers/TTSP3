version: "$Id: get_tim_b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_get_tim_b:
  note: 【NGKI2354】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim1:
          type: SYSTIM
        systim2:
          type: SYSTIM

  do_0:
    0:
      id     : TASK1
      syscall: get_tim(&systim1)
      ercd   : E_OK

  post_condition_0:
    0:
    ANY_ELAPSED_TIME:

  do_1:
    ANY_ELAPSED_TIME:
      id     : TASK1
      syscall: get_tim(&systim2)
      ercd   : E_OK

  post_condition_1:
    ANY_ELAPSED_TIME:
      TASK1:
        var:
          systim2:
            value: systim1+ANY_ELAPSED_TIME
