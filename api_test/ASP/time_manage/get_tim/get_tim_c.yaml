version: "$Id: get_tim_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_get_tim_c:
  note: 【NGKI3591】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type: SYSTIM

    CPU_STATE:
      type  : CPU_STATE
      systim: ANY_SYSTEM_TIME

  do_0:
    id     : TASK1
    syscall: TTSP_ADJ_TIM(ANY_ADJUST_MINUS_TIME)
    ercd   : E_OK

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: get_tim(&systim)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      var:
        systim:
          value: ANY_SYSTEM_TIME
