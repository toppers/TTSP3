version: "$Id: get_tim_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_get_tim_a_1:
  note: 【NGKI2350】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        systim:
          type : SYSTIM
          value: ANY_SYSTEM_TIME

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ALM1
    syscall: get_tim(&systim)
    ercd   : E_CTX

  post_condition:
