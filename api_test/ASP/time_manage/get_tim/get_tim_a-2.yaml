version: "$Id: get_tim_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_time_manage_get_tim_a_2:
  note: 【NGKI2351】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        systim:
          type : SYSTIM
          value: ANY_SYSTEM_TIME

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_tim(&systim)
    ercd   : E_CTX

  post_condition:
