version: "$Id: ref_tsk_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_a_1:
  note: 【NGKI1218】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rtsk:
          type   : T_RTSK
          tskstat: ANY_TASK_STAT
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          tskwait: ANY_TASK_WAIT
          wobjid : ANY_OBJECT_ID
          lefttmo: RELATIVE_TIME_A
          actcnt : ANY_QUEUING_CNT
          wupcnt : ANY_QUEUING_CNT

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ALM1
    syscall: ref_tsk(TASK1,&rtsk)
    ercd   : E_CTX

  post_condition:
