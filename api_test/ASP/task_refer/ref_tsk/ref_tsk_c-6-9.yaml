version: "$Id: ref_tsk_c-6-9.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_6_9:
  note: 【NGKI1224】【NGKI1225】【NGKI1227】【NGKI1231】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rtsk:
          type: T_RTSK
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      ceilpri : TSK_PRI_MID
      mtxatr  : TA_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_WAS
          tskwait: TTW_MTX
          wobjid : MTX1
          lefttmo: TMO_FEVR
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 0
          wupcnt : 0
