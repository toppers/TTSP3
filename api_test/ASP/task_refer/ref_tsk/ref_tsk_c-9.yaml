version: "$Id: ref_tsk_c-9.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_9:
  note: 【NGKI1224】【NGKI1225】【NGKI1238】【NGKI1227】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rtsk:
          type: T_RTSK

    TASK2:
      type   : TASK
      tskstat: ready
      actcnt : 1

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_RDY
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 1
          wupcnt : 0
