version: "$Id: ref_tsk_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_1:
  note: 【NGKI1224】【NGKI1225】【NGKI1227】【NGKI1248】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rtsk:
          type: T_RTSK

  do:
    id     : TASK1
    syscall: ref_tsk(TSK_SELF,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_RUN
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 0
          wupcnt : 0
