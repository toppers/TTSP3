version: "$Id: ref_tsk_c-11-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_11_2:
  note: 【NGKI1224】【NGKI1225】【NGKI3468】【NGKI1227】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rtsk:
          type: T_RTSK

    TASK2:
      type   : TASK
      tskstat: ready
      dister : false

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          dister: "false"
