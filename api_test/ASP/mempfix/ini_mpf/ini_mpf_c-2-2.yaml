version: "$Id: ini_mpf_c-2-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mempfix_ini_mpf_c_2_2:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MPF1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_NULL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK4:
        - TASK3:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)

  post_condition:
    TASK1:
      tskstat: ready
      porder : 1

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: ready
      porder : 2

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:
