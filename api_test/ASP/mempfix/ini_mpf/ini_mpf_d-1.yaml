version: "$Id: ini_mpf_d-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mempfix_ini_mpf_d_1:
  note: 【NGKI2320】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: ANY_INI_BLKCNT

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt: ANY_INI_BLKCNT
