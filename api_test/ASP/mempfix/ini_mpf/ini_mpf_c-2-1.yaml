version: "$Id: ini_mpf_c-2-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mempfix_ini_mpf_c_2_1:
  note: 【NGKI2320】【NGKI2321】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MPF1

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK4:

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 3

    TASK4:
      tskstat: ready
      porder : 4

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:
