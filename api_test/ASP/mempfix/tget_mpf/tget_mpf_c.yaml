version: "$Id: tget_mpf_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_c:
  note: 【NGKI2295】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,TMO_FEVR-1)
    ercd   : E_PAR

  post_condition:
