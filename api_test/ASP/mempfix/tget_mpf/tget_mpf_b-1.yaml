version: "$Id: tget_mpf_b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_b_1:
  note: 【NGKI2294】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

  do:
    id     : TASK1
    syscall: tget_mpf(0,&blk,ANY_ELAPSED_TIME)
    ercd   : E_ID

  post_condition:
