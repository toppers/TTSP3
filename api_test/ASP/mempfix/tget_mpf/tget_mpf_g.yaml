version: "$Id: tget_mpf_g.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_g:
  note: 【NGKI2301】【NGKI2322】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: 0

  do_0:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,ANY_ELAPSED_TIME)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MPF1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_INI_MPF(MPF1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    MPF1:
      fblkcnt : ANY_INI_BLKCNT
      wtsklist:
