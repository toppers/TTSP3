version: "$Id: tget_mpf_l-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_l_3:
  note: 【NGKI2303】
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_TPRI
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,ANY_ELAPSED_TIME)
    ercd   : E_TMOUT

  post_condition:
