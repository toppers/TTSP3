version: "$Id: tget_mpf_m-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_m_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk1:
          type: void*

    MPF1:
      type   : MEMORYPOOL
      blkcnt : 2
      fblkcnt: 2
      blksz  : ANY_BLKSZ

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk1,ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt: 1
      kermpf : blk1
