version: "$Id: tget_mpf_j-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_tget_mpf_j_2:
  note: 【NGKI2299】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: 0

  do:
    id     : TASK1
    syscall: tget_mpf(MPF1,&blk,TMO_POL)
    ercd   : E_TMOUT

  post_condition:
