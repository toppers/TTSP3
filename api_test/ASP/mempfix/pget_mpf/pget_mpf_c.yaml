version: "$Id: pget_mpf_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_pget_mpf_c:
  note: 【NGKI2302】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: ANY_NOW_BLKCNT

  do:
    id     : TASK1
    syscall: pget_mpf(MPF1,&blk)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt: ANY_NOW_BLKCNT-1
