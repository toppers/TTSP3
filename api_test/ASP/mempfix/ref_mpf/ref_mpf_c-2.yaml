version: "$Id: ref_mpf_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_c_2:
  note: 【NGKI2330】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmpf:
          type: T_RMPF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      type    : MEMORYPOOL
      fblkcnt : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmpf:
          wtskid : TASK2
          fblkcnt: 0
