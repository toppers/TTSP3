version: "$Id: ref_mpf_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_a_2:
  note: 【NGKI2325】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmpf:
          type   : T_RMPF
          wtskid : ANY_OBJECT_ID
          fblkcnt: ANY_NOW_BLKCNT

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_CTX

  post_condition:
