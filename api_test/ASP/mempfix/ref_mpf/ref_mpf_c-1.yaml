version: "$Id: ref_mpf_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_c_1:
  note: 【NGKI2330】【NGKI2331】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmpf:
          type: T_RMPF

    MPF1:
      type    : MEMORYPOOL
      fblkcnt : 1
      wtsklist:

  do:
    id     : TASK1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmpf:
          wtskid : TSK_NONE
          fblkcnt: 1
