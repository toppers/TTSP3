version: "$Id: ref_mpf_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_a_1:
  note: 【NGKI2324】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rmpf:
          type   : T_RMPF
          wtskid : ANY_OBJECT_ID
          fblkcnt: ANY_NOW_BLKCNT

    TASK1:
      type   : TASK
      tskstat: running

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

  do:
    id     : ALM1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_CTX

  post_condition:
