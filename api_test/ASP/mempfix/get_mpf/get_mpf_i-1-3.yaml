version: "$Id: get_mpf_i-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_get_mpf_i_1_3:
  note: 【NGKI2303】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_NULL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK1:
