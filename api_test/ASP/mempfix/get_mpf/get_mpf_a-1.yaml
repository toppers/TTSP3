version: "$Id: get_mpf_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_get_mpf_a_1:
  note: 【NGKI2290】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    TASK1:
      type   : TASK
      tskstat: running

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

  do:
    id     : ALM1
    syscall: get_mpf(MPF1,&blk)
    ercd   : E_CTX

  post_condition:
