version: "$Id: get_mpf_e.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_get_mpf_e:
  note: 【NGKI3466】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    MPF1:
      type   : MEMORYPOOL
      blkcnt : ANY_INI_BLKCNT
      fblkcnt: 0

  do_0:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    TASK2:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready

    MPF1:
      wtsklist:
