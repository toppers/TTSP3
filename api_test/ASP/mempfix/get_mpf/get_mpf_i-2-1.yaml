version: "$Id: get_mpf_i-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_get_mpf_i_2_1:
  note: 【NGKI2303】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_TPRI
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK1:
