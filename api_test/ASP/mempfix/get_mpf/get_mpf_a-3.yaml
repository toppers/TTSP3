version: "$Id: get_mpf_a-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_get_mpf_a_3:
  note: 【NGKI2292】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)
    ercd   : E_CTX

  post_condition:
