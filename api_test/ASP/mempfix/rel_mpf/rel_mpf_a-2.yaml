version: "$Id: rel_mpf_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_rel_mpf_a_2:
  note: 【NGKI2306】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type : void*
          value: "(void*)ANY_ADDRESS"

    MPF1:
      type  : MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_CTX

  post_condition:
