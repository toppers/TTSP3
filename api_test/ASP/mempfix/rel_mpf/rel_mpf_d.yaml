version: "$Id: rel_mpf_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_rel_mpf_d:
  note: TESRY_007，【NGKI2312】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : ANY_NOW_BLKCNT
      wtsklist:

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: ANY_NOW_BLKCNT-1

  do_1:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_1:
    MPF1:
      fblkcnt: ANY_NOW_BLKCNT
