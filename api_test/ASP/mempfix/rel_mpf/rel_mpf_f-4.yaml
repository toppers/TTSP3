version: "$Id: rel_mpf_f-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_rel_mpf_f_4:
  note: TESRY_007，【NGKI2310】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      porder : 2
      var    :
        blk:
          type: void*

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready
      porder : 3
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 1
      wtsklist:

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK1
    syscall: TTSP_ROT_RDQ(TSK_PRI_MID)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: ready
      porder : 3

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready
      porder : 2

  do_2:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_2:
    TASK1:
      tskstat: ready
      porder : 2

    TASK2:
      tskstat: waiting
      wobjid : MPF1

    TASK3:
      tskstat: running

    MPF1:
      wtsklist:
        - TASK2:

  do_3:
    id     : TASK3
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_3:
    TASK1:
      tskstat: running

    TASK3:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:

  do_4:
    id     : TASK1
    syscall: TTSP_SUS_TSK(TASK2)
    ercd   : E_OK

  post_condition_4:
    TASK2:
      tskstat: waiting-suspended

    MPF1:
      wtsklist:
        - TASK2:
        - TASK3:

  do_5:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_5:
    TASK2:
      tskstat: suspended

    MPF1:
      wtsklist:
        - TASK3:
