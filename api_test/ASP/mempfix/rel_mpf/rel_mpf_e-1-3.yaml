version: "$Id: rel_mpf_e-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mempfix_rel_mpf_e_1_3:
  note: TESRY_007，【NGKI2310】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        blk:
          type: void*

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SLEEP
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 1
      wtsklist:

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: TIPM_ENAALL

  do_0:
    id     : TASK1
    syscall: TTSP_GET_MPF(MPF1, &blk)
    ercd   : E_OK

  post_condition_0:
    MPF1:
      fblkcnt: 0

  do_1:
    id     : TASK1
    syscall: TTSP_WUP_TSK(TASK2)
    ercd   : E_OK

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

  do_2:
    id     : TASK2
    syscall: TTSP_GET_MPF(MPF1, &blk)

  post_condition_2:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK2:

  do_3:
    id     : TASK1
    syscall: TTSP_CHG_IPM(ANY_IPM)
    ercd   : E_OK

  post_condition_3:
    CPU_STATE:
      chg_ipm: ANY_IPM

  do_4:
    id     : TASK1
    syscall: rel_mpf(MPF1, blk)
    ercd   : E_OK

  post_condition_4:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    MPF1:
      wtsklist:
