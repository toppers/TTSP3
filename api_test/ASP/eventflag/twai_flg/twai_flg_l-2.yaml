version: "$Id: twai_flg_l-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_twai_flg_l_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : FLG1

      FLG1:
        wtsklist:
          - TASK1:
              waiptn: BIT_PATTERN_B
              wfmode: WAIT_FLG_MODE_A

    FOREVER_TIME:
