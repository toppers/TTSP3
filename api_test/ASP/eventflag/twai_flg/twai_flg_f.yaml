version: "$Id: twai_flg_f.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_twai_flg_f:
  note: 【NGKI1634】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do_0:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, ANY_ELAPSED_TIME)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : FLG1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    FLG1:
      wtsklist:
