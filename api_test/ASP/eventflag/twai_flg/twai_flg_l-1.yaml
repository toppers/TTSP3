version: "$Id: twai_flg_l-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_twai_flg_l_1:
  note: 【NGKI1636】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type: FLGPTN

    FLG1:
      type  : EVENTFLAG
      flgatr: TA_NULL
      flgptn: BIT_PATTERN_A|BIT_PATTERN_B

  do:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_A, WAIT_FLG_MODE_A, &flgptn, TMO_FEVR)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        flgptn:
          value: BIT_PATTERN_A|BIT_PATTERN_B
