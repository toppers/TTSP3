version: "$Id: twai_flg_m-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_twai_flg_m_4:
  note: 【NGKI1633】【NGKI1638】
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type    : EVENTFLAG
      flgptn  : BIT_PATTERN_0A
      wtsklist:

  do:
    id     : TASK1
    syscall: twai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn, ANY_ELAPSED_TIME)
    ercd   : E_TMOUT

  post_condition:
