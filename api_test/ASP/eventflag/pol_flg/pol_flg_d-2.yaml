version: "$Id: pol_flg_d-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_pol_flg_d_2:
  note: 【NGKI1632】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B

  do:
    id     : TASK1
    syscall: pol_flg(FLG1, BIT_PATTERN_C, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_ILUSE

  post_condition:
