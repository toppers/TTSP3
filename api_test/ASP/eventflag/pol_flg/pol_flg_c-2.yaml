version: "$Id: pol_flg_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_pol_flg_c_2:
  note: 【NGKI1627】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: pol_flg(FLG1, BIT_PATTERN_B, 0, &flgptn)
    ercd   : E_PAR

  post_condition:
