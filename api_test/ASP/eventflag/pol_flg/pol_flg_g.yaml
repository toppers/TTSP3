version: "$Id: pol_flg_g.yaml 2026-06-08 honda $"
ASP_eventflag_pol_flg_g:
  note: 【NGKI1632】TA_WMUL属性を持つイベントフラグで待ちタスクがある場合，E_ILUSEとはならずE_TMOUTが返ること

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_C
            wfmode: WAIT_FLG_MODE_C

  do:
    id     : TASK1
    syscall: pol_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_TMOUT

  post_condition:
