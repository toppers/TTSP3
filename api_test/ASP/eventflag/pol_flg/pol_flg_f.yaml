version: "$Id: pol_flg_f.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_pol_flg_f:
  note: 【NGKI1633】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: pol_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_TMOUT

  post_condition:
