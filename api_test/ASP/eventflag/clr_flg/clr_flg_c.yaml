version: "$Id: clr_flg_c.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_eventflag_clr_flg_c:
  note: 【NGKI1617】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: clr_flg(FLG1, BIT_PATTERN_0B)
    ercd   : E_OK

  post_condition:
    FLG1:
      flgptn: BIT_PATTERN_0A&BIT_PATTERN_0B
