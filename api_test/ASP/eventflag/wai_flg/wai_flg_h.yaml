version: "$Id: wai_flg_h.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_wai_flg_h:
  note: 【NGKI1635】【NGKI1647】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    FLG1:
      type   : EVENTFLAG
      iflgptn: BIT_PATTERN_0A
      flgptn : BIT_PATTERN_0B

  do_0:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : FLG1

    TASK2:
      tskstat: running

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_A

  do_1:
    id     : TASK2
    syscall: TTSP_INI_FLG(FLG1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:
