version: "$Id: wai_flg_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_wai_flg_c_1:
  note: 【NGKI1626】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, 0x00, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_PAR

  post_condition:
