version: "$Id: wai_flg_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_wai_flg_a_2:
  note: 【NGKI1622】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_CTX

  post_condition:
