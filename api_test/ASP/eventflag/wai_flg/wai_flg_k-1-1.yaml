version: "$Id: wai_flg_k-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_wai_flg_k_1_1:
  note: 【NGKI1638】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        flgptn:
          type: FLGPTN

    FLG1:
      type  : EVENTFLAG
      flgatr: TA_WMUL
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_A, WAIT_FLG_MODE_A, &flgptn)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      wtsklist:
        - TASK1:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
