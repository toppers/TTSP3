version: "$Id: wai_flg_e.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_wai_flg_e:
  note: 【NGKI3458】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      var    :
        flgptn:
          type : FLGPTN
          value: BIT_PATTERN_A

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_B, WAIT_FLG_MODE_A, &flgptn)
    ercd   : E_RASTER

  post_condition:
