version: "$Id: set_flg_g-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_set_flg_g_2_1:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : FLG1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : FLG1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A|BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK3:
            waiptn: BIT_PATTERN_A|BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_A|BIT_PATTERN_B
            wfmode: TWF_ANDW

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 1

    TASK3:
      tskstat: ready
      porder : 2

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
      wtsklist:
        - TASK4:
            waiptn: BIT_PATTERN_A|BIT_PATTERN_B
            wfmode: TWF_ANDW
