version: "$Id: set_flg_g-3-2_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_set_flg_g_3_2_at:
  note: 【NGKI1608】【NGKI1609】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SETFLG
      nfy_info1: FLG1
      nfy_info2: BIT_PATTERN_A|BIT_PATTERN_B|BIT_PATTERN_C
      almstat  : TALM_STP

    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type    : EVENTFLAG
      flgatr  : "(TA_WMUL|TA_CLR)"
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: TWF_ORW
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: TWF_ORW
        - TASK4:
            waiptn: BIT_PATTERN_C
            wfmode: TWF_ORW

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: ready

      FLG1:
        flgptn  : 0
        wtsklist:
          - TASK3:
              waiptn: BIT_PATTERN_B
              wfmode: TWF_ORW
          - TASK4:
              waiptn: BIT_PATTERN_C
              wfmode: TWF_ORW

