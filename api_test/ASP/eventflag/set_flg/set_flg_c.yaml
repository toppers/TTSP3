version: "$Id: set_flg_c.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_eventflag_set_flg_c:
  note: 【NGKI1608】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A)
    ercd   : E_OK

  post_condition:
    FLG1:
      flgptn: BIT_PATTERN_0A|BIT_PATTERN_A
