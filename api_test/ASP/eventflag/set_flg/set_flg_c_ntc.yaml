version: "$Id: set_flg_c_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_set_flg_c_ai:
  note: 【NGKI1608】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : DUMMY_ALM
    syscall: set_flg(FLG1, BIT_PATTERN_A)
    ercd   : E_OK

  post_condition:
    FLG1:
      flgptn: BIT_PATTERN_0A|BIT_PATTERN_A

ASP_eventflag_set_flg_c_ci:
  note: 【NGKI1608】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    FLG1:
      type  : EVENTFLAG
      flgptn: BIT_PATTERN_0A

  do:
    id     : DUMMY_CYC
    syscall: set_flg(FLG1, BIT_PATTERN_A)
    ercd   : E_OK

  post_condition:
    FLG1:
      flgptn: BIT_PATTERN_0A|BIT_PATTERN_A
