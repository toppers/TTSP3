version: "$Id: ref_flg_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_ref_flg_c_1:
  note: 【NGKI1655】【NGKI1656】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rflg:
          type: T_RFLG

    FLG1:
      type    : EVENTFLAG
      flgptn  : BIT_PATTERN_0A
      wtsklist:

  do:
    id     : TASK1
    syscall: ref_flg(FLG1, &rflg)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rflg:
          wtskid: TSK_NONE
          flgptn: BIT_PATTERN_0A
