version: "$Id: ini_flg_c-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_eventflag_ini_flg_c_2_2:
  note: 【NGKI1645】【NGKI1646】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : FLG1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_WMUL
      iflgptn : BIT_PATTERN_0A
      flgptn  : BIT_PATTERN_0B
      wtsklist:
        - TASK4:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
        - TASK3:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - TASK2:
            waiptn: BIT_PATTERN_C
            wfmode: WAIT_FLG_MODE_C

  do:
    id     : TASK1
    syscall: ini_flg(FLG1)

  post_condition:
    TASK1:
      tskstat: ready
      porder : 1

    TASK2:
      tskstat: running

    TASK3:
      tskstat: ready

    TASK4:
      tskstat: ready
      porder : 2

    FLG1:
      flgptn  : BIT_PATTERN_0A
      wtsklist:
