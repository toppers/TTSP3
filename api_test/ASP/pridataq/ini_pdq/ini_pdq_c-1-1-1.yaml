version: "$Id: ini_pdq_c-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_ini_pdq_c_1_1_1:
  note: 【NGKI1908】【NGKI1909】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: ini_pdq(PDQ1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      wobjid :

    PDQ1:
      stsklist:
