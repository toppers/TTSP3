version: "$Id: ini_pdq_d-1-1-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_pridataq_ini_pdq_d_1_1_3:
  note: 【NGKI1908】【NGKI1909】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type    : P_DATAQUEUE
      rtsklist:
        - TASK2:

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: ini_pdq(PDQ1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      rtsklist:
