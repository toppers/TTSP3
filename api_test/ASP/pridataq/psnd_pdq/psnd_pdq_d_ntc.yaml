version: "$Id: psnd_pdq_d_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_d_ai:
  note: 【NGKI1868】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do:
    id     : DUMMY_ALM
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_TMOUT

  post_condition:

ASP_pridataq_psnd_pdq_d_ci:
  note: 【NGKI1868】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do:
    id     : DUMMY_CYC
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_TMOUT

  post_condition:
