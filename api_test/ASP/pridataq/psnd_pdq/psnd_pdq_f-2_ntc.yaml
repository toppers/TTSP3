version: "$Id: psnd_pdq_f-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_f_2_ai:
  note: 【NGKI1873】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      rtsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

  do:
    id     : DUMMY_ALM
    syscall: psnd_pdq(PDQ1, DATA_C, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_C
          datapri: DATA_PRI_HIGH
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

ASP_pridataq_psnd_pdq_f_2_ci:
  note: 【NGKI1873】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      rtsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

  do:
    id     : DUMMY_CYC
    syscall: psnd_pdq(PDQ1, DATA_C, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_C
          datapri: DATA_PRI_HIGH
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW
