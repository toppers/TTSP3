version: "$Id: psnd_pdq_e-1-5.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_e_1_5:
  note: TESRY_003，【NGKI1871】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    TASK1:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI

    TASK2:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:
        - TASK1:
            vardata: ttg_data
            varpri : ttg_pri

  do_0:
    id     : TASK2
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK2
    syscall: slp_tsk()

  post_condition_1:
    TASK2:
      tskstat: waiting
      wobjid : SLEEP

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

  do_2:
    id     : ALM1
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: ready
      wobjid :

    PDQ1:
      rtsklist:

  do_3:
    id  : ALM1
    code: return

  post_condition_3:
    ALM1:
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      tskstat: running
      wobjid :
      var    :
        ttg_data:
          value: DATA_A
        ttg_pri :
          value: DATA_PRI_HIGH
