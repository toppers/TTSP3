version: "$Id: psnd_pdq_e-2-1-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_psnd_pdq_e_2_1_2_ai:
  note: 【NGKI1871】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri
        - TASK3:
      datalist:

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : DUMMY_ALM
    syscall: psnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      rtsklist:
        - TASK3:

