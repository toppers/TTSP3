version: "$Id: trcv_pdq_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_c:
  note: 【NGKI1885】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    PDQ1:
      type: P_DATAQUEUE

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, TMO_FEVR-1)
    ercd   : E_PAR

  post_condition:
