version: "$Id: trcv_pdq_k-1-2-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_k_1_2_1_2:
  note: 【NGKI1894】【NGKI1893】【NGKI1895】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : PDQ1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
      datalist:
        - data   : DATA_B
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_B
        datapri:
          value: DATA_PRI_MID

    TASK2:
      tskstat: ready
      wobjid :
      porder : 2

    TASK3:
      tskstat: ready
      porder : 1

    PDQ1:
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_D
          datapri: DATA_PRI_LOW
