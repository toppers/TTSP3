version: "$Id: trcv_pdq_k-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_k_1_1_1:
  note: 【NGKI1894】【NGKI1893】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      stsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
