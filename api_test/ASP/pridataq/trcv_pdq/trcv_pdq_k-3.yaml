version: "$Id: trcv_pdq_k-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_k_3:
  note: 【NGKI1890】
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_TMOUT

  post_condition:
