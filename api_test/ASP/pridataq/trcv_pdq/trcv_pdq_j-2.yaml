version: "$Id: trcv_pdq_j-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_j_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : PDQ1

      PDQ1:
        rtsklist:
          - TASK1:

    FOREVER_TIME:
