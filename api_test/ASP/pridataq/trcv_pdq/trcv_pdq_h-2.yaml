version: "$Id: trcv_pdq_h-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_h_2:
  note: 【NGKI1872】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    PDQ1:
      type   : P_DATAQUEUE
      pdqcnt : 1
      maxdpri: DATA_PRI_MAX

  do_0:
    id     : TASK2
    syscall: trcv_pdq(PDQ1, &data, &datapri, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      rtsklist:
        - TASK2:
            vardata: data
            varpri : datapri

  do_1:
    id     : TASK1
    syscall: TTSP_PSND_PDQ(PDQ1, DATA_A, DATA_PRI_HIGH)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        data   :
          value: DATA_A
        datapri:
          value: DATA_PRI_HIGH

    PDQ1:
      rtsklist:
