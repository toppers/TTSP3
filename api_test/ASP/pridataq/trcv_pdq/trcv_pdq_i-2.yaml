version: "$Id: trcv_pdq_i-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_trcv_pdq_i_2:
  note: 【NGKI1890】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do:
    id     : TASK1
    syscall: trcv_pdq(PDQ1, &data, &datapri, TMO_POL)
    ercd   : E_TMOUT

  post_condition:
