ASP_pridataq_rcv_pdq_b_2:
  note: 【NGKI1884】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    PDQ1:
      type: P_DATAQUEUE

  do:
    id     : TASK1
    syscall: rcv_pdq(TNUM_PDQID+1, &data, &datapri)
    ercd   : E_ID

  post_condition:
