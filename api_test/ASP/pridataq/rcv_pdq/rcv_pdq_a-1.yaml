version: "$Id: rcv_pdq_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_rcv_pdq_a_1:
  note: 【NGKI1880】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type: P_DATAQUEUE

  do:
    id     : ALM1
    syscall: rcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_CTX

  post_condition:
