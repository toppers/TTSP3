version: "$Id: rcv_pdq_f.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_rcv_pdq_f:
  note: 【NGKI1892】【NGKI1910】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data   :
          type : intptr_t
          value: DATA_A
        datapri:
          type : PRI
          value: DATA_PRI_MID

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do_0:
    id     : TASK2
    syscall: rcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      rtsklist:
        - TASK2:
            vardata: data
            varpri : datapri

  do_1:
    id     : TASK1
    syscall: TTSP_INI_PDQ(PDQ1)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    PDQ1:
      rtsklist:
