version: "$Id: ref_pdq_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_ref_pdq_a_2:
  note: 【NGKI1913】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rpdq:
          type   : T_RPDQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          spdqcnt: ANY_DATA_CNT

    PDQ1:
      type: P_DATAQUEUE

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1,&rpdq)
    ercd   : E_CTX

  post_condition:
