version: "$Id: ref_pdq_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_ref_pdq_a_1:
  note: 【NGKI1912】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rpdq:
          type   : T_RPDQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          spdqcnt: ANY_DATA_CNT

    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type: P_DATAQUEUE

  do:
    id     : ALM1
    syscall: ref_pdq(PDQ1,&rpdq)
    ercd   : E_CTX

  post_condition:
