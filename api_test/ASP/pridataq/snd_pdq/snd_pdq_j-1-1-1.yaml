version: "$Id: snd_pdq_j-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_snd_pdq_j_1_1_1:
  note: 【NGKI1874】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:

  do:
    id     : TASK1
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      stsklist:
        - TASK1:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
