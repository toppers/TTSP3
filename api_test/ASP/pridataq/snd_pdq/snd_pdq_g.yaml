version: "$Id: snd_pdq_g.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_snd_pdq_g:
  note: 【NGKI1870】【NGKI1910】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      stsklist:

  do_0:
    id     : TASK2
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_DLT

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do_1:
    id     : TASK1
    syscall: TTSP_INI_PDQ(PDQ1)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    PDQ1:
      stsklist:
