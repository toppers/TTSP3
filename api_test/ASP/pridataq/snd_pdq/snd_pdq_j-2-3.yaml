version: "$Id: snd_pdq_j-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_snd_pdq_j_2_3:
  note: 【NGKI1873】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      maxdpri : DATA_PRI_MAX
      rtsklist:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW

  do:
    id     : TASK1
    syscall: snd_pdq(PDQ1, DATA_C, DATA_PRI_MID)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_MID
        - data   : DATA_C
          datapri: DATA_PRI_MID
        - data   : DATA_B
          datapri: DATA_PRI_LOW
