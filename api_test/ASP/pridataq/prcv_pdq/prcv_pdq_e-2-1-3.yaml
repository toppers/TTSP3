version: "$Id: prcv_pdq_e-2-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_prcv_pdq_e_2_1_3:
  note: 【NGKI1894】【NGKI1897】【NGKI1899】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: prcv_pdq(PDQ1, &data, &datapri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data   :
          value: DATA_A
        datapri:
          value: DATA_PRI_HIGH

    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      stsklist:
        - TASK3:
            data   : DATA_B
            datapri: DATA_PRI_MID
