version: "$Id: prcv_pdq_e-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_prcv_pdq_e_1_1_1:
  note: 【NGKI1894】【NGKI1897】【NGKI1899】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data   :
          type: intptr_t
        datapri:
          type: PRI

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:
        - TASK2:
            data   : DATA_A
            datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: prcv_pdq(PDQ1, &data, &datapri)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      wobjid :

    PDQ1:
      stsklist:
