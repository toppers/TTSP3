version: "$Id: tsnd_pdq_k-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_tsnd_pdq_k_1:
  note: 【NGKI1873】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 3
      rtsklist:
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH, TMO_FEVR)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
