version: "$Id: tsnd_pdq_l-2-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_tsnd_pdq_l_2_2_3:
  note: 【NGKI1873】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 2
      maxdpri : DATA_PRI_MAX
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_B, DATA_PRI_MID, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    PDQ1:
      datalist:
        - data   : DATA_A
          datapri: DATA_PRI_HIGH
        - data   : DATA_B
          datapri: DATA_PRI_MID
