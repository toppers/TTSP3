version: "$Id: tsnd_pdq_l-2-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_pridataq_tsnd_pdq_l_2_1_1_1:
  note: 【NGKI1874】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      wobjid :

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:

  do:
    id     : TASK1
    syscall: tsnd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1
      lefttmo: ANY_ELAPSED_TIME

    PDQ1:
      stsklist:
        - TASK1:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
