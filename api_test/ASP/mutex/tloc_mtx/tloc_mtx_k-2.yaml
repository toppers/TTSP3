version: "$Id: tloc_mtx_k-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_k_2:
  note: 【NGKI2081】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : ANY_ATT_MTX_NOT_CEILING

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1
