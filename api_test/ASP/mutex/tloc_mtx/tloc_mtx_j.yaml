version: "$Id: tloc_mtx_j.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_j:
  note: 【NGKI2095】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2

  do_0:
    id     : TASK1
    syscall: tloc_mtx(MTX1, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    TASK2:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      wtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_UNL_MTX(MTX1)

  post_condition_1:
    TASK1:
      tskstat: running
      locmtx :
        - MTX1

    TASK2:
      tskstat: ready
      locmtx :

    MTX1:
      htskid  : TASK1
      wtsklist:
