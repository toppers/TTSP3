version: "$Id: tloc_mtx_m-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_m_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : MTX1

      TASK2:
        tskstat: running
        locmtx :
          - MTX1

      MTX1:
        htskid  : TASK2
        wtsklist:
          - TASK1:

    FOREVER_TIME:
