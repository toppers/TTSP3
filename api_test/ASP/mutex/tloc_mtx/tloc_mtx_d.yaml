version: "$Id: tloc_mtx_d.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_d:
  note: 【NGKI2085】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_HIGH

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_MID

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, ANY_ELAPSED_TIME)
    ercd   : E_ILUSE

  post_condition:
