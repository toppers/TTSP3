version: "$Id: tloc_mtx_e.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_tloc_mtx_e:
  note: 【NGKI3609】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK1

  do:
    id     : TASK1
    syscall: tloc_mtx(MTX1, ANY_ELAPSED_TIME)
    ercd   : E_OBJ

  post_condition:
