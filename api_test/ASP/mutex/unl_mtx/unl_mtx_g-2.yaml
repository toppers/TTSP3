version: "ASP3 3.7.2"
ASP_mutex_unl_mtx_g_2:
  note: 【NGKI2096】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_LOW
      locmtx :
        - MTX1
        - MTX2

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH
      htskid : TASK1

    MTX2:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH
      htskid : TASK1

  do:
    id     : TASK1
    syscall: unl_mtx(MTX2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_LOW
      locmtx :
        - MTX1

    MTX2:
      mtxstat: TMTX_UNL
