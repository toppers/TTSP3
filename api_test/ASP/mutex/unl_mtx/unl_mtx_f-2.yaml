version: "$Id: unl_mtx_f-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_unl_mtx_f_2:
  note: 【NGKI2092】【NGKI2093】【NGKI2094】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MTX1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1

    TASK4:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      porder : 2
      locmtx :
        - MTX1

    TASK4:
      porder: 1

    MTX1:
      htskid  : TASK2
      wtsklist:
        - TASK3:
