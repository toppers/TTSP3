version: "$Id: unl_mtx_d-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_unl_mtx_d_2:
  note: 【NGKI2096】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK1

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    MTX1:
      mtxstat: TMTX_UNL
