version: "$Id: unl_mtx_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_unl_mtx_a_2:
  note: 【NGKI2088】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK1

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_CTX

  post_condition:
