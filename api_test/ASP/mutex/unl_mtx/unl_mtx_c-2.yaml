version: "$Id: unl_mtx_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_unl_mtx_c_2:
  note: 【NGKI3611】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2

  do:
    id     : TASK1
    syscall: unl_mtx(MTX1)
    ercd   : E_OBJ

  post_condition:
