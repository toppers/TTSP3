version: "$Id: ref_mtx_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ref_mtx_c_1:
  note: 【NGKI2115】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type: T_RMTX

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmtx:
          htskid: TSK_NONE
          wtskid: TSK_NONE
