version: "$Id: ref_mtx_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ref_mtx_a_2:
  note: 【NGKI2110】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type  : T_RMTX
          htskid: ANY_OBJECT_ID
          wtskid: ANY_OBJECT_ID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_CTX

  post_condition:
