version: "$Id: ref_mtx_c-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ref_mtx_c_2_2:
  note: 【NGKI2116】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type: T_RMTX
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK1

  do:
    id     : TASK1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmtx:
          htskid: TASK1
          wtskid: TSK_NONE
