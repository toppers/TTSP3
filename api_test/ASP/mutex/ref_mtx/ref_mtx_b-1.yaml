ASP_mutex_ref_mtx_b_1:
  note: 【NGKI2111】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rmtx:
          type  : T_RMTX
          htskid: ANY_OBJECT_ID
          wtskid: ANY_OBJECT_ID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL

  do:
    id     : TASK1
    syscall: ref_mtx(0, &rmtx)
    ercd   : E_ID

  post_condition:
