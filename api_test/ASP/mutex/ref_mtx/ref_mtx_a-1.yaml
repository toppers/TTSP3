version: "$Id: ref_mtx_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ref_mtx_a_1:
  note: 【NGKI2109】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rmtx:
          type  : T_RMTX
          htskid: ANY_OBJECT_ID
          wtskid: ANY_OBJECT_ID

    TASK1:
      type   : TASK
      tskstat: running

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL

  do:
    id     : ALM1
    syscall: ref_mtx(MTX1, &rmtx)
    ercd   : E_CTX

  post_condition:
