version: "$Id: loc_mtx_j-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_loc_mtx_j_2:
  note: 【NGKI2081】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : ANY_ATT_MTX_NOT_CEILING

  do:
    id     : TASK1
    syscall: loc_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1
