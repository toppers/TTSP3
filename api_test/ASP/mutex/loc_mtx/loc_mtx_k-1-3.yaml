version: "$Id: loc_mtx_k-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_loc_mtx_k_1_3:
  note: 【NGKI2083】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : MTX1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : MTX1

    TASK4:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_BOTTOM
      locmtx :
        - MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : TA_NULL
      htskid  : TASK4
      wtsklist:
        - TASK2:
        - TASK3:

  do:
    id     : TASK1
    syscall: loc_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MTX1

    TASK4:
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      htskid  : TASK4
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK1:
