version: "$Id: ploc_mtx_e-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mutex_ploc_mtx_e_1:
  note: 【NGKI2081】【NGKI2082】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH

  do:
    id     : TASK1
    syscall: ploc_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1
