version: "$Id: ploc_mtx_f.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mutex_ploc_mtx_f:
  note: 【NGKI2078】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK2

  do:
    id     : TASK1
    syscall: ploc_mtx(MTX1)
    ercd   : E_TMOUT

  post_condition:
