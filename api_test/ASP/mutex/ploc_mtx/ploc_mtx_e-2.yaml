version: "$Id: ploc_mtx_e-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_mutex_ploc_mtx_e_2:
  note: 【NGKI2081】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      tskbpri: TSK_PRI_MID

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : ANY_ATT_MTX_NOT_CEILING

  do:
    id     : TASK1
    syscall: ploc_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:
        - MTX1

    MTX1:
      mtxstat: TMTX_LOC
      htskid : TASK1
