version: "$Id: ini_mtx_d-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ini_mtx_d_1:
  note: 【NGKI2104】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      tskbpri: TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH
      htskid : TASK1

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
      locmtx:

    MTX1:
      mtxstat: TMTX_UNL
