version: "ASP3 3.7.2"
ASP_mutex_ini_mtx_f:
  note: 【NGKI2105】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1
        - MTX2

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK1

    MTX2:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK1

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx :
        - MTX2

    MTX1:
      mtxstat: TMTX_UNL
