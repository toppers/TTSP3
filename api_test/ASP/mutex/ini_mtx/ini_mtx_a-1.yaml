version: "$Id: ini_mtx_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ini_mtx_a_1:
  note: 【NGKI2099】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      htskid : TASK1

  do:
    id     : ALM1
    syscall: ini_mtx(MTX1)
    ercd   : E_CTX

  post_condition:
