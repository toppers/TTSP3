version: "$Id: ini_mtx_c-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ini_mtx_c_2_1:
  note: 【NGKI2104】【NGKI2105】【NGKI2106】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1

    TASK3:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1

    TASK4:
      type   : TASK
      tskstat: waiting
      wobjid : MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:
        - TASK3:
        - TASK4:

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    TASK1:
      locmtx:

    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      tskstat: ready
      porder : 3

    TASK4:
      tskstat: ready
      porder : 4

    MTX1:
      mtxstat : TMTX_UNL
      wtsklist:
