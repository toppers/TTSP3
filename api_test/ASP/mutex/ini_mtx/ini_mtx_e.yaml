version: "ASP3 3.7.2"
ASP_mutex_ini_mtx_e:
  note: 【NGKI2104】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_UNL
      mtxatr : ANY_ATT_MTX_NOT_CEILING

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)
    ercd   : E_OK

  post_condition:
    MTX1:
      mtxstat: TMTX_UNL
