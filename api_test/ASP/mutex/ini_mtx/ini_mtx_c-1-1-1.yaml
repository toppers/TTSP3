version: "$Id: ini_mtx_c-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_mutex_ini_mtx_c_1_1_1:
  note: 【NGKI2104】【NGKI2105】【NGKI2106】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_mtx(MTX1)

  post_condition:
    TASK1:
      tskstat: ready
      locmtx :

    TASK2:
      tskstat: running

    MTX1:
      mtxstat : TMTX_UNL
      wtsklist:
