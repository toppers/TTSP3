version: "$Id: chg_pri_f-4-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_chg_pri_f_4_1:
  note: 【NGKI1195】【NGKI1196】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting-suspended
      wobjid : SLEEP

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_LOW
