version: "$Id: chg_pri_f-1-2-1-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_chg_pri_f_1_2_1_1:
  note: 【NGKI1192】【NGKI1193】【NGKI1194】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_HIGH)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskpri : TSK_PRI_HIGH
      tskstat: running
