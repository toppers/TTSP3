version: "$Id: chg_pri_i-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_chg_pri_i_2_2:
  note: 【NGKI1197】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH

    TASK2:
      type   : TASK
      tskstat: ready
      tskbpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      ceilpri: TSK_PRI_MID
      mtxatr : TA_CEILING
      htskid : TASK2

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
