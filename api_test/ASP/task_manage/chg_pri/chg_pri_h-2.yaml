version: "$Id: chg_pri_h-2.yaml 65 2020-02-04 09:07:13Z fujisft-shigihara $"
ASP_task_manage_chg_pri_h_2:
  note: 【NGKI1192】【NGKI1193】【NGKI1198】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskpri: TSK_PRI_MID
