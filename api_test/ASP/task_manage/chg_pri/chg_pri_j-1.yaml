version: "ASP3 3.7.2"
ASP_task_manage_chg_pri_j_1:
  note: 【NGKI1197】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_MID
      tskpri : TSK_PRI_HIGH
      locmtx :
        - MTX1
        - MTX2

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : ANY_ATT_MTX_NOT_CEILING
      htskid : TASK1

    MTX2:
      type   : MUTEX
      mtxstat: TMTX_LOC
      mtxatr : TA_CEILING
      ceilpri: TSK_PRI_HIGH
      htskid : TASK1

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_LOW)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskbpri: TSK_PRI_LOW
