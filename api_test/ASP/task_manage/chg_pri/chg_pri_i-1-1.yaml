version: "$Id: chg_pri_i-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_chg_pri_i_1_1:
  note: 【NGKI1197】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskbpri: TSK_PRI_MID
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    MTX1:
      type   : MUTEX
      mtxstat: TMTX_LOC
      ceilpri: TSK_PRI_MID
      mtxatr : TA_CEILING
      htskid : TASK1

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
