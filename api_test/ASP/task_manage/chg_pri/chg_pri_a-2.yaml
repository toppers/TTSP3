version: "$Id: chg_pri_a-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_chg_pri_a_2:
  note: 【NGKI1185】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_MID)
    ercd   : E_CTX

  post_condition:
