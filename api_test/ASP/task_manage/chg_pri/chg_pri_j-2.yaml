version: "ASP3 3.7.2"
ASP_task_manage_chg_pri_j_2:
  note: 【NGKI1192】【NGKI1193】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      locmtx :
        - MTX1

    TASK2:
      type   : TASK
      tskstat: waiting
      tskbpri: TSK_PRI_MID
      tskpri : TSK_PRI_MID
      wobjid : MTX1

    MTX1:
      type    : MUTEX
      mtxstat : TMTX_LOC
      mtxatr  : ANY_ATT_MTX_NOT_CEILING
      htskid  : TASK1
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskbpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_HIGH
