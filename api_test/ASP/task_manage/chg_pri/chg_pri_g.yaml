version: "$Id: chg_pri_g.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_chg_pri_g:
  note: 【NGKI1199】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      itskpri: TSK_PRI_MID

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TPRI_INI)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_MID
