version: "$Id: chg_pri_f-1-4.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_chg_pri_f_1_4:
  note: 【NGKI1192】【NGKI1193】【NGKI1194】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskpri: TSK_PRI_HIGH
