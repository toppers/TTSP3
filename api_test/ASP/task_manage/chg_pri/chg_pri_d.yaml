ASP_task_manage_chg_pri_d:
  note: 【NGKI1191】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: dormant

  do:
    id     : TASK1
    syscall: chg_pri(TASK2, TSK_PRI_MID)
    ercd   : E_OBJ

  post_condition:
