version: "$Id: get_tst_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_tst_a_2:
  note: 【NGKI3615】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskstat:
          type : STAT
          value: TTS_RUN

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_tst(TASK1, &tskstat)
    ercd   : E_CTX

  post_condition:
