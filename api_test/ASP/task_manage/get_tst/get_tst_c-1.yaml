version: "$Id: get_tst_c-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_tst_c_1:
  note: 【NGKI3620】【NGKI3621】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskstat:
          type: STAT

  do:
    id     : TASK1
    syscall: get_tst(TSK_SELF, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_RUN
