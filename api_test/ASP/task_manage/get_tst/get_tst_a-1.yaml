version: "$Id: get_tst_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_tst_a_1:
  note: 【NGKI3614】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        tskstat:
          type : STAT
          value: TTS_RUN

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ALM1
    syscall: get_tst(TASK1, &tskstat)
    eruint : E_CTX

  post_condition:
