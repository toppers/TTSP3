version: "$Id: get_tst_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_tst_c_2:
  note: 【NGKI3620】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskstat:
          type: STAT

    TASK2:
      type   : TASK
      tskstat: ready

  do:
    id     : TASK1
    syscall: get_tst(TASK2, &tskstat)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskstat:
          value: TTS_RDY
