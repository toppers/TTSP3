version: "$Id: act_tsk_d-1-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_act_tsk_d_1_1:
  note: 【NGKI1118】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
