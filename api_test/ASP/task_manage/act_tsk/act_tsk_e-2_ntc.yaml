version: "$Id: act_tsk_e-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_act_tsk_e_2_ai:
  note: 【NGKI3527】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      actcnt : 0

  do:
    id     : DUMMY_ALM
    syscall: act_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1

ASP_task_manage_act_tsk_e_2_ci:
  note: 【NGKI3527】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      actcnt : 0

  do:
    id     : DUMMY_CYC
    syscall: act_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1
