ASP_task_manage_act_tsk_e_1_2_2:
  note: 【NGKI3527】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      actcnt : 0

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt: 1
