version: "$Id: act_tsk_e-1-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_act_tsk_e_1_2_3:
  note: 【NGKI3527】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      actcnt : 0

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt: 1
