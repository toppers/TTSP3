version: "act_tsk_c-3 2026-06-09 (NGKI3528 TA_NOACTQUE)"
ASP_task_manage_act_tsk_c_3:
  note: 【NGKI3528】対象タスクがTA_NOACTQUE属性の場合，E_QOVRが返ること

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type    : TASK
      tskstat : ready
      noactque: true

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_QOVR

  post_condition:
    TASK2:
      tskstat: ready
      actcnt : 0
