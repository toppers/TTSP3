version: "$Id: act_tsk_d-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_manage_act_tsk_d_3:
  note: 【NGKI1118】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
