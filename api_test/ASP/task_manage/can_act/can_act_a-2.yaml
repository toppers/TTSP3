ASP_task_manage_can_act_a_2:
  note: 【NGKI1140】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: can_act(TASK2)
    eruint : E_CTX

  post_condition:
