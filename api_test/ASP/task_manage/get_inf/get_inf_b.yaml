version: "$Id: get_inf_b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_inf_b:
  note: 【NGKI1216】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      exinf  : EXINF_A
      var    :
        exinf:
          type: intptr_t

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        exinf:
          value: EXINF_A
