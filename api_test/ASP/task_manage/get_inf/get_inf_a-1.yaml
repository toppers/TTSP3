version: "$Id: get_inf_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_inf_a_1:
  note: 【NGKI1213】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        exinf:
          type : intptr_t
          value: EXINF_A

  do:
    id     : ALM1
    syscall: get_inf(&exinf)
    ercd   : E_CTX

  post_condition:
