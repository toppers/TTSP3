version: "$Id: get_pri_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_pri_a_2:
  note: 【NGKI1204】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskpri:
          type : PRI
          value: TSK_PRI_MID

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_pri(TASK1, &tskpri)
    ercd   : E_CTX

  post_condition:
