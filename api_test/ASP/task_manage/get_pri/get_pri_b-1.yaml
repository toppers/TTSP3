version: "$Id: get_pri_b-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_pri_b_1:
  note: 【NGKI1205】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        tskpri:
          type : PRI
          value: TSK_PRI_MID

  do:
    id     : TASK1
    syscall: get_pri(-1, &tskpri)
    ercd   : E_ID

  post_condition:
