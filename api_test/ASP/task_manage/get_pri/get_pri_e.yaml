version: "$Id: get_pri_e.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_manage_get_pri_e:
  note: 【NGKI1211】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        tskpri:
          type: PRI

  do:
    id     : TASK1
    syscall: get_pri(TSK_SELF, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        tskpri:
          value: TSK_PRI_MID
