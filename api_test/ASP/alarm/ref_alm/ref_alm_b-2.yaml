ASP_alarm_ref_alm_b_2:
  note: 【NGKI2575】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        ralm:
          type   : T_RALM
          almstat: ANY_ALARM_STAT
          lefttim: RELATIVE_TIME_A

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

  do:
    id     : TASK1
    syscall: ref_alm(TNUM_ALMID+1, &ralm)
    ercd   : E_ID

  post_condition:
