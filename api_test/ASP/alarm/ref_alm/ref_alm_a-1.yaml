version: "$Id: ref_alm_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_alarm_ref_alm_a_1:
  note: 【NGKI2573】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        ralm:
          type   : T_RALM
          almstat: ANY_ALARM_STAT
          lefttim: RELATIVE_TIME_A

    TASK1:
      type   : TASK
      tskstat: running

    ALM2:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

  do:
    id     : ALM1
    syscall: ref_alm(ALM2, &ralm)
    ercd   : E_CTX

  post_condition:
