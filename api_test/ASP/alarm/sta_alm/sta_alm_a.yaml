ASP_alarm_sta_alm_a:
  note: 【NGKI3899】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_CTX

  post_condition:
