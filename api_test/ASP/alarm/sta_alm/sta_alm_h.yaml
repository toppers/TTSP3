version: "$Id: sta_alm_h.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_alarm_sta_alm_h:
  note: TESRY_001

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, 1)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        lefttim: 1

    1:
      ALM1:
        lefttim: 0

    2:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
