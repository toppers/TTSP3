version: "$Id: sta_alm_f.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_alarm_sta_alm_f:
  note: TESRY_001，【NGKI2543】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STA
      hdlstat  : STP
      lefttim  : RELATIVE_TIME_A

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_B)
    ercd   : E_OK

  post_condition:
    0:
      ALM1:
        lefttim: RELATIVE_TIME_B

    RELATIVE_TIME_B:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_B+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
