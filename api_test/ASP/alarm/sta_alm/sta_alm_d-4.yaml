version: "$Id: sta_alm_d-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_alarm_sta_alm_d_4:
  note: 【NGKI2541】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type : g_intptr_t
          value: ANY_VALUE

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready
      actcnt : 1

    ALM1:
      type      : ALARM
      nfytype   : TNFY_ACTTSK
      nfy_info1 : TASK2
      enfytype  : TENFY_SETVAR
      enfy_info1: "&data"
      almstat   : TALM_STP

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition:
    0:
      ALM1:
        almstat: TALM_STA
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      TASK1:
        var:
          data:
            value: E_QOVR

      ALM1:
        almstat: TALM_STP
