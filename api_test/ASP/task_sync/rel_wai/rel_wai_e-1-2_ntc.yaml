version: "$Id: rel_wai_e-1-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_rel_wai_e_1_2_ai:
  note: 【NGKI1296】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : DUMMY_ALM
    syscall: rel_wai(TASK2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

ASP_task_sync_rel_wai_e_1_2_ci:
  note: 【NGKI1296】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : DUMMY_CYC
    syscall: rel_wai(TASK2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready
