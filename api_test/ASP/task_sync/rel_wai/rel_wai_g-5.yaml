version: "$Id: rel_wai_g-5.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_rel_wai_g_5:
  note: TESRY_003，【NGKI1296】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:

  do_0:
    id     : TASK1
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK1
    syscall: TTSP_TWAI_SEM(SEM1, WAIT_ALARM_TIME)
    ercd   : E_RLWAI

  post_condition_1:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

    SEM1:
      wtsklist:
        - TASK1:

  do_2:
    id     : ALM1
    syscall: rel_wai(TASK1)
    ercd   : E_OK

  post_condition_2:
    TASK1:
      tskstat: ready

    SEM1:
      wtsklist:

  do_3:
    id  : ALM1
    code: return

  post_condition_3:
    ALM1:
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      tskstat: running
