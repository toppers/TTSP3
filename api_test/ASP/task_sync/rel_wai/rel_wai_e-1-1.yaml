version: "$Id: rel_wai_e-1-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_rel_wai_e_1_1:
  note: 【NGKI1296】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A

  do:
    id     : TASK1
    syscall: rel_wai(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
