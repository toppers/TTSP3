version: "$Id: rel_wai_a.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_rel_wai_a:
  note: 【NGKI1290】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: rel_wai(TASK2)
    ercd   : E_CTX

  post_condition:
