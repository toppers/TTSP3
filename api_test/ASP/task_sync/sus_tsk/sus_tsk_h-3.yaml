version: "$Id: sus_tsk_h-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_sus_tsk_h_3:
  note: 【NGKI1307】【NGKI3604】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
