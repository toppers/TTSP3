version: "$Id: sus_tsk_k.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_sus_tsk_k:
  note: 【NGKI1308】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A

  do:
    id     : TASK1
    syscall: sus_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: waiting-suspended
