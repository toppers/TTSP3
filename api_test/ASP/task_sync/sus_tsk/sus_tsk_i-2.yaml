version: "$Id: sus_tsk_i-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_sus_tsk_i_2:
  note: 【NGKI1310】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

  do:
    id     : TASK1
    syscall: sus_tsk(TSK_SELF)

  post_condition:
    TASK1:
      tskstat: suspended

    TASK2:
      tskstat: running
