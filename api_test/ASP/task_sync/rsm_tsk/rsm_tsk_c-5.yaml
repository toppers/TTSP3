ASP_task_sync_rsm_tsk_c_5:
  note: 【NGKI1319】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    SEM1:
      type    : SEMAPHORE
      semcnt  : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OBJ

  post_condition:
