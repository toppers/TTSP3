version: "$Id: rsm_tsk_e-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_rsm_tsk_e_1:
  note: 【NGKI1320】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SLEEP

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: waiting
