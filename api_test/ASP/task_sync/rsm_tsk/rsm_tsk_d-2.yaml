version: "$Id: rsm_tsk_d-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_rsm_tsk_d_2:
  note: 【NGKI1320】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: suspended

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      porder: 1
