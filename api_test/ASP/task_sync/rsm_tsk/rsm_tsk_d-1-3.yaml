version: "$Id: rsm_tsk_d-1-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_rsm_tsk_d_1_3:
  note: 【NGKI1320】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: suspended

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: rsm_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready
