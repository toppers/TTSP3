version: "$Id: wup_tsk_f-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_wup_tsk_f_1_2:
  note: 【NGKI1271】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : SLEEP
      wupcnt : 0

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      porder : 2

    TASK3:
      porder: 1
