version: "wb-2026-06-08"
ASP_task_sync_wup_tsk_W_c:
  # target_branch: kernel/task_sync.c:210  CHECK_UNL() = if(sense_lock()) の T側（br[0]）
  # wup_tsk_a（CPUロック→E_CTX）と同等だが，a を含む auto_code グループが
  # タイムアウトし br[0] が未到達のため，バックアップとして追加．
  note: 【NGKI1265 / ASP3 3.7.2】CPUロック状態で呼び出してE_CTXが返ること（CHECK_UNL sense_lock()=T 経路）

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_CTX

  post_condition:
