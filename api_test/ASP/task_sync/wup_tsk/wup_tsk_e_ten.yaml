version: "$Id: wup_tsk_e_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_wup_tsk_e_at:
  note: 【NGKI1273】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_WUPTSK
      nfy_info1: TASK1
      almstat  : TALM_STP

    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        wupcnt: 1

