version: "$Id: wup_tsk_f-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_wup_tsk_f_2:
  note: 【NGKI1271】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : SLEEP
      wupcnt : 0

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
