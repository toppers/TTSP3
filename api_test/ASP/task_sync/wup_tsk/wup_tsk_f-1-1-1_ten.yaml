ASP_task_sync_wup_tsk_f_1_1_1_at:
  note: 【NGKI1271】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_WUPTSK
      nfy_info1: TASK2
      almstat  : TALM_STP

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : SLEEP
      wupcnt : 0

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK1:
        tskstat: ready

      TASK2:
        tskstat: running

