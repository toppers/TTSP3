version: "$Id: wup_tsk_b-3.yaml 2026-06-08 honda $"
ASP_task_sync_wup_tsk_b_3:
  note: 【NGKI1267】【NGKI1275】非タスクコンテキストからTSK_SELFを指定した時にE_IDが返ること

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : DUMMY_ALM
    syscall: wup_tsk(TSK_SELF)
    ercd   : E_ID

  post_condition:
