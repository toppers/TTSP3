version: "$Id: wup_tsk_f-1-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_wup_tsk_f_1_3:
  note: 【NGKI1271】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SLEEP
      wupcnt : 0

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
