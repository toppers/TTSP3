version: "wb-2026-06-08"
ASP_task_sync_wup_tsk_W_a:
  # target_branch: kernel/task_sync.c:211  if (tskid == TSK_SELF && !sense_context())
  #   の !sense_context() = false 側（非タスクコンテキストから TSK_SELF を指定）
  note: 【NGKI1267 / ASP3 3.7.2】非タスクコンテキストからTSK_SELFを指定して呼び出すと，NGKI1275（TSK_SELFはタスクコンテキスト限定）の適用外となり，VALID_TSKID(TSK_SELF=0)が有効範囲外となってE_IDが返ること

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : DUMMY_ALM
    syscall: wup_tsk(TSK_SELF)
    ercd   : E_ID

  post_condition:
