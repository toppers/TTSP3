version: "$Id: slp_tsk_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_slp_tsk_d:
  note: 【NGKI1272】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

  do_0:
    id     : TASK2
    syscall: slp_tsk()
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : SLEEP

  do_1:
    id     : TASK1
    syscall: TTSP_WUP_TSK(TASK2)

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
