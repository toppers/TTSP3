version: "$Id: slp_tsk_g-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_slp_tsk_g_2:
  note: 【NGKI1260】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

  do:
    id     : TASK1
    syscall: slp_tsk()

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SLEEP
      wupcnt : 0

    TASK2:
      tskstat: running
