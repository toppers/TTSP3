version: "wb-2026-06-08"
ASP_task_sync_slp_tsk_W_a:
  # target_branch: kernel/task_sync.c:134 if(p_runtsk->raster)→T
  #   (タスク終了要求フラグがセットされた状態 かつ 起床要求キューイング数が1 が同時成立)
  note: 【NGKI3455優先 / ASP3 3.7.2】タスク終了要求フラグがセットされた状態で起床要求キューイング数が1のとき，NGKI3455がNGKI1259より優先してE_RASTERを返し，起床要求キューイング数を消費しないこと

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      wupcnt : 1

  do:
    id     : TASK1
    syscall: slp_tsk()
    ercd   : E_RASTER

  post_condition:
    TASK1:
      wupcnt: 1
