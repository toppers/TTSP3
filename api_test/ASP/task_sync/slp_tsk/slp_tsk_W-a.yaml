version: "wb-2026-06-08"
ASP_task_sync_slp_tsk_W_a:
  # target_branch: kernel/task_sync.c:134 if(p_runtsk->raster)→T (raster=T かつ wupcnt=1 同時成立)
  note: 【NGKI3455優先】raster=T のとき wupcnt=1 があっても NGKI1259(wupque消費)より優先して E_RASTER を返し wupcnt を消費しないこと

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      wupcnt : 1

  do:
    id     : TASK1
    syscall: slp_tsk()
    ercd   : E_RASTER

  post_condition:
    TASK1:
      wupcnt: 1
