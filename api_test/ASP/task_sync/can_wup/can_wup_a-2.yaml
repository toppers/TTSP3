version: "$Id: can_wup_a-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_can_wup_a_2:
  note: 【NGKI1278】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: can_wup(TASK2)
    eruint : E_CTX

  post_condition:
