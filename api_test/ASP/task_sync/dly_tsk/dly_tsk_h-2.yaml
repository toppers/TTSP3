version: "$Id: dly_tsk_h-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_h_2:
  note: 【NGKI1353】【NGKI1354】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

  do:
    id     : TASK1
    syscall: dly_tsk(RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: RELATIVE_TIME_A

      TASK2:
        tskstat: running

    RELATIVE_TIME_A:
      TASK1:
        lefttmo: 0

    RELATIVE_TIME_A+1:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
