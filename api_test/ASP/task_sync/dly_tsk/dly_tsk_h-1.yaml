version: "$Id: dly_tsk_h-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_h_1:
  note: TESRY_014，【NGKI1353】【NGKI1354】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

  do_0:
    0:
      id     : TASK1
      syscall: dly_tsk(RELATIVE_TIME_A)
      ercd   : E_OK

  post_condition_0:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: RELATIVE_TIME_A

      TASK2:
        tskstat: running

    RELATIVE_TIME_A:
      TASK1:
        lefttmo: 0

    RELATIVE_TIME_A+1:
      TASK1:
        tskstat: ready

  do_1:
    RELATIVE_TIME_A+1:
      id     : TASK2
      syscall: slp_tsk()

  post_condition_1:
    RELATIVE_TIME_A+1:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: waiting
        wobjid : SLEEP
