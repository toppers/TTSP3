version: "$Id: dly_tsk_f.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_f:
  note: 【NGKI1353】【NGKI1354】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

  do:
    id     : TASK1
    syscall: dly_tsk(0)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: 0

      TASK2:
        tskstat: running

    1:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
