version: "$Id: tslp_tsk_k.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_sync_tslp_tsk_k:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

  do:
    id     : TASK1
    syscall: tslp_tsk(TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : SLEEP

      TASK2:
        tskstat: running

    FOREVER_TIME:
