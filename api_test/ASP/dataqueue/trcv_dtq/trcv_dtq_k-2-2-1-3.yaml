version: "$Id: trcv_dtq_k-2-2-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_k_2_2_1_3:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_data:
          value: DATA_A

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:
