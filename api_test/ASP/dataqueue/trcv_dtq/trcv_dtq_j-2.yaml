version: "$Id: trcv_dtq_j-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_j_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type: intptr_t

    DTQ1:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DTQ1

      DTQ1:
        rtsklist:
          - TASK1:

    FOREVER_TIME:
