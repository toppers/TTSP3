version: "$Id: trcv_dtq_k-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_k_1_1_1:
  note: 【NGKI3421】【NGKI1766】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      datalist:
        - data: DATA_A

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_data:
          value: DATA_A

    DTQ1:
      datalist:
