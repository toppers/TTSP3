version: "$Id: trcv_dtq_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_d:
  note: 【NGKI3460】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      var    :
        p_data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, ANY_ELAPSED_TIME)
    ercd   : E_RASTER

  post_condition:
