version: "$Id: trcv_dtq_a-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_a_3:
  note: 【NGKI1756】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type: DATAQUEUE

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, ANY_ELAPSED_TIME)
    ercd   : E_CTX

  post_condition:
