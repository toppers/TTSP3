version: "$Id: trcv_dtq_h-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_h_4:
  note: 【NGKI1748】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 1

  do_0:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1
      lefttmo: ANY_ELAPSED_TIME

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_FSND_DTQ(DTQ1, DATA_A)

  post_condition_1:
    TASK1:
      tskstat: running
      var    :
        data:
          value: DATA_A

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
