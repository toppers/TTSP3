version: "$Id: trcv_dtq_k-2-2-2-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_k_2_2_2_4:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1

    TASK3:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &data, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_A

    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
        - TASK3:
            data: DATA_B
