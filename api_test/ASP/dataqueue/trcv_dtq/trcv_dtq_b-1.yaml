ASP_dataqueue_trcv_dtq_b_1:
  note: 【NGKI1758】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: trcv_dtq(0, &p_data, ANY_ELAPSED_TIME)
    ercd   : E_ID

  post_condition:
