version: "$Id: trcv_dtq_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_trcv_dtq_c:
  note: 【NGKI1759】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: trcv_dtq(DTQ1, &p_data, TMO_FEVR-1)
    ercd   : E_PAR

  post_condition:
