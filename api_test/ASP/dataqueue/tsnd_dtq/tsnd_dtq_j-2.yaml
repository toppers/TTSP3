version: "$Id: tsnd_dtq_j-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_tsnd_dtq_j_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
      rtsklist:
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, TMO_FEVR)

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DTQ1

      DTQ1:
        stsklist:
          - TASK1:
              data: DATA_A

    FOREVER_TIME:
