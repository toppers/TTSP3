ASP_dataqueue_tsnd_dtq_i_1:
  note: 【NGKI1736】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, TMO_POL)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
