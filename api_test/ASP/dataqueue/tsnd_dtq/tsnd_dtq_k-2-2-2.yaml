version: "$Id: tsnd_dtq_k-2-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_tsnd_dtq_k_2_2_2:
  note: 【NGKI1736】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_C, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C
