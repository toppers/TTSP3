version: "$Id: tsnd_dtq_k-1-2-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_tsnd_dtq_k_1_2_1:
  note: 【NGKI1734】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: data
        - TASK3:
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        data:
          value: DATA_A

    DTQ1:
      rtsklist:
        - TASK3:
