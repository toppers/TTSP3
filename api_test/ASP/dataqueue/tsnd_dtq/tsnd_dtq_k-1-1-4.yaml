version: "$Id: tsnd_dtq_k-1-1-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_tsnd_dtq_k_1_1_4:
  note: 【NGKI1734】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting-suspended
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
            var: data
      datalist:

  do:
    id     : TASK1
    syscall: tsnd_dtq(DTQ1, DATA_A, ANY_ELAPSED_TIME)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
      wobjid :

    DTQ1:
      rtsklist:
