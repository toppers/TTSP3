version: "$Id: fsnd_dtq_e-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_fsnd_dtq_e_1_2:
  note: 【NGKI1750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C

  do:
    id     : TASK1
    syscall: fsnd_dtq(DTQ1, DATA_D)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D
