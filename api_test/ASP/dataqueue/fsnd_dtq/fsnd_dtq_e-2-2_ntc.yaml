version: "$Id: fsnd_dtq_e-2-2_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_fsnd_dtq_e_2_2_ai:
  note: 【NGKI1749】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B

  do:
    id     : DUMMY_ALM
    syscall: fsnd_dtq(DTQ1, DATA_C)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C

ASP_dataqueue_fsnd_dtq_e_2_2_ci:
  note: 【NGKI1749】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B

  do:
    id     : DUMMY_CYC
    syscall: fsnd_dtq(DTQ1, DATA_C)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C
