version: "$Id: rcv_dtq_i-2-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_i_2_1_1:
  note: 【NGKI3421】【NGKI1769】【NGKI3422】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
      datalist:
