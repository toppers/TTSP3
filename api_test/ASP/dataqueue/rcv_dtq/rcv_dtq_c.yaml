ASP_dataqueue_rcv_dtq_c:
  note: 【NGKI3460】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true
      var    :
        data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_RASTER

  post_condition:
