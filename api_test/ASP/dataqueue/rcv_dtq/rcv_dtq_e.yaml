version: "$Id: rcv_dtq_e.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_e:
  note: 【NGKI3460】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      dister : true
      var    :
        data:
          type : intptr_t
          value: DATA_A

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 0

  do_0:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_RASTER

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_RAS_TER(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running
      raster : true

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
