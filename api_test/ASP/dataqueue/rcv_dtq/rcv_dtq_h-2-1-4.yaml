version: "$Id: rcv_dtq_h-2-1-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_h_2_1_4:
  note: 【NGKI3421】【NGKI1766】【NGKI1767】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      stsklist:
        - TASK2:
            data: DATA_A
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: DATA_B

    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_A
