version: "$Id: rcv_dtq_h-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_h_1_2:
  note: 【NGKI3421】【NGKI1766】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      datalist:
        - data: DATA_A
        - data: DATA_B

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running
      var    :
        data:
          value: DATA_A

    DTQ1:
      datalist:
        - data: DATA_B
