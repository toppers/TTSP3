version: "$Id: rcv_dtq_g-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_g_2:
  note: 【NGKI1735】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 1

  do_0:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
        - TASK1:
            var: data

  do_1:
    id     : TASK2
    syscall: TTSP_PSND_DTQ(DTQ1, DATA_A)

  post_condition_1:
    TASK1:
      tskstat: running
      var    :
        data:
          value: DATA_A

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
