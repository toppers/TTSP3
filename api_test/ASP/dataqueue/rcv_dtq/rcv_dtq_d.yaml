version: "$Id: rcv_dtq_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_d:
  note: 【NGKI1764】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      var    :
        data:
          type : intptr_t
          value: DATA_A

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    DTQ1:
      type  : DATAQUEUE
      dtqcnt: 0

  do_0:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
        - TASK1:

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
