version: "$Id: psnd_dtq_e-2_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_e_2_at:
  note: 【NGKI1736】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SNDDTQ
      nfy_info1: DTQ1
      nfy_info2: DATA_A
      almstat  : TALM_STP

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_B
        - data: DATA_C

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      DTQ1:
        datalist:
          - data: DATA_B
          - data: DATA_C
          - data: DATA_A

