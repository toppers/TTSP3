      rtsklist:
        - TASK2:
            var: data
      datalist:

  do_0:
    id     : DUMMY_CYC
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:

  do_1:
    id  : DUMMY_CYC
    code: return

  post_condition_1:
    DUMMY_CYC:
