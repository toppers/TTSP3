version: "$Id: psnd_dtq_d-2-1-2_ten.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_d_2_1_2_at:
  note: 【NGKI1734】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_SNDDTQ
      nfy_info1: DTQ1
      nfy_info2: DATA_A
      almstat  : TALM_STP

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
        - TASK2:
            var: data
        - TASK3:
      datalist:

  do:
    id     : TASK1
    syscall: TTSP_STA_ALM(DUMMY_ALM, 0)
    ercd   : E_OK

  post_condition:
    0:
      DUMMY_ALM:
        almstat: TALM_STA

    1:
      DUMMY_ALM:
        almstat: TALM_STP

      TASK2:
        tskstat: ready

      DTQ1:
        rtsklist:
          - TASK3:

