version: "$Id: psnd_dtq_c_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_c_ai:
  note: 【NGKI1731】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
      datalist:

  do:
    id     : DUMMY_ALM
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_TMOUT

  post_condition:

ASP_dataqueue_psnd_dtq_c_ci:
  note: 【NGKI1731】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
      datalist:

  do:
    id     : DUMMY_CYC
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_TMOUT

  post_condition:
