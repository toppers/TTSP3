version: "$Id: psnd_dtq_d-1-4_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_psnd_dtq_d_1_4_ai:
  note: 【NGKI1734】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting-suspended
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
            var: data
      datalist:

  do:
    id     : DUMMY_ALM
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
      wobjid :

    DTQ1:
      rtsklist:

ASP_dataqueue_psnd_dtq_d_1_4_ci:
  note: 【NGKI1734】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting-suspended
      wobjid : DTQ1
      var    :
        data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
            var: data
      datalist:

  do:
    id     : DUMMY_CYC
    syscall: psnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended
      wobjid :

    DTQ1:
      rtsklist:
