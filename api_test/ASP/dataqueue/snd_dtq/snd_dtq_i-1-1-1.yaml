version: "$Id: snd_dtq_i-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_i_1_1_1:
  note: 【NGKI1737】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_NULL
      dtqcnt  : 0
      stsklist:
      datalist:

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A
