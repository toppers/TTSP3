version: "$Id: snd_dtq_i-1-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_i_1_1_3:
  note: 【NGKI1737】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1

    TASK3:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_NULL
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B
      datalist:

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_C)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      stsklist:
        - TASK2:
            data: DATA_A
        - TASK3:
            data: DATA_B
        - TASK1:
            data: DATA_C
