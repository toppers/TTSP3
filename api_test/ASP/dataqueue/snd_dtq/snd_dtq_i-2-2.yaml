version: "$Id: snd_dtq_i-2-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_i_2_2:
  note: 【NGKI1736】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 3
      rtsklist:
      datalist:
        - data: DATA_A
        - data: DATA_B

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_C)
    ercd   : E_OK

  post_condition:
    DTQ1:
      datalist:
        - data: DATA_A
        - data: DATA_B
        - data: DATA_C
