version: "$Id: snd_dtq_d.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_d:
  note: 【NGKI1732】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:

  do_0:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)
    ercd   : E_RLWAI

  post_condition_0:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
        - TASK1:
            data: DATA_A

  do_1:
    id     : TASK2
    syscall: TTSP_REL_WAI(TASK1)

  post_condition_1:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    DTQ1:
      stsklist:
