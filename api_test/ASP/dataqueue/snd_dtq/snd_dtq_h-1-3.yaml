version: "$Id: snd_dtq_h-1-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_h_1_3:
  note: 【NGKI1734】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
            var: ttg_data

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist:
