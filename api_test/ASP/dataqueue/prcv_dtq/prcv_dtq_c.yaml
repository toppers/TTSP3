version: "$Id: prcv_dtq_c.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_prcv_dtq_c:
  note: 【NGKI1763】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_data:
          type : intptr_t
          value: DATA_A

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:

  do:
    id     : TASK1
    syscall: prcv_dtq(DTQ1, &p_data)
    ercd   : E_TMOUT

  post_condition:
