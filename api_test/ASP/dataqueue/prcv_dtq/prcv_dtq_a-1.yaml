version: "$Id: prcv_dtq_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_prcv_dtq_a_1:
  note: 【NGKI1754】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_data:
          type : intptr_t
          value: DATA_A

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type: DATAQUEUE

  do:
    id     : ALM1
    syscall: prcv_dtq(DTQ1, &p_data)
    ercd   : E_CTX

  post_condition:
