version: "$Id: ini_dtq_c-1-4.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_ini_dtq_c_1_4:
  note: 【NGKI1778】【NGKI1779】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting-suspended
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
        - TASK2:
            data: DATA_A

  do:
    id     : TASK1
    syscall: ini_dtq(DTQ1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: suspended

    DTQ1:
      stsklist:
