version: "$Id: ini_dtq_d-1-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_ini_dtq_d_1_1_1:
  note: 【NGKI1778】【NGKI1779】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_dtq(DTQ1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    DTQ1:
      rtsklist:
