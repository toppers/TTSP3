version: "$Id: ref_dtq_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_ref_dtq_a_2:
  note: 【NGKI1783】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rdtq:
          type   : T_RDTQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          sdtqcnt: ANY_DATA_CNT

    DTQ1:
      type: DATAQUEUE

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_CTX

  post_condition:
