version: "$Id: ref_dtq_c-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_ref_dtq_c_2:
  note: 【NGKI1788】【NGKI1790】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        rdtq:
          type: T_RDTQ

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
      datalist:

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rdtq:
          stskid : TSK_NONE
          rtskid : TASK2
          sdtqcnt: 0
