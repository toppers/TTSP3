version: "$Id: ref_dtq_a-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_dataqueue_ref_dtq_a_1:
  note: 【NGKI1782】

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        rdtq:
          type   : T_RDTQ
          stskid : ANY_OBJECT_ID
          rtskid : ANY_OBJECT_ID
          sdtqcnt: ANY_DATA_CNT

    TASK1:
      type   : TASK
      tskstat: running

    DTQ1:
      type: DATAQUEUE

  do:
    id     : ALM1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_CTX

  post_condition:
