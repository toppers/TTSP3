version: "$Id: ter_tsk_f-6-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_term_ter_tsk_f_6_2:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      tskstat: suspended
      actcnt : 1
      wupcnt : 1

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      tskpri : TSK_PRI_LOW
      actcnt : 0
      wupcnt : 0
      bootcnt: 1
