version: "$Id: ter_tsk_f-8-1-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_term_ter_tsk_f_8_1_1:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_LOW

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      tskstat: waiting-suspended
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A
      actcnt : 1
      wupcnt : 1

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
      actcnt : 0
      wupcnt : 0
      bootcnt: 1
