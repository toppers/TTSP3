version: "$Id: ter_tsk_f-2-1-1.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_term_ter_tsk_f_2_1_1:
  note: 【NGKI3450】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_LOW

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SLEEP
      actcnt : 1

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
      actcnt : 0
      bootcnt: 1
