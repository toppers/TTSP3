version: "$Id: ext_tsk_b-2-2.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_term_ext_tsk_b_2_2:
  note: 【NGKI3449】【NGKI1169】【NGKI1168】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      actcnt : 1
      wupcnt : 1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_LOW

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskpri : TSK_PRI_HIGH
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

    CPU_STATE:
      loc_cpu: false
