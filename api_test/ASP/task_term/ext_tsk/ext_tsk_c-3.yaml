version: "$Id: ext_tsk_c-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_term_ext_tsk_c_3:
  note: 【NGKI1168】【NGKI1169】【NGKI3449】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskstat: dormant

    CPU_STATE:
      chg_ipm: TIPM_ENAALL
