version: "$Id: ext_tsk_b-1-3.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_task_term_ext_tsk_b_1_3:
  note: 【NGKI3449】【NGKI1169】【NGKI1168】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      itskpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID
      actcnt : 1
      wupcnt : 1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskstat: ready
      tskpri : TSK_PRI_LOW
      actcnt : 0
      wupcnt : 0
      bootcnt: 1

    TASK2:
      tskstat: running

    CPU_STATE:
      chg_ipm: TIPM_ENAALL
