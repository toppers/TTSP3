version: "$Id: sns_ter_b-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_task_term_sns_ter_b_3:
  note: 【NGKI3496】
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : STP

    TASK1:
      type   : TASK
      tskstat: running

  do_0:
    id     : TASK1
    syscall: TTSP_STA_ALM(ALM1, ACTIVATE_ALARM_TIME)
    ercd   : E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA

  do_1:
    id     : TASK1
    syscall: dly_tsk(WAIT_ALARM_TIME)
    ercd   : E_RLWAI

  post_condition_1:
    TASK1:
      tskstat: waiting
      wobjid : DELAY

    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

  do_2:
    id     : ALM1
    syscall: sns_ter()
    bool   : true

  post_condition_2:

  do_3:
    id     : ALM1
    syscall: rel_wai(TASK1)
    ercd   : E_OK

  post_condition_3:
    TASK1:
      tskstat: ready

  do_4:
    id  : ALM1
    code: return

  post_condition_4:
    ALM1:
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      tskstat: running
