version: "bb-2026-06-09"
ASP_task_term_ras_ter_g:
  note: 【NGKI3477】タスク終了許可状態の対象タスクに対してras_terを呼び出した場合，対象タスクの起動要求がキューイングされており（actcnt=1），かつ再起動後の初期優先度が呼出しタスクより高い場合，ras_terのリターン前にディスパッチが発生し，呼出しタスクが実行可能状態に遷移すること

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_LOW

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SLEEP
      actcnt : 1

  do:
    id     : TASK1
    syscall: ras_ter(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
      actcnt : 0
      bootcnt: 1
