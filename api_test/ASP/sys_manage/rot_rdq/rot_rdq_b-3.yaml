version: "$Id: rot_rdq_b-3.yaml 2026-06-08 honda $"
ASP_sys_manage_rot_rdq_b_3:
  note: 【NGKI2685】【NGKI2689】非タスクコンテキストからTPRI_SELFを指定した時にE_PARが返ること

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : DUMMY_ALM
    syscall: rot_rdq(TPRI_SELF)
    ercd   : E_PAR

  post_condition:
