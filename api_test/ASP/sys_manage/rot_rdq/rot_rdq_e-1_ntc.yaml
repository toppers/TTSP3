version: "$Id: rot_rdq_e-1_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_rot_rdq_e_1_ai:
  note: 【NGKI2688】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1

  do:
    id     : DUMMY_ALM
    syscall: rot_rdq(TSK_PRI_MID)
    ercd   : E_OK

  post_condition:

ASP_sys_manage_rot_rdq_e_1_ci:
  note: 【NGKI2688】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1

  do:
    id     : DUMMY_CYC
    syscall: rot_rdq(TSK_PRI_MID)
    ercd   : E_OK

  post_condition:
