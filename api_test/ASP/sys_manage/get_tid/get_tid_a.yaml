version: "$Id: get_tid_a.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_tid_a:
  note: 【NGKI2707】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_tskid:
          type : ID
          value: ANY_OBJECT_ID

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_CTX

  post_condition:
