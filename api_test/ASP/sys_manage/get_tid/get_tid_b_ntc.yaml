version: "$Id: get_tid_b_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_tid_b_ai:
  note: 【NGKI2709】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE
      var      :
        p_tskid:
          type: ID

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : DUMMY_ALM
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    DUMMY_ALM:
      var:
        p_tskid:
          value: TASK1

ASP_sys_manage_get_tid_b_ci:
  note: 【NGKI2709】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE
      var      :
        p_tskid:
          type: ID

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : DUMMY_CYC
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    DUMMY_CYC:
      var:
        p_tskid:
          value: TASK1
