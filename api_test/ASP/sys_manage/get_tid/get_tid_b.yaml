version: "$Id: get_tid_b.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_tid_b:
  note: 【NGKI2709】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        p_tskid:
          type: ID

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
