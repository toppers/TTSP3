version: "$Id: get_nth_c-2-3.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_nth_c_2_3:
  note: 【NGKI3647】【NGKI3648】【NGKI3650】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 1
      var    :
        p_tskid:
          type: ID

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 2

  do:
    id     : TASK1
    syscall: get_nth(TPRI_SELF, 2, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TSK_NONE
