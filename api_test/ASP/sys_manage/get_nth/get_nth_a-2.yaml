version: "$Id: get_nth_a-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_nth_a_2:
  note: 【NGKI3643】

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      porder : 1
      var    :
        p_tskid:
          type: ID

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_nth(TSK_PRI_MID, 0, &p_tskid)
    ercd   : E_CTX

  post_condition:
