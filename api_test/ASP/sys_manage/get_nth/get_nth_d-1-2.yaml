version: "$Id: get_nth_d-1-2.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_get_nth_d_1_2:
  note: 【NGKI3647】【NGKI3648】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      porder : 1
      var    :
        p_tskid:
          type: ID

  do:
    id     : TASK1
    syscall: get_nth(TSK_PRI_MID, 1, &p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TSK_NONE
