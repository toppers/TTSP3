version: "$Id: loc_cpu_a.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_sys_manage_loc_cpu_a:
  note: 【NGKI2730】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do:
    id     : TASK1
    syscall: loc_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      loc_cpu: true
