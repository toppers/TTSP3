version: "$Id: dis_dsp_b.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_sys_manage_dis_dsp_b:
  note: 【NGKI2744】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: false

  do:
    id     : TASK1
    syscall: dis_dsp()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      dis_dsp: true
