version: "bb-2026-06-08"
ASP_sys_manage_ena_dsp_b_3:
  note: 【NGKI2750】割込み優先度マスクが全解除でない状態でena_dspを呼び出すとディスパッチ禁止フラグはクリアされるが，ディスパッチは起動されないこと

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_HIGH

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true
      chg_ipm: ANY_IPM

  do:
    id     : TASK1
    syscall: ena_dsp()
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: ready

    CPU_STATE:
      dis_dsp: false
