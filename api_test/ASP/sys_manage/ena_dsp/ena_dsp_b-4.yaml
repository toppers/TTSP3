version: "bb-2026-06-08"
ASP_sys_manage_ena_dsp_b_4:
  note: 【NGKI2750 補足説明】タスク終了処理要求フラグがセットされており，タスク終了許可状態の場合，ena_dspからリターンせず自タスクが終了すること（dister=T+raster=T→dis_dsp→ena_ter(dspflg=F→E_OK)→ena_dsp→終了）

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      dister : true
      raster : true

  do_0:
    id     : TASK1
    syscall: dis_dsp()
    ercd   : E_OK

  post_condition_0:
    TASK1:
      tskstat: running

  do_1:
    id     : TASK1
    syscall: ena_ter()
    ercd   : E_OK

  post_condition_1:
    TASK1:
      dister: false

  do_2:
    id     : TASK1
    syscall: ena_dsp()

  post_condition_2:
    TASK1:
      tskstat: dormant
