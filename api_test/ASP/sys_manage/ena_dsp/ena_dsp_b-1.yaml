version: "$Id: ena_dsp_b-1.yaml 64 2019-12-20 01:33:52Z fujisft-shigihara $"
ASP_sys_manage_ena_dsp_b_1:
  note: 【NGKI2750】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID

    CPU_STATE:
      type   : CPU_STATE
      dis_dsp: true

  do:
    id     : TASK1
    syscall: ena_dsp()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      dis_dsp: false
