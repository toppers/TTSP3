version: "$Id: unl_cpu_a_ntc.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_sys_manage_unl_cpu_a_ai:
  note: 【NGKI2737】

  pre_condition:
    DUMMY_ALM:
      type     : ALARM
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      almstat  : TALM_STP
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : DUMMY_ALM
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      loc_cpu: false

ASP_sys_manage_unl_cpu_a_ci:
  note: 【NGKI2737】

  pre_condition:
    DUMMY_CYC:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      cycphs   : RELATIVE_TIME_A
      cyctim   : RELATIVE_TIME_B*2
      hdlstat  : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : DUMMY_CYC
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition:
    CPU_STATE:
      loc_cpu: false
