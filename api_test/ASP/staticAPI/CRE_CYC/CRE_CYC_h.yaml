version: "$Id: CRE_CYC_h.yaml 73 2020-03-19 08:19:39Z fujisft-shigihara $"
ASP_staticAPI_CRE_CYC_h:
  note: 【NGKI2400】

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type     : CYCLE
      nfytype  : TNFY_HANDLER
      nfy_info1: EXINF_A
      cycstat  : TCYC_STA
      hdlstat  : STP
      cyctim   : RELATIVE_TIME_A
      cycphs   : RELATIVE_TIME_A+1

  do:
    id     : TASK1
    syscall: TTSP_STA_CYC(CYC1)
    ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: STP

    RELATIVE_TIME_A+1+(RELATIVE_TIME_A*0)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 0

    RELATIVE_TIME_A+1+(RELATIVE_TIME_A*1)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 1

    RELATIVE_TIME_A+1+(RELATIVE_TIME_A*2)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 2

    RELATIVE_TIME_A+1+(RELATIVE_TIME_A*3)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 3

    RELATIVE_TIME_A+1+(RELATIVE_TIME_A*4)+1:
      CYC1:
        cycstat: TCYC_STA
        hdlstat: ACTIVATE
        bootcnt: 4
