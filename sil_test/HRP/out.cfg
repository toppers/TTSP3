/*
 * 【TTSP3向け改変 2026-06-14】include 規約を TTSP3 の API テスト生成cfg に合わせた
 * （旧: target_timer.cfg / syssvc/syslog.cfg / syssvc/serial.cfg を直 INCLUDE）．
 * tecsgen.cfg＋ttsp_target.cfg がタイマ・シリアル・syslog 等を提供する．
 */
/* 【TTSP3向け改変 2026-06-14・HRP版】保護カーネル対応：ttsp_svc.cfg 追加，静的APIを
 * ttsp_obj_head.cfg/ttsp_obj_tail.cfg で囲む（後者がテストオブジェクトの ATT_MOD ドメイン割当を
 * 行う＝HRP のリンカスクリプト生成に必須）．MAIN_TASK は SAC_TSK(SHARED)．詳細は docs/SIL_TEST.md． */
INCLUDE("tecsgen.cfg");
INCLUDE("ttsp_svc.cfg");
INCLUDE("ttsp_target.cfg");
#include "out.h"

/* 【TTSP3向け改変 2026-06-14・HRP版】ユーザドメインタスクのスタック（ttg_ustack）が置かれる
 * .ttg_stack_section をメモリ領域に配置（無いとリンカが discard し ttg_ustack 未解決になる）． */
ATT_SEC(".ttg_stack_section", {TA_NOWRITE|TA_NOREAD, TTSP_STANDARD_RAM_REGION});

INCLUDE("ttsp_obj_head.cfg");	/* KERNEL_DOMAIN { を開く */
	CRE_TSK(MAIN_TASK, {TA_ACT, 0, main_task, 1, TTSP_TASK_STACK_SIZE, NULL});
	SAC_TSK(MAIN_TASK, {TACP_SHARED, TACP_SHARED, TACP_SHARED, TACP_SHARED});
	/* DEF_TEX は第3世代カーネルにタスク例外機能が無いため削除． */

	/* 3.7 のタイムイベント通知書式（{TNFY_HANDLER, exinf, hdr} 入れ子）／RELTIM µs 単位（cyctim 100ms）． */
	CRE_ALM(ALM, {TA_NULL, {TNFY_HANDLER, 0, almhdr}});
	CRE_CYC(CYC, {TA_NULL, {TNFY_HANDLER, 0, cychdr}, 100000, 100000});

	DEF_EXC(TTSP_EXCNO_A, {TA_NULL, exchdr});

	ATT_INI({TA_NULL, 0, inirtn});
	ATT_TER({TA_NULL, 0, terrtn});

	CFG_INT(TTSP_INTNO_A, {TA_ENAINT, TTSP_GE_TIMER_INTPRI});
	DEF_INH(TTSP_INHNO_A, {TA_NULL, inthdr_for_int_test});

#ifdef TTSP_INTNO_B
	CFG_INT(TTSP_INTNO_B, {TA_ENAINT, TTSP_MID_INTPRI});
	DEF_INH(TTSP_INHNO_B, {TA_NULL, inthdr});
#endif /* TTSP_INTNO_B */
INCLUDE("ttsp_obj_tail.cfg");	/* } 閉じ＋テストオブジェクトの ATT_MOD（ドメイン割当） */

/* 【TTSP3向け改変 2026-06-14・HRP版】ユーザドメイン(DOM1)からの SIL アクセステスト．
 * sil_user_task はユーザドメインで実行され、自タスクスタック上の変数に対する SIL メモリ
 * アクセス・sns_ker・sil_dly_nse を発行する（ユーザドメインで許可される SIL 操作の確認）． */
DOMAIN(DOM1) {
	CRE_TSK(SIL_USER_TASK, {TA_NULL, 0, sil_user_task, 2, TTSP_TASK_STACK_SIZE, &ttg_ustack[DOM1 - 1][0][0], TTSP_TASK_STACK_SIZE, &ttg_sstack[0][0]});
	SAC_TSK(SIL_USER_TASK, {TACP_SHARED, TACP_SHARED, TACP_SHARED, TACP_SHARED});
}

/* 【TTSP3向け改変 2026-06-14】ISR（ATT_ISR）文脈の SIL テストは物理的に除去した．
 * 理由(1) 標準 ASP3 zybo_z7_gcc は DEF_INH モデルで ATT_ISR 非対応（cfg api 表に無い）．
 * 理由(2) cfg.rb の静的API抽出は #ifdef を解釈しないため #ifdef ガードでは除外できない．
 * ATT_ISR 対応ターゲットへ展開する際は，本ブロックと out.c の ISR サブテストを復活させること．
 * 旧: CFG_INT(TTSP_INTNO_C, {TA_ENAINT, TTSP_MID_INTPRI}); ATT_ISR({TA_NULL, 0, TTSP_INTNO_C, isr, 1}); */

