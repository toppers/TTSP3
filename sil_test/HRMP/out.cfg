/* 4つのうち1つのみ使用される */
/* 【TTSP3向け改変 2026-06-14・HRMP版】ATT_INI(ttsp_test_lib_init) は KERNEL_DOMAIN 内に置く． */
KERNEL_DOMAIN {
	ATT_INI({TA_NULL, 0, ttsp_test_lib_init});
}

/* 【TTSP3向け改変 2026-06-14・HRMP版】テストオブジェクトのドメイン割当（ttsp_obj_tail.cfg 相当）． */

KERNEL_DOMAIN {
	ATT_MOD("ttsp_mem_obj_kernel1.o");
	ATT_MOD("ttsp_mem_obj_kernel2.o");
}
ATT_MOD("out.o");
ATT_MOD("ttsp_test_lib.o");
ATT_MOD("ttsp_target_test.o");
ATT_MOD("ttsp_mem_obj_user1.o");
ATT_MOD("ttsp_mem_obj_user2.o");
ATT_MOD("log_output.o");
ATT_MOD("vasyslog.o");
ATT_MOD("t_perror.o");
ATT_MOD("strerror.o");
ATT_MOD("libc.a");
/* GCOV計装ビルド用. 非GCOV時は未リンクで無害（ldがパターン無マッチ）. */
ATT_MOD("libgcov.a");
ATT_MOD("librdimon.a");

/* 【TTSP3向け改変 2026-06-14・HRMP版】ユーザドメイン(DOM1)からの SIL アクセステスト．
 * HRMP は CLASS×DOMAIN ネスト＋per-PE スタック（ttg_ustack_prc1/ttg_sstack_prc1）が必要．
 * sil_user_task は CLS_ALL_PRC1（PE1）の DOM1 で実行され、SIL メモリアクセス・SIL_LOC_INT・sns_ker を発行する． */
CLASS(CLS_ALL_PRC1) {
	DOMAIN(DOM1) {
		CRE_TSK(SIL_USER_TASK, {TA_NULL, 0, sil_user_task, 2, TTSP_TASK_STACK_SIZE, &ttg_ustack_prc1[DOM1 - 1][0][0], TTSP_TASK_STACK_SIZE, &ttg_sstack_prc1[0][0]});
		SAC_TSK(SIL_USER_TASK, {TACP_SHARED, TACP_SHARED, TACP_SHARED, TACP_SHARED});
	}
}
