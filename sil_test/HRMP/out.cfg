INCLUDE("tecsgen.cfg");
INCLUDE("ttsp_svc.cfg");
INCLUDE("ttsp_target.cfg");

#include "out.h"

/* 【TTSP3向け改変 2026-06-14・HRMP版】ユーザドメインタスクのスタック（ttg_ustack_prc*）が置かれる
 * per-PE の .ttg_stack_section_CLS_ALL_PRC* をメモリ領域に配置（無いとリンカが discard し未解決）． */
ATT_SEC(".ttg_stack_section_CLS_ALL_PRC1", {TA_NOWRITE|TA_NOREAD, TTSP_STANDARD_RAM_REGION});
ATT_SEC(".ttg_stack_section_CLS_ALL_PRC2", {TA_NOWRITE|TA_NOREAD, TTSP_STANDARD_RAM_REGION});

CLASS(CLS_PRC1){
	KERNEL_DOMAIN {
	CRE_TSK(MAIN_TASK1, {TA_ACT, 1, main_task, 1, TTSP_TASK_STACK_SIZE, NULL});
		SAC_TSK(MAIN_TASK1, {TACP_SHARED, TACP_SHARED, TACP_SHARED, TACP_SHARED});

	CRE_ALM(ALM1, {TA_NULL, {TNFY_HANDLER, 1, almhdr}});
	CRE_CYC(CYC1, {TA_NULL, {TNFY_HANDLER, 1, cychdr}, 100000, 1});

	CRE_SPN(SPN_ALL, {TA_NULL});

	DEF_EXC(TTSP_EXCNO_A, {TA_NULL, exchdr});
	DEF_EXC((0x10000U | EXCNO_DABORT), {TA_NULL, sil_dabort_handler});  /* EXCNO_MACV_DATA_PRC1 相当（PE1のデータアボート） */

	ATT_INI({TA_NULL, 1, inirtn});
	ATT_TER({TA_NULL, 1, terrtn});

	CFG_INT(TTSP_INTNO_A, {TA_ENAINT, TTSP_GE_TIMER_INTPRI});
	DEF_INH(TTSP_INHNO_A, {TA_NULL, inthdr_for_int_test});

#ifdef TTSP_INTNO_B
	CFG_INT(TTSP_INTNO_B, {TA_ENAINT, TTSP_MID_INTPRI});
	DEF_INH(TTSP_INHNO_B, {TA_NULL, inthdr});
#endif /* TTSP_INTNO_B */

#ifdef TTSP_INTNO_C
	CFG_INT(TTSP_INTNO_C, {TA_ENAINT, TTSP_MID_INTPRI});
#endif /* TTSP_INTNO_C */
	}
}

