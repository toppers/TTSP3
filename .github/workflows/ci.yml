name: ttsp3-ci

# TTSP3 を標準ASP3（兄弟ディレクトリ）に対して QEMU(xilinx-zynq-a9) でビルド・実行する。
# 配置：  <workspace>/ttsp3   ← 本リポジトリ（actions/checkout先）
#         <workspace>/asp3    ← ZIP配布物から展開（兄弟ディレクトリ）
# configure.sh は OS_PATH="../asp3/" を参照するため、この並びが必須。
#
# QEMU は a9gtimer パッチ（docs/patches/）適用済みのものをソースビルドして使う。
# 素のQEMUでは check_library/timer が原理的に通らない（DIVERGENCE_MAP.md C表）。
# ビルド済みバイナリは actions/cache でキャッシュし、2回目以降は数秒で復元される。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ci_mode:
        description: "smoke: ターゲット依存チェックのみ / full: 全テスト"
        type: choice
        options: [ full, smoke ]
        default: full

env:
  # UPSTREAM_KERNEL.md と一致させること（再現性のため版を固定）
  ASP3_ZIP_URL: "https://www.toppers.jp/download.cgi/asp3_zybo_z7_gcc-20260520.zip"
  QEMU_VERSION: "11.0.0"
  QEMU_PREFIX: "/opt/qemu-ttsp3"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # テストは並列ドライバ化済み（32コアローカルで34秒、4vCPUランナーでも数分想定）。
    # 支配項は初回のQEMUビルド（キャッシュミス時のみ約8分）。
    timeout-minutes: 60
    steps:
      # 本リポジトリを ws/ttsp3 に取得（兄弟配置にするためサブパスへ）
      - name: Checkout TTSP3
        uses: actions/checkout@v4
        with:
          path: ttsp3

      - name: Install toolchain / Ruby
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            ruby make unzip
          arm-none-eabi-gcc --version | head -1
          ruby --version

      # ---- QEMU（a9gtimerパッチ適用版）----
      # restore/save を分離し、テスト失敗時でもQEMUビルド（約17分）をキャッシュ保存する
      - name: Restore patched QEMU cache
        id: cache-qemu
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QEMU_PREFIX }}
          key: qemu-${{ env.QEMU_VERSION }}-a9gtimer-${{ hashFiles('ttsp3/docs/patches/qemu-11.0.0-a9gtimer-honor-enable.patch') }}

      - name: Build patched QEMU (cache miss only)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev \
            python3-venv flex bison
          curl -sLO "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          tar xf "qemu-${QEMU_VERSION}.tar.xz"
          cd "qemu-${QEMU_VERSION}"
          patch -p1 < ../ttsp3/docs/patches/qemu-11.0.0-a9gtimer-honor-enable.patch
          ./configure --target-list=arm-softmmu --prefix="${QEMU_PREFIX}" \
            --disable-docs --disable-gtk --disable-sdl --disable-vnc --disable-werror
          make -j"$(nproc)"
          sudo make install

      # ビルド直後（テスト前）に保存するため、後段のテスト失敗の影響を受けない
      - name: Save patched QEMU cache
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QEMU_PREFIX }}
          key: qemu-${{ env.QEMU_VERSION }}-a9gtimer-${{ hashFiles('ttsp3/docs/patches/qemu-11.0.0-a9gtimer-honor-enable.patch') }}

      - name: Add QEMU to PATH and verify
        run: |
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
          "${QEMU_PREFIX}/bin/qemu-system-arm" --version | head -1

      # ---- 被テストカーネル（兄弟 ../asp3）----
      - name: Fetch standard ASP3 (ZIP, pinned; sibling dir)
        run: |
          curl -sL -o asp3.zip "${ASP3_ZIP_URL}"
          mkdir asp3_extract
          unzip -q asp3.zip -d asp3_extract
          # 展開トップ（configure.rb を含むディレクトリ）を ./asp3 に配置
          top=$(dirname "$(find asp3_extract -maxdepth 2 -name configure.rb | head -1)")
          test -n "$top" || { echo "configure.rb not found in archive"; exit 1; }
          mv "$top" asp3
          ls -d ttsp3 asp3   # 兄弟配置の確認
          grep -m1 'Release' asp3/doc/version.txt

      # ---- 実行 ----
      - name: Run TTSP3 (target-dependent check -> API) on QEMU
        working-directory: ttsp3
        env:
          CI_MODE: ${{ github.event.inputs.ci_mode || 'full' }}
        run: |
          bash scripts/ci_run.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttsp3-logs
          path: |
            ttsp3/ci_*.log
            ttsp3/obj/**/execute.log
            ttsp3/obj/**/result_ttg.log
            ttsp3/obj/api_test/config_error/result_conf_err.log
          if-no-files-found: warn
