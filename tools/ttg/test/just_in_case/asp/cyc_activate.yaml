version: "$Id: cyc_activate.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
CYC_ACTIVATE_in_pre_condition:
  pre_condition:
    CYC1:
      type    : CYCLE
      cycatr  : TA_STA
      cycstat : TCYC_STA
      hdlstat : ACTIVATE
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : CYC1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt : 1
