version: "$Id: tex_activate_wait_object6.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_pridataq_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0
      var    :
        data   :
          type: intptr_t 
        datapri:
          type: PRI

    PDQ1:
      type  : P_DATAQUEUE
      pdqcnt: 0

  do:
    id     : TEX1
    syscall: rcv_pdq(PDQ1, &data, &datapri)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    PDQ1:
      rtsklist:
        - TASK1:
