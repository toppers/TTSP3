version: "$Id: tex_cant_activate.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
tex_cant_activate:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : TEXPTN_A
      pndptn : 0

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TEX1
    syscall: sns_ker()
    bool   : false

  post_condition:
