version: "$Id: isr_2.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ISR_sample_2:
  pre_condition:
    ISR1:
      type   : ISR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_ISR_B
      intpri : INT_PRI_MID
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
      isrpri : ISR_PRI_MID
      exinf  : 0x03

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: INT_PRI_MID

  do:
    id     : ISR1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt : 1
