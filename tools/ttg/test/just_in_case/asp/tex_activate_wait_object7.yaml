version: "$Id: tex_activate_wait_object7.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_mailbox:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0
      var    :
        pk_msg:
          type: T_MSG*

    MBX1:
      type: MAILBOX

  do:
    id     : TEX1
    syscall: rcv_mbx(MBX1, &pk_msg)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MBX1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    MBX1:
      wtsklist:
        - TASK1:
