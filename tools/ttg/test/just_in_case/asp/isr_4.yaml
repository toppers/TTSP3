version: "$Id: isr_4.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ISR_sample_4:
  pre_condition:
    ISR1:
      type   : ISR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_ISR_B
      intpri : INT_PRI_MID
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
      isrpri : ISR_PRI_MID
      exinf  : 0x03

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: INT_PRI_MID

  do_0:
    id     : ISR1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition_0:
    ISR1:
      hdlstat: STP

    TASK1:
      actcnt : 1

    CPU_STATE:
      chg_ipm: TIPM_ENAALL

  do_1:
    id   : TASK1
    code : ttsp_int_raise(INTNO_SELF_ISR_B)

  post_condition_1:
    ISR1:
      hdlstat: ACTIVATE
      bootcnt: 1

    CPU_STATE:
      chg_ipm: INT_PRI_MID
