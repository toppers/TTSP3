version: "$Id: inthdr_4.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
INTHDR_sample_4:
  pre_condition:
    INH1:
      type   : INTHDR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_INH_B
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_B
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
      bootcnt: 0

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: INT_PRI_MID

  do_0:
    id     : INH1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition_0:
    INH1:
      hdlstat: STP

    TASK1:
      actcnt: 1

    CPU_STATE:
      chg_ipm: TIPM_ENAALL

  do_1:
    id   : TASK1
    code : ttsp_int_raise(INTNO_SELF_INH_B)

  post_condition_1:
    INH1:
      hdlstat: ACTIVATE
      bootcnt: 1

    CPU_STATE:
      chg_ipm: INT_PRI_MID
