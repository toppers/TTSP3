version: "$Id: exception_1.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
EXCEPTION_sample_1:
  pre_condition:
    EXC1:
      type    : EXCEPTION
      excno   : EXCNO_SELF_A
      hdlstat : STP

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id   : TASK1
    code : ttsp_cpuexc_raise(EXCNO_SELF_A)

  post_condition:
    EXC1:
      hdlstat: ACTIVATE
