version: "$Id: middle_cpu_lock.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
MIDDLE_CPU_LOCK:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false

  do_0:
    id     : TASK1
    syscall: loc_cpu()
    ercd   : E_OK

  post_condition_0:
    CPU_STATE1:
      loc_cpu: true

  do_1:
    id     : TASK1
    syscall: ext_tsk()

  post_condition_1:
    TASK1:
      tskstat: dormant

    CPU_STATE1:
      loc_cpu: false
