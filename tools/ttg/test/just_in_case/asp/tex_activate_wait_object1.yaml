version: "$Id: tex_activate_wait_object1.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_semaphore:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    SEM1:
      type  : SEMAPHORE
      semcnt: 0

  do:
    id     : TEX1
    syscall: wai_sem(SEM1)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    SEM1:
      wtsklist:
        - TASK1:
