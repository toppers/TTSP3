version: "$Id: exception_3.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
EXCEPTION_sample_3:
  pre_condition:
    EXC1:
      type    : EXCEPTION
      excno   : EXCNO_SELF_A
      hdlstat : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

  do_0:
    id     : EXC1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition_0:
    EXC1:
      hdlstat : STP

    TASK1:
      actcnt : 1

  do_1:
    id   : TASK1
    code : ttsp_cpuexc_raise(EXCNO_SELF_A)

  post_condition_1:
    EXC1:
      hdlstat: ACTIVATE
      bootcnt: 1
