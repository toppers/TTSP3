version: "$Id: inthdr_2.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
INTHDR_sample_2:
  pre_condition:
    INH1:
      type   : INTHDR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_INH_B
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_B
      intstat: TA_ENAINT
      hdlstat: ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      chg_ipm: INT_PRI_MID

  do:
    id     : INH1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1
