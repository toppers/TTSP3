version: "$Id: tex_activate_wait_object5.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_pridataq_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      maxdpri : DATA_PRI_MAX
      stsklist:

  do:
    id     : TEX1
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : PDQ1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    PDQ1:
      stsklist:
        - TASK1:
            data   : DATA_A
            datapri: DATA_PRI_HIGH
