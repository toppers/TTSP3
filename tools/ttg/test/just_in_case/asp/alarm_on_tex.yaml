version: "$Id: alarm_on_tex.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
alarm_on_tex:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_DIS
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    ALM1:
      type   : ALARM
      almstat: TALM_STA
      hdlstat: ACTIVATE
      lefttim: 3

    EXC1:
      type    : EXCEPTION
      excno   : EXCNO_SELF_A
      hdlstat : STP

  do:
    id   : ALM1
    code : ttsp_cpuexc_raise(EXCNO_SELF_A)

  post_condition:
    ALM1:
      hdlstat: STP

    EXC1:
      hdlstat: ACTIVATE
