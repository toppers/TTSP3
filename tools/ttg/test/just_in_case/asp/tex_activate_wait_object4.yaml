version: "$Id: tex_activate_wait_object4.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_dataqueue_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0
      var:
        data:
          type: intptr_t 

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      stsklist:
      datalist:

  do:
    id     : TEX1
    syscall: rcv_dtq(DTQ1, &data)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    DTQ1:
      rtsklist:
        - TASK1:
