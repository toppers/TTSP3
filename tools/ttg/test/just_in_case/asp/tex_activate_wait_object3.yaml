version: "$Id: tex_activate_wait_object3.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_dataqueue_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    DTQ1:
      type    : DATAQUEUE
      dtqatr  : TA_TPRI
      dtqcnt  : 0
      stsklist:
      datalist:

  do:
    id     : TEX1
    syscall: snd_dtq(DTQ1, DATA_D)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : DTQ1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    DTQ1:
      stsklist:
        - TASK1:
            data : DATA_D
