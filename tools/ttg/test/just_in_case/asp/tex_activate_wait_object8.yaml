version: "$Id: tex_activate_wait_object8.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_wait_mempfix:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      fblkcnt : 0

  do:
    id     : TEX1
    syscall: get_mpf(MPF1,&blk)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0x01
      pndptn : 0

    MPF1:
      wtsklist:
        - TASK1:
