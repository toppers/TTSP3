version: "$Id: gain_time_2.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
sample_sys_manage_iget_tid_b_2:
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP
      var    :
        p_tskid :
          type : ID

    TASK1:
      type   : TASK
      tskstat: running

  do_0:
    id: TASK1
    syscall: sta_alm(ALM1, ACTIVATE_ALARM_TIME)
    ercd: E_OK

  post_condition_0:
    ALM1:
      almstat: TALM_STA
      hdlstat: STP

  do_1:
    id: TASK1
    syscall: dly_tsk(WAIT_ALARM_TIME)

  post_condition_1:
    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE

    TASK1:
      tskstat: waiting
      wobjid : DELAY

  do_2:
    id: ALM1
    syscall: iget_tid(&p_tskid)
    ercd: E_OK

  post_condition_2:
    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE
      var    :
        p_tskid :
          value: TSK_NONE
