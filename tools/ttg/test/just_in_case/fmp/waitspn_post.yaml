version: "$Id: waitspn_post.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_waitspn_post:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition_0:
    SPN1:
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      loc_cpu: true

  do_1:
    id     : TASK2
    syscall: loc_spn(SPN1)
    ercd   : E_OK
    gcov   : true

  post_condition_1:
    TASK2:
      tskstat: running-waitspin
      spinid : SPN1

  do_2:
    id     : TASK1
    syscall: unl_spn(SPN1)
    ercd   : E_OK
    gcov   : false

  post_condition_2:
    TASK2:
      tskstat: running

    SPN1:
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      loc_cpu: false

    CPU_STATE2:
      loc_cpu: true
