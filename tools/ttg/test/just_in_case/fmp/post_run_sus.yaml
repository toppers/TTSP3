version: "$Id: post_run_sus.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_post_run_sus:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF
      tskpri : 16
      itskpri: 16

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

  do_0:
    id     : TASK1
    syscall: act_tsk(TASK1)
    ercd   : E_OK

  post_condition_0:
    TASK1:
      actcnt: 1

  do_1:
    id     : TASK1
    syscall: can_act(TASK1)
    eruint : 1

  post_condition_1:
    TASK1:
      actcnt: 0
