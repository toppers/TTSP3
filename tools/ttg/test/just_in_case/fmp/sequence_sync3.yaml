version: "$Id: sequence_sync3.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_sequence_sync3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TEX1:
      type   : TASK_EXC
      task   : TASK2
      texstat: TTEX_ENA
      hdlstat: STP
      pndptn : 0

  do_0:
    id     : TASK1
    syscall: ras_tex(TASK2, TEXPTN_A)
    ercd   : E_OK
    gcov   : true

  post_condition_0:
    TEX1:
      texstat: TTEX_DIS
      hdlstat: ACTIVATE
      texptn : TEXPTN_A
      pndptn : 0

  do_1:
    id     : TEX1
    code   : return
    gcov   : false

  post_condition_1:
    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0
