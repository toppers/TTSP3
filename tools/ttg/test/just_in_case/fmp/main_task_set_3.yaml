version: "$Id: main_task_set_3.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
main_task_set_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      itskpri: 1
      tskpri : 1

    TASK2:
      type   : TASK
      tskstat: ready
      itskpri: 1
      tskpri : 1

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: wup_tsk(TASK2)
    ercd   : E_CTX

  post_condition:
