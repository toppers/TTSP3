version: "$Id: spin_lock_test.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_spin_lock_spin_lock_test:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF
      class  : CLS_SELF_ALL
      spinid : SPN1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      class  : CLS_SELF_ALL
      procid : TASK1

    SPN2:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_SELF_ALL

    SPN3:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_OTHER_ALL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: unl_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
