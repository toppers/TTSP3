version: "$Id: multi_activate_alarm.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_multi_activate_alarm:
  variation:
    timer_arch: local

  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_SELF

    ALM2:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_OTHER_1

    ALM3:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_OTHER_2

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

  do:
    id     : ALM1
    syscall: imsta_alm(ALM2, 0, PRC_SELF)

  post_condition:
    0:
      ALM1:
        hdlstat: STP

      ALM2:
        almstat: TALM_STA
        hdlstat: STP
        prcid  : PRC_SELF
        bootcnt: 1

      ALM3:
        hdlstat: STP

    1:
      ALM2:
        almstat: TALM_STP
        hdlstat: ACTIVATE
