version: "$Id: sequence_sync2.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_sequence_sync2:
  pre_condition:
    INH1:
      type   : INTHDR
      intatr : TA_ENAINT
      intno  : INTNO_OTHER_INH_B
      intpri : INT_PRI_MID
      inhno  : INHNO_OTHER_B
      intstat: TA_ENAINT
      hdlstat: STP
      prcid  : PRC_OTHER
      class  : CLS_OTHER_ONLY_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    syscall: unl_cpu()
    ercd   : E_OK

  post_condition_0:

  do_1:
    id   : TASK1
    code : ttsp_int_raise(INTNO_OTHER_INH_B)

  post_condition_1:
    INH1:
      hdlstat: ACTIVATE

  do_2:
    id   : INH1
    code : return

  post_condition_2:
    INH1:
      hdlstat: STP
