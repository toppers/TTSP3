version: "$Id: class_test.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_class_test:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      class  : CLS_SELF_ALL

    SEM1:
      type : SEMAPHORE
      class: CLS_SELF_ALL

    FLG1:
      type : EVENTFLAG
      class: CLS_OTHER_1_ALL

    DTQ1:
      type : DATAQUEUE
      class: CLS_OTHER_2_ALL

    PDQ1:
      type : P_DATAQUEUE
      class: CLS_SELF_ONLY_SELF

    MBX1:
      type : MAILBOX
      class: CLS_OTHER_1_ONLY_OTHER_1

    MPF1:
      type : MEMORYPOOL
      class: CLS_OTHER_2_ONLY_OTHER_2

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_SELF_ALL

  do:
    id     : TASK1
    syscall: act_tsk(TSK_SELF)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt  : 1
