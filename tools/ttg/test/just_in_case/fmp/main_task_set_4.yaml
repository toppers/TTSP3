version: "$Id: main_task_set_4.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
main_task_set_4:
  pre_condition:
    ALM1:
      type    : ALARM
      almstat : TALM_STP
      hdlstat : ACTIVATE

    TASK1:
      type   : TASK
      tskstat: running
      itskpri: 1
      tskpri : 1

    TASK2:
      type   : TASK
      tskstat: ready
      itskpri: 1
      tskpri : 1

  do:
    id     : ALM1
    syscall: wup_tsk(TASK1)
    ercd   : E_CTX

  post_condition:
