version: "$Id: pre_activate_process_unit.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
pre_activate_process_unit:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE

    ALM2:
      type   : ALARM
      almstat: TALM_STA
      hdlstat: STP
      lefttim: 0

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_DIS
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

  do:
    1:
      id  : ALM1
      code: return

  post_condition:
    1:
      ALM1:
        hdlstat: STP
      ALM2:
        hdlstat: ACTIVATE
