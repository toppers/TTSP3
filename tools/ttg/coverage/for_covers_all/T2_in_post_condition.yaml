version: "$Id: T2_in_post_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
T2_in_post_condition:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
    TASK2:
      type   : TASK
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: invalid
