version: "$Id: complement_pre_var.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
complement_pre_var:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rtsk1:
          type   : T_RTSK
          tskstat: TTS_WAI

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : MBX1
      var    : 
        pk_msg:
          type: T_MSG*

    MBX1:
      type   : MAILBOX
      wtsklist : 
        - TASK2:
            var: pk_msg

  do:
    id     : TASK1
    syscall: ref_tsk(TASK2,&rtsk1)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk1:
          tskwait: TTW_MBX
          wobjid : MBX1
          lefttmo: TMO_FEVR
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 0
          wupcnt : 0
