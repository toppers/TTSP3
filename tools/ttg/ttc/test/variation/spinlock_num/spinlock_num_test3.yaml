version: "$Id: spinlock_num_test3.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
spinlock_num_test3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_SELF_ALL

    SPN2:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_SELF_ALL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      loc_cpu: true
