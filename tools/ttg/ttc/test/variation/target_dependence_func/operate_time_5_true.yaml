version: "$Id: operate_time_5_true.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_5_true:
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_LOW
      tskstat: ready

  do:
    id     : TASK1
    syscall: dly_tsk(1)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: 1

      TASK2:
        tskstat: running

    1:
      TASK1:
        lefttmo: 0

    2:
      TASK1:
        tskstat: running

      TASK2:
        tskstat: ready
