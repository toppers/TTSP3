version: "$Id: operate_time_3_false.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_3_false:
  variation:
    gain_time: false

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    SEM1:
      type   : SEMAPHORE
      sematr : TA_NULL
      semcnt : 0

  do:
    id     : TASK1
    syscall: twai_sem(SEM1, ANY_ELAPSED_TIME)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SEM1
      lefttmo: ANY_ELAPSED_TIME

    SEM1:
      wtsklist:
        - TASK1:
