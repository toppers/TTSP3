version: "$Id: operate_time_7_true.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_7_true:
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    CYC1:
      type   : CYCLE
      cycstat: TCYC_STA
      hdlstat: STP
      cycphs : RELATIVE_TIME_A
      cyctim : RELATIVE_TIME_B
      prcid  : PRC_OTHER

  do:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : STP

    RELATIVE_TIME_A+(RELATIVE_TIME_B*0)+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 0

    RELATIVE_TIME_A+(RELATIVE_TIME_B*1)+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 1

    RELATIVE_TIME_A+(RELATIVE_TIME_B*2)+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 2

    RELATIVE_TIME_A+(RELATIVE_TIME_B*3)+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 3

    RELATIVE_TIME_A+(RELATIVE_TIME_B*4)+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 4
