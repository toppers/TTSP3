version: "$Id: operate_time_8_none.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_8_none:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rcyc:
          type: T_RCYC

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STA
      hdlstat : STP
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rcyc:
          cycstat: TCYC_STA
          lefttim: RELATIVE_TIME_A
