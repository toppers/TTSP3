version: "$Id: operate_time_6_none.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_6_none:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready

  do_0:
    id     : TASK1
    syscall: dly_tsk(RELATIVE_TIME_A)

  post_condition_0:
    0:
      TASK1:
        tskstat: waiting
        wobjid : DELAY
        lefttmo: RELATIVE_TIME_A

      TASK2:
        tskstat: running

    RELATIVE_TIME_A:
      TASK1:
        lefttmo: 0

    RELATIVE_TIME_A+1:
      TASK1:
        tskstat: ready
