version: "$Id: operate_time_unnecessary_true.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
time_operate_unnecessary_true:
  variation:
    gain_time: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
