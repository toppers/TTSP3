version: "$Id: operate_time_1_true.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
operate_time_1_true:
  variation:
    gain_time: true

  pre_condition:
    ALM1:
      type    : ALARM
      almstat : TALM_STP
      hdlstat : ACTIVATE

    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      wupcnt : 0

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : SLEEP
      wupcnt : 0

  do:
    id     : ALM1
    syscall: iwup_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
