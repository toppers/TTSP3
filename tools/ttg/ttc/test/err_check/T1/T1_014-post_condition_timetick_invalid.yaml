version: "$Id: T1_014-post_condition_timetick_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_W_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rcyc:
            type: T_RCYC

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STP
      hdlstat : STP
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

  do:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK
      gcov   : false

    RELATIVE_TIME_A:
      id     : TASK1
      syscall: ref_cyc(CYC1, &rcyc)
      ercd   : E_OK
      gcov   : true

  post_condition:
    "-1":
      CYC1:
        cycstat : TCYC_STA
        hdlstat : STP

    RELATIVE_TIME_A:
