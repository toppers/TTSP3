version: "$Id: T1_026-variable_only_pre_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_ref_alm_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        ralm:
          type: T_RALM

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

  do:
    id     : TASK1
    syscall: ref_alm(ALM1, &ralm)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        ralm:
          type   : T_RALM
          almstat: TALM_STP
