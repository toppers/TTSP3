version: "$Id: T1_015-post_condition_object_id_invalid_integer.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_act_tsk_d_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)

  post_condition:
    1TASK:
      tskstat: ready

    TASK*:
      tskstat: running
      tskpri : TSK_PRI_HIGH
