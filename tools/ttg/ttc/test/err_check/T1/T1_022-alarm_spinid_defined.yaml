version: "$Id: T1_022-alarm_spinid_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_sta_alm_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP
      spinid : defined

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, -1)
    ercd   : E_PAR

  post_condition:
