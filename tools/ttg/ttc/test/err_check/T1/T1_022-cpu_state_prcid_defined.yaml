version: "$Id: T1_022-cpu_state_prcid_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_stp_alm_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STA
      hdlstat: STP
      lefttim: RELATIVE_TIME_A

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : defined

  do:
    id     : TASK1
    syscall: stp_alm(ALM1)
    ercd   : E_CTX

  post_condition:
