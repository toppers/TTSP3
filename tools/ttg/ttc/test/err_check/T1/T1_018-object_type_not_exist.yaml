version: "$Id: T1_018-object_type_not_exist.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_act_tsk_d_1_1:
  pre_condition:
    TASK1:
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      itskpri: TSK_PRI_HIGH
      tskstat: dormant

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
