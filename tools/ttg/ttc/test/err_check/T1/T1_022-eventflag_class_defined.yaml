version: "$Id: T1_022-eventflag_class_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_eventflag_set_flg_e_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1
      var    :
        flgptn:
          type: FLGPTN

    FLG1:
      type    : EVENTFLAG
      flgatr  : TA_NULL
      flgptn  : BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            var   : flgptn
            wfmode: WAIT_FLG_MODE_A
      class   : defined

  do:
    id     : TASK1
    syscall: set_flg(FLG1, BIT_PATTERN_A)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        flgptn:
          value: BIT_PATTERN_0A|BIT_PATTERN_A

    FLG1:
      flgptn  : BIT_PATTERN_0A|BIT_PATTERN_A
      wtsklist:
