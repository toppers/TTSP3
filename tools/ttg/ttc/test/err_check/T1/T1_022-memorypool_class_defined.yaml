version: "$Id: T1_022-memorypool_class_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_get_mpf_g_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk:
          type: void*

    MPF1:
      type    : MEMORYPOOL
      mpfatr  : TA_NULL
      blkcnt  : ANY_INI_BLKCNT
      fblkcnt : 0
      wtsklist:
      class   : defined

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      wtsklist:
        - TASK1:
