version: "$Id: T1_022-task_exc_spinid_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_except_ras_tex_c:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: dormant

    TEX1:
      type   : TASK_EXC
      hdlstat: STP
      task   : TASK2
      spinid : defined

  do:
    id     : TASK1
    syscall: ras_tex(TASK2, TEXPTN_A)
    ercd   : E_OBJ

  post_condition:
