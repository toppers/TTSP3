version: "$Id: T1_022-inthdr_prcid_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_interrupt_dis_int_d_1:
  note: TESRY_006

  variation:
    api_support_dis_int: true
    api_support_ena_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : INT_PRI_MID
      intstat: TA_ENAINT
      hdlstat: STP
      inhno  : INHNO_SELF_A
      prcid  : defined

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do_0:
    id     : TASK1
    syscall: dis_int(INTNO_SELF_INH_A)
    ercd   : E_OK
    gcov   : true

  post_condition_0:
    INH1:
      intstat: TA_DISINT

  do_1:
    id  : TASK1
    code: ttsp_int_raise(INTNO_SELF_INH_A)
    gcov: false

  post_condition_1:

  do_2:
    id     : TASK1
    syscall: ena_int(INTNO_SELF_INH_A)
    gcov   : false

  post_condition_2:
    INH1:
      intstat: TA_ENAINT
      hdlstat: ACTIVATE

    CPU_STATE:
      chg_ipm: INT_PRI_MID
