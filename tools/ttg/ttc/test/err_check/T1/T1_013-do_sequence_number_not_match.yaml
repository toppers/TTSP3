ASP_alarm_ista_alm_f:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE

    ALM2:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    TASK1:
      type   : TASK
      tskstat: running

  do_0:
    id     : ALM1
    syscall: ista_alm(ALM2, 0)
    ercd   : E_OK
    gcov   : true

  post_condition_0:
