      almstat: TALM_STA
      hdlstat: STP
      lefttim: 0

  post_condition_1:
    0:
      ALM1:
        almstat: TALM_STP
        hdlstat: STP

    1:
      ALM2:
        almstat: TALM_STP
        hdlstat: ACTIVATE
