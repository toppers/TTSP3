version: "$Id: T1_025-variable_not_exist.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_get_inf_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        exinf:
          value: EXINF_A

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: get_inf(&exinf)
    ercd   : E_CTX

  post_condition:
