version: "$Id: T6_010-api_support_dis_int_TA_ENAINT_inthdr_post_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_interrupt_dis_int_d_1:
  pre_condition:
    INH1:
      type   : INTHDR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_INH_A
      intpri : ANY_INT_PRI
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : TASK1
    syscall: dis_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition:
    INH1:
      intstat: TA_DISINT
