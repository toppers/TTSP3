version: "$Id: T6_001-all_gain_time[T]_func_time[F]_gain_time[F].yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_sync_dly_tsk_c:
  variation:
    gain_time: false

  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: ready

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

  do_0:
    id     : TASK2
    syscall: dly_tsk(RELATIVE_TIME_A)
    ercd   : E_RLWAI
    gcov   : true

  post_condition_0:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: waiting
      wobjid : DELAY
      lefttmo: RELATIVE_TIME_A

  do_1:
    id     : TASK1
    syscall: rel_wai(TASK2)
    gcov   : false

  post_condition_1:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
