version: "$Id: T6_006-api_support_get_utm.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_time_manage_get_utm_a:
  variation:
    api_support_get_utm: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        sysutm:
          type: SYSUTM

  do:
    id     : TASK1
    syscall: get_utm(&sysutm)
    ercd   : E_OK

  post_condition:
