version: "$Id: T6_F003-own_ipi_raise.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_sys_manage_get_tid_F_b_2_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running-suspended
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    CPU_STATE1:
      type   : CPU_STATE
      dis_dsp: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: get_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        p_tskid:
          value: TASK1
