version: "$Id: T6_010-api_support_ena_int_TA_NULL_isr_post_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_interrupt_ena_int_d_1:
  pre_condition:
    ISR1:
      type   : ISR
      intatr : TA_NULL
      intno  : INTNO_SELF_ISR_A
      intpri : INT_PRI_MID
      intstat: TA_DISINT
      hdlstat: STP
      isrpri : ISR_PRI_MID
      exinf  : EXINF_A

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : TASK1
    syscall: ena_int(INTNO_SELF_ISR_A)
    ercd   : E_OK

  post_condition:
    ISR1:
      intstat: TA_ENAINT
