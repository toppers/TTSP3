version: "$Id: T5_F001-rus-task_api.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_sys_manage_iget_tid_F_b_3_1:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      var    :
        p_tskid:
          type: ID
      prcid  : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: iget_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    ALM1:
      var:
        p_tskid :
          value: TASK1
