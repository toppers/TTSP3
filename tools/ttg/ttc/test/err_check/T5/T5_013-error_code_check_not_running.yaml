version: "$Id: T5_013-error_code_check_not_running.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_stp_alm_d:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

  do:
    id     : TASK1
    syscall: stp_alm(ALM1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: dormant
