version: "$Id: T5_002-variable_undefined_in_pre_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_get_pri_d_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      var    :
        tskpri:
          type: PRI

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID

  do:
    id     : TASK1
    syscall: get_pri(TASK2, &tskpri)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        data:
          value: TSK_PRI_MID
