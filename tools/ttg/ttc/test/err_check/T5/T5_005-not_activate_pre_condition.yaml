version: "$Id: T5_005-not_activate_pre_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_stp_alm_d:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: dormant

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

  do:
    id     : TASK2
    syscall: stp_alm(ALM1)

  post_condition:
