version: "$Id: T5_006-timetick_returns.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_cyclic_sta_cyc_W_a:
  note: TESRY_002

  variation:
    gcov_all: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STP
      hdlstat : STP
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do_0:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK

  post_condition_0:
    0:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : STP

    RELATIVE_TIME_A+1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : ACTIVATE
        bootcnt : 0

  do_1:
    RELATIVE_TIME_A+1:
      id     : CYC1
      syscall: iloc_cpu()
      ercd   : E_OK

  post_condition_1:
    RELATIVE_TIME_A+1:
      CPU_STATE:
        loc_cpu: true

  do_2:
    RELATIVE_TIME_A+1:
      id     : CYC1
      code   : return

  post_condition_2:
    1:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : STP
        bootcnt : 1

      CPU_STATE:
        loc_cpu: false
