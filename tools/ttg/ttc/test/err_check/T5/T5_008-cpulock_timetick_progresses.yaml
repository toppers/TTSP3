version: "$Id: T5_008-cpulock_timetick_progresses.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_sta_alm_d:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_OK

  post_condition:
    0:
      TASK1:
        tskstat: running

      ALM1:
        almstat: TALM_STA
        hdlstat: STP
        lefttim: RELATIVE_TIME_A

    RELATIVE_TIME_A:
      ALM1:
        lefttim: 0

    RELATIVE_TIME_A+1:
      ALM1:
        almstat: TALM_STP
        hdlstat: ACTIVATE
