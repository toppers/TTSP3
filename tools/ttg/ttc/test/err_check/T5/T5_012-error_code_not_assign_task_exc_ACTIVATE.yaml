version: "$Id: T5_012-error_code_not_assign_task_exc_ACTIVATE.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_3_in_pre_condition:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

  do:
    id     : TEX1
    syscall: slp_tsk()

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : SLEEP

    TEX1:
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0
