version: "$Id: T5_F004-global_and_plural_non_context.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_alarm_imsta_alm_F_a_1:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_SELF

    ALM2:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP
      prcid  : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

  do:
    id     : ALM1
    syscall: imsta_alm(ALM2, RELATIVE_TIME_A, PRC_OHTER)
    ercd   : E_NOSPT

  post_condition:
