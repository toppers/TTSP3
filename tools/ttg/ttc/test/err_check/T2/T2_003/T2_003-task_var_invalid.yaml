version: "$Id: T2_003-task_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_b_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rtsk*:
          type   : T_RTSK
          tskstat: ANY_TASK_STAT
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          tskwait: ANY_TASK_WAIT
          wobjid : ANY_OBJECT_ID
          lefttmo: RELATIVE_TIME_A
          actcnt : ANY_QUEUING_CNT
          wupcnt : ANY_QUEUING_CNT

  do:
    id     : TASK1
    syscall: ref_tsk(-1,&rtsk)
    ercd   : E_ID

  post_condition:
