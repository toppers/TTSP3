version: "$Id: T2_003-dataqueue_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_fsnd_dtq_d_1_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : DTQ1
      var:
        data:
          type: intptr_t

    DTQ1:
      type   : DATAQUEUE
      dtqcnt : 3
      rtsklist : 
        - TASK2:
            var: data*
      datalist:

  do:
    id     : TASK1
    syscall: fsnd_dtq(DTQ1, DATA_A)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    DTQ1:
      rtsklist : 
