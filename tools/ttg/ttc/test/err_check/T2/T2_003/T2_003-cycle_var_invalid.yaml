version: "$Id: T2_003-cycle_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_b_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STA
      hdlstat : ACTIVATE
      cycphs  : RELATIVE_TIME_B
      cyctim  : RELATIVE_TIME_C
      var:
        rcyc*:
          type: T_RCYC
          cycstat: ANY_CYCLIC_STAT
          lefttim: RELATIVE_TIME_A

  do:
    id     : CYC1
    syscall: ref_cyc(0, &rcyc)
    ercd   : E_ID

  post_condition:
