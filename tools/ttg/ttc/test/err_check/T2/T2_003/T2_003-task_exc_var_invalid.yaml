version: "$Id: T2_003-task_exc_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_except_ref_tex_b_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      pndptn : 0x00
      texptn : 0x01
      var:
        rtex*:
          type: T_RTEX
          texstat: ANY_TEX_STAT
          pndptn: TEXPTN_A

  do:
    id     : TEX1
    syscall: ref_tex(-1, &rtex)
    ercd   : E_ID

  post_condition:
