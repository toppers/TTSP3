version: "$Id: T2_003-mailbox_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mailbox_rcv_mbx_g_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        pk_msg:
          type : T_MSG*

    MBX1:
      type    : MAILBOX
      mbxatr  : TA_NULL
      msglist :
      wtsklist:

  do:
    id     : TASK1
    syscall: rcv_mbx(MBX1, &pk_msg)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MBX1

    MBX1:
      wtsklist:
        - TASK1:
            var: pk_msg*
