version: "$Id: T2_003-exception_var_invalid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_exception_xsns_dpn_a:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    EXC1:
      type   : EXCEPTION
      excno  : EXCNO_SELF_A
      hdlstat: ACTIVATE
      var    :
        rtsk*:
          type   : T_RTSK
          tskstat: ANY_TASK_STAT
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          tskwait: ANY_TASK_WAIT
          wobjid : ANY_OBJECT_ID
          lefttmo: RELATIVE_TIME_A
          actcnt : ANY_QUEUING_CNT
          wupcnt : ANY_QUEUING_CNT

  do:
    id     : EXC1
    syscall: ref_tsk(-1,&rtsk)
    ercd   : E_ID

  post_condition:
