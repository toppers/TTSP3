version: "$Id: T4_029-not_task_object_defined_stsklist-dataqueue.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_f_2_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t 

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    DTQ1:
      type   : DATAQUEUE
      dtqcnt : 3
      stsklist:
       - TASK2:
           data: DATA_A
       - ALM1:
           data: DATA_A
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
       - ALM1:
           data: DATA_A
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_A
