version: "$Id: T4_029-not_task_object_defined_wtsklist-eventflag.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_eventflag_wai_flg_i_1_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var:
        flgptn:
          type: FLGPTN

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: waiting
      wobjid : FLG1

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    FLG1:
      type  : EVENTFLAG
      flgatr: TA_WMUL
      flgptn: BIT_PATTERN_0A
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - ALM1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B

  do:
    id     : TASK1
    syscall: wai_flg(FLG1, BIT_PATTERN_A, WAIT_FLG_MODE_A, &flgptn)

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - ALM1:
            waiptn: BIT_PATTERN_B
            wfmode: WAIT_FLG_MODE_B
        - TASK1:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
