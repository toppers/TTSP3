version: "$Id: T4_018-dormant_defined_ACTIVATE.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_exception_xsns_xpn_F_b:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_DIS
      hdlstat: STP
      pndptn : TEXPTN_0A

    TASK2:
      type   : TASK
      tskstat: dormant
      prcid  : PRC_OTHER

    TEX2:
      type   : TASK_EXC
      task   : TASK2
      hdlstat: ACTIVATE
      texptn : TEXPTN_A

    EXC1:
      type   : EXCEPTION
      excno  : EXCNO_SELF_A
      hdlstat: ACTIVATE
      prcid  : PRC_SELF

  do:
    id     : EXC1
    syscall: xsns_xpn(p_excinf)
    bool   : true

  post_condition:
