version: "$Id: T4_015-porder_not_unique.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_sys_manage_rot_rdq_c_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder: 1

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder: 1

  do:
    id     : TASK1
    syscall: rot_rdq(TPRI_SELF)

  post_condition:
    TASK1:
      tskstat: ready
      porder: 1

    TASK2:
      tskstat: running
      porder: 1
