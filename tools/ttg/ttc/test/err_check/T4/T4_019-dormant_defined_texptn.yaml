version: "$Id: T4_019-dormant_defined_texptn.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_ter_tsk_f_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: ready
      itskpri: TSK_PRI_LOW
      tskpri : TSK_PRI_MID

    TEX2:
      type   : TASK_EXC
      task   : TASK2
      texstat: TTEX_ENA
      hdlstat: STP
      pndptn : TEXPTN_A

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: dormant

    TEX2:
      hdlstat: STP
      texptn : TEXPTN_A
