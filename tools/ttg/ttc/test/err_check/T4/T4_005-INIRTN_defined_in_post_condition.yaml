version: "$Id: T4_005-INIRTN_defined_in_post_condition.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_sys_manage_sns_ker_a:
  pre_condition:
    INI1:
      type: INIRTN
      do  :
        syscall: sns_ker()
        bool   : true
        gcov   : true

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : TASK1
    syscall: sns_ker()
    bool   : false
    gcov   : false

  post_condition:
    INI1:
      do:
        syscall: sns_ker()
        bool   : true
        gcov   : true
