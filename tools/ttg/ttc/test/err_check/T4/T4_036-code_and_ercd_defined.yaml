version: "$Id: T4_036-code_and_ercd_defined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_except_ras_tex_f:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: STP
      pndptn : 0

  do_0:
    id     : TASK1
    syscall: ras_tex(TSK_SELF, TEXPTN_A)
    ercd   : E_OK

  post_condition_0:
    TEX1:
      texstat: TTEX_DIS
      hdlstat: ACTIVATE
      texptn : TEXPTN_A

  do_1:
    id  : TEX1
    code: return
    ercd: E_OK

  post_condition_1:
    TEX1:
      texstat: TTEX_ENA
      hdlstat: STP
      texptn : 0
