version: "$Id: T4_019-dormant_defined_spinid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_ter_tsk_f_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do_0:
    id     : TEX1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition_0:
    SPN1:
      spnstat: TSPN_LOC
      procid : TEX1

    CPU_STATE1:
      loc_cpu: true

  do_1:
    id     : TEX1
    syscall: ext_tsk()

  post_condition_1:
    TASK1:
      tskstat: dormant

    TEX1:
      hdlstat: STP
      spinid : SPN1

    SPN1:
      spnstat: TSPN_UNL

    CPU_STATE1:
      loc_cpu: false
