version: "$Id: T4_026-stsklist_mismatch_wobjid-dataqueue.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_rcv_dtq_f_2_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        data:
          type: intptr_t

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ2

    DTQ1:
      type   : DATAQUEUE
      dtqcnt : 3
      stsklist:
       - TASK2:
           data: DATA_A
      datalist:
        - data: DATA_B
        - data: DATA_C
        - data: DATA_D

    DTQ2:
      type: DATAQUEUE

  do:
    id     : TASK1
    syscall: rcv_dtq(DTQ1, &data)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    DTQ1:
      stsklist:
      datalist:
        - data: DATA_C
        - data: DATA_D
        - data: DATA_A
