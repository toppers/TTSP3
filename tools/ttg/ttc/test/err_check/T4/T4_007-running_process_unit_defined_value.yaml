version: "$Id: T4_007-running_process_unit_defined_value.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_sys_manage_iget_tid_b_1:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      var    :
          p_tskid :
            type : ID

    TASK1:
      type   : TASK
      tskstat: running
      var    :
        data:
          type: intptr_t

  do:
    id     : ALM1
    syscall: iget_tid(&p_tskid)
    ercd   : E_OK

  post_condition:
    ALM1:
      almstat: TALM_STP
      hdlstat: ACTIVATE
      var    :
        p_tskid :
          value: TASK1

    TASK1:
      var:
        data:
          value: TASK1
