version: "$Id: T4_026-wtsklist_mismatch_wobjid-mailbox.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mailbox_snd_mbx_d_1_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var    :
        msg:
          type: T_MSG

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MBX2
      var    : 
        pk_msg:
          type: "T_MSG*"

    MBX1:
      type    : MAILBOX
      mbxatr  : TA_NULL
      wtsklist:
        - TASK2:
            var: pk_msg

    MBX2:
      type: MAILBOX

  do:
    id     : TASK1
    syscall: snd_mbx(MBX1, &msg)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      wobjid :
      var    :
        pk_msg:
          value: "&msg"

    MBX1:
      wtsklist:
