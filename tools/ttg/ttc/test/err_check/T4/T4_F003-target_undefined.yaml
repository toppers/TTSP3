version: "$Id: T4_F003-target_undefined.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_task_manage_mig_tsk_F_f_2_1_3_5:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK3

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: mig_tsk(TSK_SELF, PRC_OTHER)

  post_condition:
    TASK1:
      tskstat: ready
      prcid  : PRC_OTHER
