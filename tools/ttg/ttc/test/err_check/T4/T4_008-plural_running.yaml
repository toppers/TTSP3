version: "$Id: T4_008-plural_running.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_chg_pri_e_1_1_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: running

  do:
    id     : TASK1
    syscall: chg_pri(TSK_SELF, TSK_PRI_HIGH)

  post_condition:
    TASK1:
      tskstat: running

    TASK2:
      tskstat: running
