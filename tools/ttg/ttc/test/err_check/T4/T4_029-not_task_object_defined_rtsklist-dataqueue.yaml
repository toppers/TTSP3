version: "$Id: T4_029-not_task_object_defined_rtsklist-dataqueue.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_f_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK2:
            var: ttg_data
        - ALM1:
            var: ttg_data

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        ttg_data:
          value: DATA_A

    DTQ1:
      rtsklist:
        - ALM1:
            var: ttg_data
