version: "$Id: T4_F005-spinlock_unlock.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_d_6_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running-suspended
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      actcnt : 1
