version: "$Id: T4_F001-undefined_cpu_state.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_alarm_sta_alm_F_a_1_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_CTX

  post_condition:
