version: "$Id: T4_006-plural_CPU_STATE.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_alarm_sta_alm_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: STP

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: sta_alm(ALM1, RELATIVE_TIME_A)
    ercd   : E_CTX

  post_condition:
