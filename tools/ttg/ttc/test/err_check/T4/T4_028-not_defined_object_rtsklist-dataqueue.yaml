version: "$Id: T4_028-not_defined_object_rtsklist-dataqueue.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_snd_dtq_f_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : DTQ1
      var    :
        ttg_data:
          type: intptr_t

    DTQ1:
      type    : DATAQUEUE
      dtqcnt  : 0
      rtsklist:
        - TASK3:
            var: ttg_data

  do:
    id     : TASK1
    syscall: snd_dtq(DTQ1, DATA_A)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      var    :
        ttg_data:
          value: DATA_A

    DTQ1:
      rtsklist:
