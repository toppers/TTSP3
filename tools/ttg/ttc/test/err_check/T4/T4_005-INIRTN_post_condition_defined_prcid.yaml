FMP_sys_manage_sns_ker_F_a:
  pre_condition:
    INI1:
      type : INIRTN
      exinf: EXINF_A
      do   :
        syscall: sns_ker()
        bool   : true
      prcid: PRC_OTHER
      class: CLS_OTHER_ONLY_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

  do:
    id     : TASK1
