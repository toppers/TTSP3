version: "$Id: T4_034-not_activate.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_except_ena_tex_d_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: STP
      pndptn : TEXPTN_A

  do:
    id     : TASK1
    syscall: ena_tex()
    ercd   : E_OK

  post_condition:
    TEX1:
      texstat: TTEX_DIS
      hdlstat: ACTIVATE
      texptn : TEXPTN_A
      pndptn : 0
