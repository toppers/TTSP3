version: "$Id: T4_032-not_activate_check_variable.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_get_mpf_h_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk1:
          type: void*

    MPF1:
      type   : MEMORYPOOL
      blkcnt : 0
      fblkcnt: 0
      blksz  : ANY_BLKSZ

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk1)
    ercd   : E_OK

  post_condition:
    TASK1:
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      fblkcnt: 1
      mpf    : blk1
