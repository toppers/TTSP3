version: "$Id: T4_038-not_running_task_defined_inthdr.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_interrupt_ena_int_F_c:
  pre_condition:
    INH1:
      type   : INTHDR
      intatr : TA_ENAINT
      intno  : INTNO_SELF_INH_B
      intpri : INT_PRI_MID
      inhno  : INHNO_SELF_B
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
      prcid  : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

  do:
    id     : INH1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt: 1
