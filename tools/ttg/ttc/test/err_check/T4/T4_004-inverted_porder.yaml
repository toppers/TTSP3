version: "$Id: T4_004-inverted_porder.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_sys_manage_rot_rdq_c_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_MID
      porder : 2

    TASK2:
      type   : TASK
      tskstat: ready
      tskpri : TSK_PRI_MID
      porder : 1

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: true

  do:
    id     : TASK1
    syscall: rot_rdq(TPRI_SELF)

  post_condition:
    TASK1:
      tskstat: ready
      porder: 2

    TASK2:
      tskstat: running
      porder: 1
