version: "$Id: T4_021-undefined_task_object.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_ext_tsk_b_1_1:
  pre_condition:
    TASK1:
      type    : TASK
      tskstat : running
      itskpri : TSK_PRI_LOW
      tskpri  : TSK_PRI_MID
      actcnt  : 1
      wupcnt  : 1

    TEX1:
      type   : TASK_EXC
      task   : TASK3
      texstat: TTEX_DIS
      hdlstat: STP
      pndptn : TEXPTN_A

    TASK2:
      type    : TASK
      tskstat : ready
      tskpri  : TSK_PRI_MID

  do:
    id     : TASK1
    syscall: ext_tsk()

  post_condition:
    TASK1:
      tskstat : ready
      tskpri  : TSK_PRI_LOW
      actcnt  : 0
      wupcnt  : 0
      bootcnt : 1

    TEX1:
      pndptn : 0

    TASK2:
      tskstat : running
