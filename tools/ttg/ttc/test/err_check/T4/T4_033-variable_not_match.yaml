version: "$Id: T4_033-variable_not_match.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_get_mpf_h_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var    :
        blk1:
          type: intptr_t

    MPF1:
      type   : MEMORYPOOL
      blkcnt : 2
      fblkcnt: 2
      blksz  : ANY_BLKSZ

  do:
    id     : TASK1
    syscall: get_mpf(MPF1,&blk1)
    ercd   : E_OK

  post_condition:
    MPF1:
      fblkcnt: 1
      mpf    : blk1
