version: "$Id: T7_004-class-multipleA.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ISR_sample_2:
  pre_condition:
    ISR1:
      type   : ISR
      intno  : INTNO_SELF_ISR_B
      intpri : ANY_INT_PRI
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
      isrpri : ISR_PRI_MID
      exinf  : 0x03
      class  : CLS_SELF_ONLY_SELF

    TASK1:
      type   : TASK
      tskstat: running

  do:
    id     : ISR1
    syscall: iact_tsk(TASK1)
    ercd   : E_OK

  post_condition:
    TASK1:
      actcnt : 1
