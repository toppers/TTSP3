version: "$Id: T7_002-intpri-multipleA.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_interrupt_dis_int_d_1:
  variation:
    api_support_dis_int: true

  pre_condition:
    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : ANY_INT_PRI
      inhno  : INHNO_SELF_A
      intstat: TA_ENAINT
      hdlstat: STP

    TASK1:
      type   : TASK
      tskstat: running

    CPU_STATE:
      type   : CPU_STATE
      loc_cpu: false

  do_0:
    id     : TASK1
    syscall: dis_int(INTNO_SELF_INH_A)
    ercd   : E_OK

  post_condition_0:
    INH1:
      intstat: TA_DISINT

  do_1:
    id     : TASK1
    code   : ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_1:

  do_2:
    id     : TASK1
    syscall: ena_int(INTNO_SELF_INH_A)

  post_condition_2:
    INH1:
      intstat: TA_ENAINT
      hdlstat: ACTIVATE
