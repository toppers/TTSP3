version: "$Id: T7_F001-spinlock_num-multipleA.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_a_1:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_SELF

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_SELF_ALL

  do:
    id     : ALM1
    syscall: loc_spn(SPN1)
    ercd   : E_CTX

  post_condition:
