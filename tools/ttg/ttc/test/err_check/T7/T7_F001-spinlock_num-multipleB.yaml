version: "$Id: T7_F001-spinlock_num-multipleB.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_a_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL
      class  : CLS_OTHER_ALL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: loc_spn(SPN1)
    ercd   : E_CTX

  post_condition:
