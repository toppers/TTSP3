version: "$Id: T3_SCO001-wtsklist_duplicate-mempfix.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_ini_mpf_c_1_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : MPF1

    MPF1:
      type: MEMORYPOOL
      blkcnt: ANY_INI_BLKCNT
      fblkcnt: 0
      wtsklist:
        - TASK2:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_mpf(MPF1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    MPF1:
      fblkcnt: ANY_INI_BLKCNT
      wtsklist:
