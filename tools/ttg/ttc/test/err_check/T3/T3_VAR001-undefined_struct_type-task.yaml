version: "$Id: T3_VAR001-undefined_struct_type-task.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rtsk:
          type: T_RTSK

  do:
    id     : TASK1
    syscall: ref_tsk(TASK1,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          tskstat: TTS_RUN
          tskpri : TSK_PRI_MID
          tskbpri: TSK_PRI_MID
          actcnt : 0
          wupcnt : 0
          invalid: undefined
