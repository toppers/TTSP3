version: "$Id: T3_ALM002-waitspin_undefined_spinid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_spin_lock_iloc_spn_F_d:
  pre_condition:
    ALM1:
      type   : ALARM
      almstat: TALM_STP
      hdlstat: ACTIVATE
      prcid  : PRC_OTHER

    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK1

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_OTHER

  do_0:
    id     : ALM1
    syscall: iloc_spn(SPN1)
    ercd   : E_OK
    gcov   : true

  post_condition_0:
    ALM1:
      hdlstat: ACTIVATE-waitspin

  do_1:
    id     : TASK1
    syscall: unl_spn(SPN1)
    ercd   : E_OK
    gcov   : false

  post_condition_1:
    ALM1:
      hdlstat: ACTIVATE

    SPN1:
      spnstat: TSPN_LOC
      procid : ALM1

    CPU_STATE1:
      loc_cpu: false

    CPU_STATE2:
      loc_cpu: true
