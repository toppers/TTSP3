version: "$Id: T3_SCO001-rtsklist_duplicate-pridataq.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_pridataq_snd_pdq_g_1_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1
      var    :
        ttg_data:
          type: intptr_t
        ttg_pri:
          type: PRI

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 0
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri

  do:
    id     : TASK1
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready
      wobjid :

    PDQ1:
      rtsklist:
