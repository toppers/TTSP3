version: "$Id: T3_TSK007-dormant_defined_lefttmo.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_manage_act_tsk_d_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      lefttmo: 0

  do:
    id     : TASK1
    syscall: act_tsk(TASK2)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      tskpri : TSK_PRI_HIGH
