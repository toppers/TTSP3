version: "$Id: T3_INH002-waitspin_undefined_spinid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_interrupt_ena_int_F_d:
  variation:
    api_support_ena_int: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    INH1:
      type   : INTHDR
      intno  : INTNO_SELF_INH_A
      intpri : ANY_INT_PRI
      inhno  : INHNO_SELF_A
      intstat: TA_DISINT
      hdlstat: STP
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do_0:
    id     : TASK1
    code   : ttsp_int_raise(INTNO_SELF_INH_A)

  post_condition_0:

  do_1:
    id     : TASK1
    syscall: ena_int(INTNO_SELF_INH_A)

  post_condition_1:
    INH1:
      intstat: TA_ENAINT
      hdlstat: ACTIVATE

  do_2:
    id     : INH1
    syscall: spn_loc(SPN1)

  post_condition_2:
    INH1:
      hdlstat: ACTIVATE-waitspin
