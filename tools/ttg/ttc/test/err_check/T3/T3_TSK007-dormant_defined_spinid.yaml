version: "$Id: T3_TSK007-dormant_defined_spinid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_task_manage_act_tsk_F_c_1_5:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      prcid  : PRC_OTHER

    TASK3:
      type   : TASK
      itskpri: TSK_PRI_HIGH
      tskstat: dormant
      prcid  : PRC_OTHER
      spinid : SPN1

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK3

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do:
    id     : TASK1
    syscall: act_tsk(TASK3)
    ercd   : E_OK

  post_condition:
    TASK3:
      tskstat: ready
      tskpri : TSK_PRI_HIGH
