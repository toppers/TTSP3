version: "$Id: T3_VAR003-member_defined_value-task.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_task_refer_ref_tsk_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rtsk:
          type: T_RTSK

  do:
    id     : TASK1
    syscall: ref_tsk(TASK1,&rtsk)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rtsk:
          value: 1
