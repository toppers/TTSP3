version: "$Id: T3_VAR003-member_defined_value-pridataq.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_pridataq_ref_pdq_c_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rpdq:
          type: T_RPDQ

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type   : P_DATAQUEUE
      pdqcnt : 0
      rtsklist:
        - TASK2:
      datalist:

  do:
    id     : TASK1
    syscall: ref_pdq(PDQ1,&rpdq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rpdq:
          value: 1
