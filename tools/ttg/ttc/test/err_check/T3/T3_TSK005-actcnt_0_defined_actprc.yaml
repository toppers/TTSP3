version: "$Id: T3_TSK005-actcnt_0_defined_actprc.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_task_manage_ter_tsk_F_c_1_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      tskpri : TSK_PRI_HIGH
      prcid  : PRC_SELF

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: ready
      actcnt : 0
      actprc : PRC_OTHER
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: running
      actcnt : 0
      bootcnt: 1
      actprc : TPRC_NONE
      prcid  : PRC_OTHER
