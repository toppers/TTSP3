version: "$Id: T3_CYC002-ACTIVATE_undefined_TCYC_STA.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_cyclic_sta_cyc_c:
  note: TESRY_002

  variation:
    gcov_all: true

  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STP
      hdlstat : STP
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

  do:
    0:
      id     : TASK1
      syscall: sta_cyc(CYC1)
      ercd   : E_OK

  post_condition:
    0:
      CYC1:
        cycstat : TCYC_STA
        hdlstat : STP

    RELATIVE_TIME_A+(RELATIVE_TIME_B*0)+1:
      CYC1:
        cycstat : TCYC_STP
        hdlstat : ACTIVATE
        bootcnt : 0
