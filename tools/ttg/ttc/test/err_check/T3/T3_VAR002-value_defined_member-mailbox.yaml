version: "$Id: T3_VAR002-value_defined_member-mailbox.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mailbox_ref_mbx_c_4:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rmbx:
          type: intptr_t

    MBX1:
      type   : MAILBOX
      mbxatr : TA_NULL
      msglist: 
        - msg: msg

  do:
    id     : TASK1
    syscall: ref_mbx(MBX1, &rmbx)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmbx:
          pk_msg: (T_MSG*)(&msg)
