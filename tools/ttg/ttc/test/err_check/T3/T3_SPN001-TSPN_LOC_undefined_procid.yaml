version: "$Id: T3_SPN001-TSPN_LOC_undefined_procid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
FMP_spin_lock_loc_spn_F_c:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_UNL

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

  do:
    id     : TASK1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition:
    SPN1:
      spnstat: TSPN_LOC

    CPU_STATE1:
      loc_cpu: true
