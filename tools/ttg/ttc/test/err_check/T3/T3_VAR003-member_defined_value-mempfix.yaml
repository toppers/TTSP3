version: "$Id: T3_VAR003-member_defined_value-mempfix.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rmpf:
          type: T_RMPF

    MPF1:
      type    : MEMORYPOOL
      fblkcnt : 1
      wtsklist: 

  do:
    id     : TASK1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmpf:
          value: 1
