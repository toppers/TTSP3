version: "$Id: T3_TEX004-ACTIVATE-waitspin_not_defined_spinid.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
TEX_ACTIVATE_4_waitspin:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      prcid  : PRC_SELF

    TEX1:
      type   : TASK_EXC
      task   : TASK1
      texstat: TTEX_ENA
      hdlstat: ACTIVATE
      texptn : 0x01
      pndptn : 0

    TASK2:
      type   : TASK
      tskstat: running
      prcid  : PRC_OTHER

    SPN1:
      type   : SPINLOCK
      spnstat: TSPN_LOC
      procid : TASK2

    CPU_STATE1:
      type   : CPU_STATE
      loc_cpu: false
      prcid  : PRC_SELF

    CPU_STATE2:
      type   : CPU_STATE
      loc_cpu: true
      prcid  : PRC_OTHER

  do_0:
    id     : TEX1
    syscall: loc_spn(SPN1)
    ercd   : E_OK

  post_condition_0:
    TEX1:
      hdlstat: ACTIVATE-waitspin

  do_1:
    id     : TASK2
    syscall: unl_spn(SPN1)
    ercd   : E_OK

  post_condition_1:
    TEX1:
      hdlstat: ACTIVATE

    SPN1:
      procid: TEX1

    CPU_STATE1:
      loc_cpu: true

    CPU_STATE2:
      loc_cpu: false
