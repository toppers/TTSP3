version: "$Id: T3_VAR002-value_defined_member-semaphore.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_semaphore_ref_sem_c_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rsem:
          type: intptr_t

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      type   : SEMAPHORE
      semcnt : 0
      wtsklist:
        - TASK2:

  do:
    id     : TASK1
    syscall: ref_sem(SEM1, &rsem)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rsem:
          wtskid : TASK2
          semcnt : 0
