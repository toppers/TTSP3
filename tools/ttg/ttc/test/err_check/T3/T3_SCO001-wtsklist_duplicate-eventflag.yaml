version: "$Id: T3_SCO001-wtsklist_duplicate-eventflag.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_eventflag_ini_flg_c_1_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : FLG1

    FLG1:
      type   : EVENTFLAG
      iflgptn: BIT_PATTERN_0A
      flgptn : BIT_PATTERN_0B
      wtsklist:
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A
        - TASK2:
            waiptn: BIT_PATTERN_A
            wfmode: WAIT_FLG_MODE_A

  do:
    id     : TASK1
    syscall: ini_flg(FLG1)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running

    FLG1:
      flgptn : BIT_PATTERN_0A
      wtsklist:
