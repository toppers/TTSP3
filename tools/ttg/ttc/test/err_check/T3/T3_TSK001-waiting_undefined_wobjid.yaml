ASP_task_manage_ter_tsk_e_2:
  pre_condition:
    TASK1:
      type    : TASK
      tskstat : running

    TASK2:
      type   : TASK
      tskstat: waiting
      actcnt : 0

  do:
    id     : TASK1
    syscall: ter_tsk(TASK2)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: dormant
