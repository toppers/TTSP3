version: "$Id: T3_SCO001-wtsklist_duplicate-semaphore.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_semaphore_ini_sem_c_1_3:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : SEM1

    SEM1:
      type   : SEMAPHORE
      maxsem : ANY_MAX_SEMCNT
      isemcnt: ANY_INI_SEMCNT
      semcnt : 0
      wtsklist:
        - TASK2:
        - TASK2:

  do:
    id     : TASK1
    syscall: ini_sem(SEM1)
    ercd   : E_OK

  post_condition:
    TASK2:
      tskstat: ready

    SEM1:
      semcnt : ANY_INI_SEMCNT
      wtsklist:
