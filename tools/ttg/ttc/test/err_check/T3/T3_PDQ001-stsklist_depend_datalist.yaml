version: "$Id: T3_PDQ001-stsklist_depend_datalist.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_pridataq_rcv_pdq_f_2_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running
      var:
        data:
          type: intptr_t 
        datapri:
          type: PRI

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1

    PDQ1:
      type: P_DATAQUEUE
      pdqcnt : 3
      maxdpri : DATA_PRI_MAX
      stsklist : 
        - TASK2:
              data:     DATA_A
              datapri:  DATA_PRI_HIGH
      datalist : 
        - data:     DATA_B
          datapri:  DATA_PRI_MID
        - data:     DATA_C
          datapri:  DATA_PRI_MID

  do:
    id     : TASK1
    syscall: rcv_pdq(PDQ1, &data, &datapri)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      wobjid : 

    PDQ1:
      stsklist : 
      datalist : 
        - data:     DATA_A
          datapri:  DATA_PRI_HIGH
        - data:     DATA_C
          datapri:  DATA_PRI_MID
        - data:     DATA_D
          datapri:  DATA_PRI_LOW
