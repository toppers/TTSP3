version: "$Id: T3_PDQ002-rtsklist_depend_datalist.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_pridataq_snd_pdq_g_1_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskpri : TSK_PRI_MID
      tskstat: running

    TASK2:
      type   : TASK
      tskpri : TSK_PRI_HIGH
      tskstat: waiting
      wobjid : PDQ1
      var    : 
        ttg_data:
          type: intptr_t
        ttg_pri :
          type: PRI

    PDQ1:
      type    : P_DATAQUEUE
      pdqcnt  : 1
      rtsklist:
        - TASK2:
            vardata: ttg_data
            varpri : ttg_pri
      datalist:
        - data   : DATA_C
          datapri: DATA_PRI_HIGH

  do:
    id     : TASK1
    syscall: snd_pdq(PDQ1, DATA_A, DATA_PRI_HIGH)

  post_condition:
    TASK1:
      tskstat: ready

    TASK2:
      tskstat: running
      wobjid :
      var    :
        ttg_data:
          value: DATA_A
        ttg_pri :
          value: DATA_PRI_HIGH

    PDQ1:
      rtsklist:
