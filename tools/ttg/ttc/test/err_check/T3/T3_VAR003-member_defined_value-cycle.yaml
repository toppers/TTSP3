version: "$Id: T3_VAR003-member_defined_value-cycle.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_cyclic_ref_cyc_c_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rcyc:
          type: T_RCYC

    CYC1:
      type    : CYCLE
      cycstat : TCYC_STA
      hdlstat : STP
      cycphs  : RELATIVE_TIME_A
      cyctim  : RELATIVE_TIME_B

  do:
    id     : TASK1
    syscall: ref_cyc(CYC1, &rcyc)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rcyc:
          value: 1
