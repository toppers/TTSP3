version: "$Id: T3_VAR002-value_defined_member-mempfix.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_mempfix_ref_mpf_c_1:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rmpf:
          type: intptr_t

    MPF1:
      type    : MEMORYPOOL
      fblkcnt : 1
      wtsklist: 

  do:
    id     : TASK1
    syscall: ref_mpf(MPF1, &rmpf)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rmpf:
          wtskid : TSK_NONE
          fblkcnt: 1
