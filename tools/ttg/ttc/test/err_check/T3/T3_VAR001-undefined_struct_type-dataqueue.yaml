version: "$Id: T3_VAR001-undefined_struct_type-dataqueue.yaml 6 2018-12-10 02:19:09Z fujisft-shigihara $"
ASP_dataqueue_ref_dtq_c_2:
  pre_condition:
    TASK1:
      type   : TASK
      tskstat: running
      var:
        rdtq:
          type: T_RDTQ

    TASK2:
      type   : TASK
      tskstat: waiting
      wobjid : DTQ1

    DTQ1:
      type: DATAQUEUE
      dtqcnt : 0
      rtsklist:
        - TASK2:
      datalist:

  do:
    id     : TASK1
    syscall: ref_dtq(DTQ1, &rdtq)
    ercd   : E_OK

  post_condition:
    TASK1:
      var:
        rdtq:
          stskid: TSK_NONE
          rtskid: TASK2
          sdtqcnt: 0
          invalid: undefined
